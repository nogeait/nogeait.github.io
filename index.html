<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Héritiers de l'Aube</title>
<style>
  :root { --bg:#161a24; --panel:#232a38; --panel2:#2c3446; --text:#ece6d6; --muted:#a59f8f; --gold:#e8b94a; --pa:#4aa3ff; --pm:#5ad16a; --red:#e2554a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,sans-serif; overflow:hidden; user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; }
  #top { display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:2px solid #11151d; min-height:46px; flex-wrap:wrap; }
  #top .lbl { color:var(--gold); font-weight:600; margin-right:8px; font-size:14px; }
  .chip { display:flex; align-items:center; gap:6px; padding:3px 9px; border-radius:14px; background:var(--panel2); font-size:13px; border:2px solid transparent; }
  .chip.cur { border-color:var(--gold); }
  .chip .dot { width:10px; height:10px; border-radius:50%; }
  .chip.dead { opacity:.35; text-decoration:line-through; }
  #mapZoom { position:absolute; left:12px; top:12px; display:flex; gap:6px; } #mapZoom .btn { margin:0; padding:4px 14px; font-size:20px; line-height:1; }
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
  #cv { width:min(100%, calc((100vh - 170px) * 1.607)); aspect-ratio:900/560; display:block; cursor:pointer; }
  #log { position:absolute; right:10px; top:10px; width:290px; max-height:45%; overflow:hidden; font-size:12.5px; line-height:1.35; background:rgba(20,24,33,.75); border-radius:8px; padding:8px; color:#cfc8b6; pointer-events:none; }
  #log div { margin:2px 0; opacity:.6; } #log div:nth-last-child(-n+3) { opacity:1; color:#f3ead2; }
  #banner { position:absolute; left:50%; top:16px; transform:translateX(-50%); background:rgba(20,24,33,.85); padding:6px 18px; border-radius:8px; font-weight:600; color:var(--gold); pointer-events:none; transition:opacity .3s; }
  #bottom { display:flex; align-items:center; gap:14px; padding:8px 12px; background:var(--panel); border-top:2px solid #11151d; flex-wrap:wrap; }
  #hero { min-width:190px; }
  #hero .name { font-weight:600; }
  #hero .name small { display:block; font-weight:600; font-size:12px; color:var(--gold); }
  .bar { height:10px; background:#11151d; border-radius:5px; overflow:hidden; margin:4px 0; }
  .bar > div { height:100%; background:linear-gradient(90deg,#c93d33,#ef6b5b); }
  .res { display:flex; gap:10px; font-weight:700; }
  .res .pa { color:var(--pa); } .res .pm { color:var(--pm); }
  #spells { display:flex; gap:8px; }
  .spell { position:relative; width:138px; padding:6px 8px; background:var(--panel2); border:2px solid #3a4459; border-radius:8px; color:var(--text); cursor:pointer; text-align:left; font:inherit; font-size:12px; }
  .spell:hover:not(:disabled) { border-color:#7d8db0; }
  .spell.sel { border-color:var(--gold); background:#3a3a2c; }
  .spell:disabled { opacity:.4; cursor:default; }
  .spell b { display:block; font-size:12.5px; padding-right:6px; }
  .spell .ico { height:30px; margin:0 6px 0 0; image-rendering:pixelated; flex:none; }
  .spell { display:flex; align-items:center; }
  .cls .por { float:right; width:48px; height:84px; image-rendering:pixelated; margin-left:8px; }
  .spell .k { position:absolute; top:3px; right:6px; color:var(--muted); font-size:11px; }
  .spell .c { color:var(--pa); font-weight:700; }
  #spells.many { gap:6px; } #spells.many .spell { width:104px; padding:5px 5px; font-size:11.5px; } #spells.many .spell b { font-size:12px; } #spells.many .spell .ico { height:26px; margin-right:4px; }
  .rkp { display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle; } .rkp button { width:20px; height:18px; padding:0; border-radius:4px; border:1px solid #3a4459; background:#11151d; color:var(--muted); font:inherit; font-size:11px; cursor:pointer; }
  .rkp button.own { background:#3a3a2c; color:var(--gold); border-color:#7a6a3a; } .rkp button.cur { outline:2px solid var(--gold); color:#fff; }
  .spuse { color:#9fb3d6; } .sppre { color:#8fe39b; }
  #endturn { margin-left:auto; padding:10px 18px; font:inherit; font-weight:700; border:none; border-radius:8px; background:var(--gold); color:#2a2110; cursor:pointer; }
  #endturn:disabled { opacity:.4; cursor:default; }
  #hint { width:100%; font-size:12px; color:var(--muted); min-height:16px; }
  #overlay { position:fixed; inset:0; background:rgba(10,12,18,.88); display:flex; overflow:auto; padding:16px 0; z-index:10; }
  #overlay > .box { margin:auto; }
  .chip.hov { outline:2px solid #fff; }
  #overlay.hide { display:none; }
  .box { background:var(--panel); border:2px solid #3a4459; border-radius:14px; padding:26px 30px; max-width:680px; width:calc(100% - 32px); text-align:center; }
  .box h1 { margin:0 0 4px; color:var(--gold); font-size:30px; }
  .box h2 { margin:0 0 10px; color:var(--gold); }
  .box p { color:#cfc8b6; line-height:1.45; }
  .classes { display:flex; gap:14px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
  .cls { width:260px; padding:14px; border-radius:10px; background:var(--panel2); border:2px solid #3a4459; cursor:pointer; text-align:left; color:var(--text); font:inherit; }
  .cls:hover { border-color:var(--gold); }
  .cls h3 { margin:0 0 6px; color:var(--gold); }
  .cls ul { margin:6px 0 0; padding-left:18px; font-size:13px; color:#cfc8b6; }
  .btn { padding:10px 22px; font:inherit; font-weight:700; border:none; border-radius:8px; background:var(--gold); color:#2a2110; cursor:pointer; margin:6px; }
  .btn.alt { background:var(--panel2); color:var(--text); }
  .help { font-size:12px; color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; margin:4px 0; }
  .filters .btn.sm.on { outline:2px solid var(--gold); }
  .filters .lbl { font-size:12px; color:var(--muted); margin-right:2px; }
  .box.wide { max-width:900px; max-height:calc(100vh - 32px); overflow:auto; text-align:left; }
  .box.wide h2, .box.wide > p { text-align:center; }
  .box h3 { margin:14px 0 6px; color:var(--gold); font-size:15px; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin:8px 0; text-align:left; }
  .item { display:flex; gap:10px; align-items:center; background:var(--panel2); border:2px solid #3a4459; border-radius:10px; padding:8px; font-size:13px; }
  .item.empty { opacity:.55; border-style:dashed; min-height:62px; }
  .item img { width:36px; height:36px; object-fit:contain; image-rendering:pixelated; flex:none; }
  .item .txt { flex:1; min-width:0; } .item .txt b { display:block; } .item small { display:block; color:var(--muted); }
  .item .act { display:flex; flex-direction:column; gap:4px; }
  .btn.sm { padding:5px 10px; font-size:12px; margin:0; white-space:nowrap; }
  .item .btn.alt { background:#3e4860; }
  .btn:disabled { opacity:.45; cursor:default; }
  img.coin { width:12px; height:14px; image-rendering:pixelated; vertical-align:-2px; }
  .loot { display:flex; align-items:center; justify-content:center; gap:14px; font-size:18px; color:var(--gold); }
  .loot .chest { width:48px; height:48px; image-rendering:pixelated; }
  .statline { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-weight:600; margin:8px 0; }
  .scene { display:flex; gap:20px; align-items:flex-start; }
  .scene .portrait { width:96px; height:168px; image-rendering:pixelated; flex:none; background:var(--panel2); border-radius:12px; padding:8px; }
  .scene .say { flex:1; } .scene .say h2 { text-align:left; margin:2px 0 8px; } .scene .say p { font-size:16px; text-align:left; }
  .scene .who { color:var(--muted); font-size:13px; }
  .goal, .reward { background:var(--panel2); border-radius:8px; padding:8px 12px; }
  .lvup { color:var(--pm); font-weight:700; }
  .pts { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; margin:8px 0; text-align:left; }
  .pts .item .btn.sm { min-width:34px; }
  .pts.one { grid-template-columns:1fr; } .pts .act .btn.sm.alt { min-width:28px; padding:2px 6px; }
  .spkey { width:20px; text-align:center; font-weight:700; color:var(--gold); flex:none; }
  .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--pm); color:#10202a; font-size:12px; line-height:18px; }
  .quest { background:var(--panel2); border-radius:10px; padding:10px 12px; margin:6px 0; border-left:4px solid #3a4459; }
  .quest.main { border-left-color:var(--gold); } .quest b { display:block; } .quest small { display:block; color:var(--muted); }
  #topbtns { display:none; margin-left:auto; align-items:center; gap:12px; color:var(--gold); font-weight:600; }
  body.map #topbtns { display:flex; }
  #topbtns .btn { margin:0; padding:6px 14px; }
  #menuWrap { position:relative; }
  #menuList { display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:30; flex-direction:column; gap:4px; padding:6px; background:var(--panel); border:2px solid #11151d; border-radius:8px; box-shadow:0 6px 18px #0008; min-width:200px; }
  #menuWrap.open #menuList { display:flex; }
  #menuList .btn { text-align:left; width:100%; }
  #menuBtn.dot::after { content:''; display:inline-block; width:9px; height:9px; margin-left:6px; border-radius:50%; background:var(--pm); vertical-align:middle; }
  #sndBtn { margin:0 0 0 auto; padding:6px 10px; } body.map #sndBtn { margin-left:12px; } #musBtn { margin:0; padding:6px 10px; }
  body.map #log, body.map #hero, body.map #spells, body.map #endturn, body.map #timeline { display:none !important; }
  body.map #cv { cursor:default; }
  .foes { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .foes span { background:var(--panel2); padding:4px 10px; border-radius:12px; font-size:13px; }
  #dbg { position:fixed; top:56px; right:12px; width:290px; max-height:calc(100vh - 70px); overflow:auto; background:#1b1f2b; border:2px solid #e05a5a; border-radius:10px; padding:10px 12px; z-index:20; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #dbg.hide { display:none; }
  #dbg h3 { margin:0 0 6px; color:#ff8a7a; font-size:15px; }
  #dbg h4 { margin:10px 0 4px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  #dbg .row { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  #dbg select { font:inherit; font-size:12px; background:var(--panel2); color:var(--text); border:1px solid #444; border-radius:6px; padding:4px; max-width:100%; }
  #dbg .btn.on { background:#e05a5a; color:#fff; }
  #dbg .note { color:var(--muted); font-size:11px; margin-top:8px; }
  .namebox { text-align:center; margin:10px 0 4px; font-weight:600; }
  .namebox input { font:inherit; font-size:16px; padding:7px 12px; border-radius:8px; border:2px solid #3a4459; background:var(--panel2); color:var(--text); width:230px; }
  .namebox input.need { border-color:#e2554a; }
  .story p, .guide li { line-height:1.45; } .guide { padding-left:20px; color:#cfc8b6; }
  .keys { border-collapse:collapse; margin:4px 0; } .keys td { padding:4px 10px; border-bottom:1px solid #3a4459; color:#cfc8b6; } .keys td:first-child { white-space:nowrap; }
  kbd { display:inline-block; min-width:18px; text-align:center; padding:1px 6px; border:1px solid #5a6680; border-bottom-width:3px; border-radius:5px; background:var(--panel2); color:var(--text); font:600 12px Segoe UI, sans-serif; }
  .chars { display:flex; flex-direction:column; gap:6px; margin:6px 0 4px; text-align:left; }
  .charrow { display:flex; align-items:center; gap:10px; background:var(--panel2); border:2px solid #3a4459; border-radius:10px; padding:6px 10px; }
  .charrow img { height:34px; image-rendering:pixelated; } .charrow .txt { flex:1; } .charrow .txt b { display:block; } .charrow small { color:var(--muted); }
  .charrow .btn { margin:0; } .charrow .btn.sm { padding:6px 10px; font-size:17px; }
  .savecode { width:100%; height:70px; font:12px monospace; background:var(--panel2); color:var(--text); border:2px solid #3a4459; border-radius:8px; padding:6px; resize:vertical; word-break:break-all; }
  #hfToast { position:absolute; right:12px; top:12px; display:flex; gap:10px; align-items:center; background:rgba(20,24,33,.95); border:2px solid var(--gold); border-radius:10px; padding:8px 14px; max-width:320px; z-index:20; pointer-events:none; opacity:0; transform:translateY(-10px); transition:opacity .3s, transform .3s; }
  #hfToast.on { opacity:1; transform:none; }
  #hfToast .ic, .feat .ic { font-size:26px; } #hfToast b { display:block; color:var(--gold); } #hfToast small { display:block; font-size:12px; opacity:.85; }
  .feats { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:8px; }
  .feat { display:flex; gap:10px; align-items:center; background:var(--panel2); border:2px solid #3a4459; border-radius:8px; padding:6px 10px; opacity:.6; }
  .feat.got { opacity:1; border-color:#f4c84a99; } .feat.got b { color:var(--gold); } .feat .txt { flex:1; } .feat small { display:block; font-size:12px; }
  .feat .pts { font-weight:700; color:var(--gold); } .fbar { height:5px; background:#222a38; border-radius:3px; margin-top:3px; } .fbar div { height:100%; background:var(--pm); border-radius:3px; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="lbl" id="fightname"></span><div id="timeline" style="display:flex;gap:6px;flex-wrap:wrap"></div><div id="topbtns"><span id="gold"></span><button class="btn" id="worldBtn">Carte (M)</button><div id="menuWrap"><button class="btn" id="menuBtn" title="Quêtes, équipement, personnage…">☰ Menu</button><div id="menuList"><button class="btn" id="questBtn">Quêtes (Q)</button><button class="btn" id="bagBtn">Équipement (E)</button><button class="btn" id="charBtn">Personnage (C)</button><button class="btn" id="storyBtn">Histoire (H)</button><button class="btn" id="featBtn">Hauts faits (F)</button><button class="btn" id="jobBtn">Métiers (J)</button><button class="btn" id="lootBtn">Butins (D)</button><button class="btn" id="guideBtn">Guides (G)</button><button class="btn" id="saveBtn" title="Exporter ou importer la sauvegarde">💾 Sauvegarde</button></div></div></div><button class="btn" id="sndBtn">🔊</button><button class="btn" id="musBtn">🎵</button></div>
  <div id="stage">
    <canvas id="cv" width="900" height="560"></canvas>
    <div id="log"></div>
    <div id="banner" style="opacity:0"></div>
    <div id="hfToast"></div>
    <div id="mapZoom" style="display:none"><button class="btn" id="zoomOut" title="Voir toutes les régions (molette)">−</button><button class="btn" id="zoomIn" title="Revenir à la région (molette)">+</button></div>
  </div>
  <div id="bottom">
    <div id="hero">
      <div class="name" id="hname"></div>
      <div class="bar"><div id="hpbar"></div></div>
      <div class="res"><span id="hhp"></span><span class="pa" id="hpa"></span><span class="pm" id="hpm"></span></div>
    </div>
    <div id="spells"></div>
    <button id="endturn">Fin du tour (Espace)</button>
    <div id="hint"></div>
  </div>
</div>
<div id="overlay"></div>
<div id="dbg" class="hide"></div>

    const q = op==='put' ? st.put(val, 'saveFile') : op==='del' ? st.delete('saveFile') : st.get('saveFile');
    q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch (e) { res(null); } };

const G = { grid:null, units:[], turn:0, round:1, hero:null, sel:null, hover:null, busy:false, over:true, token:0, zone:null, seed:0, mode:'menu', profile:null, reach:null, mapHero:null, mapHover:null, travel:false, scenes:[] };

function heroStats(p) {
  const c = CLASSES[p.cls], lv = p.level;
  const g = gearTotals(p);
  const t = charPoints(p).pts, ml = mealBonus(p);
  return { hp: Math.round((c.hp + (lv-1)*LV_HP + t.vit*CARACS.vit.per + g.vie) * (1 + ml.vie/100)), pa: c.pa + (lv>=5) + (lv>=10) + (lv>=20) + g.pa, pm: c.pm + (lv>=3) + (lv>=15) + (lv>=25) + g.pm,
    mul: 1 + (lv-1)*LV_DMG + (t.for*CARACS.for.per + g.puissance + ml.puissance)/100, res: Math.min(50, g.resistance + Math.floor(t.sag*CARACS.sag.per)), crit: Math.min(0.3, CRIT_CHANCE + t.agi*CARACS.agi.per/100) };
}
// ---------- Points de caractéristique et de sort (gagnés à chaque niveau) ----------
const LV_HP = 4, LV_DMG = 0.05;                 // gain automatique par niveau, le reste vient des points
const CARAC_PER_LV = 5, SPELL_PTS_PER_LV = 1, SPELL_MAX_RANK = 5;
const CARACS = {
  vit: { name:'Vitalité', per:2, desc:'+2 PV max par point' },
  for: { name:'Force', per:2, desc:'+2 % de dégâts et de soins par point' },
  agi: { name:'Agilité', per:0.5, desc:'+0,5 % de chance de coup critique par point (30 % au plus)' },
  sag: { name:'Sagesse', per:0.5, desc:'+1 % de résistance tous les 2 points (50 % au plus, équipement compris)' },
};
const spellRankCost = r => r - 1;               // passer au rang r coûte r-1 points (façon Dofus)
function charPoints(p) {
  p.pts = Object.assign({ vit:0, for:0, agi:0, sag:0 }, p.pts); p.ranks = p.ranks || {};
  const spent = Object.values(p.pts).reduce((a,b) => a+b, 0);
  let sspent = 0; for (const r of Object.values(p.ranks)) for (let k=2; k<=r; k++) sspent += spellRankCost(k);
  const free = (p.level-1)*CARAC_PER_LV - spent, sfree = (p.level-1)*SPELL_PTS_PER_LV - sspent;
  if (free < 0) for (const k in p.pts) p.pts[k] = 0;   // niveau baissé (mode test) : on rend les points
  if (sfree < 0) p.ranks = {};
  return { pts:p.pts, ranks:p.ranks, free: free < 0 ? (p.level-1)*CARAC_PER_LV : free, sfree: sfree < 0 ? (p.level-1)*SPELL_PTS_PER_LV : sfree };
}
const spellRank = (p, sp) => Math.max(1, Math.min(SPELL_MAX_RANK, (p.ranks && p.ranks[sp.id]) || 1));
// copie du sort améliorée selon son rang : dégâts et soins +8 % par rang, recharge -1 aux rangs 3 et 5, effets plus forts
function rankedSpell(sp, r) {
  if (r <= 1) return Object.assign({}, sp, { rank:1 });
  const o = Object.assign({}, sp, { rank:r }), k = 1 + 0.08*(r-1); let d = sp.desc;
  const sw = (a, b) => { d = d.replace(a, b); };
  if (sp.dmg) { o.dmg = sp.dmg.map(v => Math.round(v*k)); sw(`${sp.dmg[0]}-${sp.dmg[1]} dégâts`, `${o.dmg[0]}-${o.dmg[1]} dégâts`); }
  if (sp.heal) { o.heal = sp.heal.map(v => Math.round(v*k)); sw(`${sp.heal[0]}-${sp.heal[1]} PV`, `${o.heal[0]}-${o.heal[1]} PV`); }
  if (sp.cd) { o.cd = Math.max(1, sp.cd - (r>=3) - (r>=5)); sw(`Recharge ${sp.cd} tours`, o.cd > 1 ? `Recharge ${o.cd} tours` : 'Recharge 1 tour'); }
  if (sp.effect==='rage' || sp.effect==='shield') { o.val = sp.val + 5*(r-1); sw(`+${sp.val} %`, `+${o.val} %`); }
  if (sp.effect==='pm') { o.val = sp.val + (r>=2) + (r>=4); sw(`+${sp.val} PM`, `+${o.val} PM`); }
  if (sp.effect==='tp') { o.maxR = sp.maxR + (r>=2) + (r>=4) + (r>=5 && sp.cd<=2); sw(`${sp.minR}-${sp.maxR} cases`, `${sp.minR}-${o.maxR} cases`); }
  o.desc = d + ` (rang ${r}/${SPELL_MAX_RANK})`;
  return o;
}
// coût et limites d'un sort : « 3 PA · 2 lancers par tour · relance 3 tours »
function spellUseText(sp) {
  const t = [`${sp.pa} PA`];
  if (!sp.self) t.push(`portée ${sp.minR}-${sp.maxR}${sp.los ? '' : ' sans ligne de vue'}`);
  t.push(sp.perTurn ? `${sp.perTurn} lancer${sp.perTurn>1?'s':''} par tour` : sp.cd ? '1 lancer par tour' : 'lancers illimités par tour');
  if (sp.cd) t.push(`relance ${sp.cd} tour${sp.cd>1?'s':''}`);
  return t.join(' · ');
}
function rankGainText(sp, r) { return rankDiffText(sp, r-1, r); }
function rankDiffText(sp, ra, rb) {
  const a = rankedSpell(sp, ra), b = rankedSpell(sp, rb), t = [];
  if (sp.dmg) t.push(`${a.dmg[0]}-${a.dmg[1]} → ${b.dmg[0]}-${b.dmg[1]} dégâts`);
  if (sp.heal) t.push(`${a.heal[0]}-${a.heal[1]} → ${b.heal[0]}-${b.heal[1]} PV`);
  if (sp.cd && a.cd !== b.cd) t.push(`recharge ${a.cd} → ${b.cd} tours`);
  if (sp.val != null && a.val !== b.val) t.push(`${a.val} → ${b.val} ${sp.effect==='pm' ? 'PM' : '%'}`);
  if (sp.effect==='tp' && a.maxR !== b.maxR) t.push(`portée ${a.maxR} → ${b.maxR}`);
  return t.join(', ') || 'aucun changement';

// ordre des sorts choisi par le joueur (écran Personnage) : il fixe la barre de combat et les raccourcis & é " ' ( §
function spellOrder(p) { const all = CLASSES[p.cls].spells; const o = (p.order || []).map(id => all.find(s => s.id===id)).filter(Boolean);
  return o.concat(all.filter(s => !o.includes(s))); }
const heroSpells = p => { const pr = gearTotals(p).portee;
  return spellOrder(p).filter(sp => !sp.lvl || p.level >= sp.lvl).map(sp => withRange(rankedSpell(sp, spellRank(p, sp)), pr)); };
// Portée donnée par l'équipement : seulement pour les sorts « portée modifiable » (jamais le corps à corps)
function withRange(sp, pr) {
  if (!sp.modR) return sp;
  const o = Object.assign({}, sp, { maxR: sp.maxR + pr });
  const d = sp.desc.replace(`${sp.minR}-${sp.maxR}`, `${sp.minR}-${o.maxR}`), note = ` Portée modifiable${pr ? ` (+${pr} par l'équipement)` : ''}.`;
  o.desc = d.includes(' (rang') ? d.replace(' (rang', note + ' (rang') : d + note;
  return o;
}
// répartition automatique (bouton du joueur et robot de test) : surtout Vitalité et Force, un peu d'Agilité et de Sagesse
function autoPoints(p) {
  const cp = charPoints(p), w = { vit:0.4, for:0.4, agi:0.1, sag:0.1 };
  for (let n = cp.free; n > 0; n--) { const tot = Object.values(p.pts).reduce((a,b) => a+b, 0) + 1;
    const k = Object.keys(w).sort((a,b) => (p.pts[a]/tot - w[a]) - (p.pts[b]/tot - w[b]))[0]; p.pts[k]++; }
  let sf = cp.sfree;
  for (;;) { const c = heroSpells(p).map(sp => CLASSES[p.cls].spells.find(s => s.id===sp.id)).filter(sp => spellRank(p, sp) < SPELL_MAX_RANK)
      .sort((a,b) => spellRank(p,a) - spellRank(p,b) || !!b.dmg - !!a.dmg)[0];
    if (!c || spellRankCost(spellRank(p, c)+1) > sf) break;
    sf -= spellRankCost(spellRank(p, c)+1); p.ranks[c.id] = spellRank(p, c)+1; }
}

// ---------- Grille ----------
const inB = (x,y) => x>=0 && y>=0 && x<W && y<H;
const unitAt = (x,y) => G.units.find(u => u.alive && u.x===x && u.y===y);
const walkable = (x,y) => inB(x,y) && G.grid[y][x]===0 && !unitAt(x,y);
const HERO_SPAWN = [10,10];

function genMap() {
  for (let tries=0; tries<200; tries++) {
    const g = Array.from({length:H}, () => Array(W).fill(0));
    const n = rnd(12,18);
    for (let i=0;i<n;i++) {
      const x = rnd(0,W-1), y = rnd(0,H-1);
      if (x>=8 && y>=8) continue;          // zone du héros
      if (x<=4 && y<=4 && Math.random()<.6) continue; // zone ennemie un peu dégagée
      g[y][x] = Math.random()<.6 ? 1 : 2;  // 1 = rocher, 2 = eau
    }
    // connexité : toutes les cases libres doivent être accessibles
    let free = 0; for (const r of g) for (const c of r) if (c===0) free++;
    const seen = new Set([key(...HERO_SPAWN)]), q = [HERO_SPAWN];
    while (q.length) { const [x,y] = q.pop(); for (const [a,b] of DIRS) { const nx=x+a, ny=y+b; if (inB(nx,ny) && g[ny][nx]===0 && !seen.has(key(nx,ny))) { seen.add(key(nx,ny)); q.push([nx,ny]); } } }

// ---------- Ligne de vue / déplacements ----------

// ---------- Tours ----------
async function runTurns(token) {
  while (!G.over && token===G.token) {
    const u = G.units[G.turn];
    if (u.alive) {
      beginTurn(u);
      if (!u.alive) { if (checkEnd()) return; }
      else if (u.team==='hero') await new Promise(r => G.endHeroTurn = r);
      else { await aiTurn(u, token); await sleep(250); }
      if (G.over || token!==G.token) return;
    }
    G.turn = (G.turn+1) % G.units.length;
    if (G.turn===0) G.round++;
  }
}

  for (const k in u.cds) { u.cds[k]--; if (u.cds[k]<=0) delete u.cds[k]; }
  G.sel = null;
  banner(u.team==='hero' ? `Tour ${G.round} · À toi de jouer !` : `Tour de ${u.name}`);
  if (u.team==='hero') play('tour');
  refreshReach(); updateUI(); hint(); dirty = true;
}

  if (!G.units.some(u => u.team==='enemy' && u.alive)) { G.over = true; setTimeout(showVictory, 700/SPEED); return true; }

// ---------- IA des monstres ----------
// Chaque monstre note toutes ses actions possibles (frapper, achever, empoisonner, soigner l'allié le plus blessé,
// protéger, invoquer, bondir, repousser, attirer…) et joue la meilleure. Les lanceurs gardent leurs distances

    const now = aiBest(u, u.x, u.y);
    // case d'où la meilleure action serait possible (si elle vaut mieux que ce qu'il peut faire sur place)

      const o = aiBest(u, n.x, n.y); if (!o) continue;
      const sc = o.score - n.d*1.5 + aiPlace(u, n.x, n.y);
      if (sc>bs) { bs=sc; best=n; } }
    if (now && (!best || now.score >= bs - 2)) { await aiShow(now.sp.self && !now.sp.zone ? [[u.x,u.y]] : zoneCells(now.sp,now.tx,now.ty), true); await cast(u,now.sp,now.tx,now.ty); if (checkEnd()) return; await sleep(220); continue; }

    if (!affordable(u,sp)) continue;

      if (here && G.units.filter(o => o.alive && o.summoner===u).length < sp.max && summonCell(u.x,u.y)) out.push({ sp, tx:u.x, ty:u.y, score: d <= 6 ? 20 : 8 });
    } else if (sp.heal && sp.ally) { // soigne l'allié le plus blessé (lui compris)
      for (const o of team) { const [ox,oy] = o===u ? [fx,fy] : [o.x,o.y];
        const miss = o.maxHp - o.hp; if (miss < o.maxHp*0.25 || !(o===u ? sp.minR===0 : can(sp,ox,oy))) continue;
        out.push({ sp, tx:ox, ty:oy, score: Math.min(miss, (sp.heal[0]+sp.heal[1])/2*u.mul)*1.3 + (miss/o.maxHp)*10 + (o.scale>1 ? 5 : 0) }); }
    } else if (sp.effect==='ward') {
      if (!(u.ward && u.ward.r >= G.round+1) && man(fx,fy,h.x,h.y) <= 5) out.push({ sp, tx:fx, ty:fy, score: 10 + (1-u.hp/u.maxHp)*12 });
    } else if (sp.effect==='tp') {

const isVolcano = () => G.zone && G.zone.region===6;

function buildBg() {
  const L = document.createElement('canvas'); L.width = Math.ceil(cv.width/PX); L.height = Math.ceil(cv.height/PX);
  const c = L.getContext('2d'), R = seeded(G.seed || 1);
  const px = (x,y,col) => { c.fillStyle=col; c.fillRect(x,y,1,1); };
  const bands = isVolcano() ? ['#1e1010','#261412','#2e1814','#361c16','#3e2018','#46241a'] : ['#1b2236','#1e263d','#212b45','#24304c','#273553','#2a3a5a'];
  bands.forEach((col,i) => { c.fillStyle=col; c.fillRect(0, Math.floor(i*L.height/bands.length), L.width, Math.ceil(L.height/bands.length)); });
  for (let i=0;i<70;i++) px(R()*L.width|0, R()*L.height|0, isVolcano() ? (R()<.5 ? '#7a3a1a' : '#5a2a14') : R()<.5 ? '#3a4a70' : '#33426a');
  const hw = r => r < LTH/2 ? 2*(r+1) : 2*(LTH-r);
  for (let s=0; s<=W+H-2; s++) for (let x=0; x<W; x++) { const y=s-x; if (!inB(x,y)) continue;
    const tx = LOX + (x-y)*LTW/2, ty = LOY + (x+y)*LTH/2, t = G.grid[y][x];
    // flancs de terre sur les bords visibles
    const sideL = y===H-1, sideR = x===W-1;
    for (let i=-LTW/2; i<LTW/2; i++) {
      if (i<0 && !sideL || i>=0 && !sideR) continue;
      const ey = i<0 ? ty + LTH/2 + Math.floor((i+LTW/2)/2) : ty + LTH - 1 - Math.floor(i/2);
      for (let k=1;k<=6;k++) px(tx+i, ey+k, k===1 ? (isVolcano() ? '#3a302c' : isNorth() ? '#c3d2dd' : '#3f7a2a') : (R()<.12 ? '#4a3020' : (i<0 ? '#7a5236' : '#5e3e28')));
    }
    const alt = (x+y)%2;
    for (let r=0;r<LTH;r++) for (let i=-hw(r); i<hw(r); i++) {
      let col;
      const v=R();
      if (t===3) col = isVolcano() ? (v<.15 ? '#3a302c' : '#5a4a40') : isNorth() ? (v<.15 ? '#a8a49a' : '#c2bcae') : (v<.12 ? '#8a6a3e' : v<.2 ? '#c09a62' : '#a8834f');
      else if (isVolcano()) col = t===2 ? (v<.1 ? '#ffd04a' : v<.16 ? '#c8400a' : '#ff6a1a') : (v<.1 ? '#2a2422' : v<.17 ? '#6a5a52' : (alt ? '#4a3e38' : '#463a34'));
      else if (isNorth()) col = t===2 ? (v<.1 ? '#e2f4fd' : v<.16 ? '#8cc6e6' : '#b4def3') : (v<.1 ? '#c3d2dd' : v<.17 ? '#ffffff' : (alt ? '#e6eef4' : '#dde7ee'));
      else if (t===2) col = v<.1 ? '#4f9ad8' : v<.16 ? '#2f6dab' : '#3a80c2';
      else col = v<.1 ? '#4c8a32' : v<.17 ? '#78bd50' : (alt ? '#62a843' : '#5ea13f');
      px(tx+i, ty+r, col);
    }
    const v = hash(x,y);
    if (t===2 && isVolcano()) { px(tx-3,ty+4,'#fff0a0'); px(tx-2,ty+4,'#fff0a0'); px(tx+3,ty+6,'#fff0a0'); }
    else if (t===2) { px(tx-3,ty+4,'#a8d8f8'); px(tx-2,ty+4,'#a8d8f8'); px(tx-1,ty+4,'#a8d8f8'); px(tx+3,ty+6,'#a8d8f8'); px(tx+4,ty+6,'#a8d8f8'); }
    else if (v>.7 && isVolcano()) { px(tx-2,ty+3,'#7a6a62'); px(tx+2,ty+5,'#1e1a18'); }
    else if (v>.7) { const tc = isNorth() ? '#9fb2c0' : '#3b7428'; const ox = tx-4+(v*40|0)%8, oy = ty+3+(v*70|0)%4; px(ox,oy,tc); px(ox+1,oy-1,tc); px(ox+2,oy,tc); px(ox+3,oy-1,tc); }
    else if (v<.08 && !isNorth() && !isVolcano()) { const col = v<.04 ? '#f4e36b' : '#f07aa0'; const ox = tx-3+(v*400|0)%6, oy = ty+4; px(ox,oy,col); px(ox+1,oy+1,'#fff4c8'); }
  }
  bg = document.createElement('canvas'); bg.width=cv.width; bg.height=cv.height;
  const g = bg.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(L, 0, 0, L.width*PX, L.height*PX);
}

function render(now) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg,0,0);
  const heroTurn = isHeroTurn();
  const h = G.hero;
  // surbrillances
  if (heroTurn && h) {
    if (G.sel && G.sel.self) {
      // sort sur soi : ta case à cliquer (et la zone touchée autour, s'il y en a une)
      const onMe = G.hover && G.hover[0]===h.x && G.hover[1]===h.y;
      if (G.sel.zone) drawCells(zoneCells(G.sel,h.x,h.y).map(([x,y]) => ({x,y})), onMe ? 'rgba(226,70,60,.6)' : 'rgba(226,70,60,.3)', 'rgba(255,205,195,.95)');
      drawCells([{x:h.x, y:h.y}], onMe ? 'rgba(255,210,74,.75)' : 'rgba(255,210,74,.45)', 'rgba(255,245,200,.95)');
    } else if (G.sel) {
      const sp = G.sel;
      const ok = [], ko = [];
      for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
        const d = man(h.x,h.y,x,y); if (d<sp.minR || d>sp.maxR || G.grid[y][x]===1) continue;
        (canCast(h,sp,x,y) ? ok : ko).push({x,y});
      }
      drawCells(ko, 'rgba(50,110,200,.22)', null);
      drawCells(ok, 'rgba(50,130,255,.5)', 'rgba(200,228,255,.95)');
      if (G.hover && canCast(h,sp,...G.hover)) drawCells(zoneCells(sp,...G.hover).map(([x,y]) => ({x,y})), 'rgba(226,70,60,.6)', 'rgba(255,205,195,.95)');
    } else if (G.reach && !previewUnit()) {
      drawCells([...G.reach.values()].filter(n => n.d>0), 'rgba(80,220,100,.42)', 'rgba(215,255,200,.95)');
      if (G.hover && G.reach.has(key(...G.hover))) drawCells(pathFrom(G.reach,...G.hover).map(([x,y]) => ({x,y})), 'rgba(40,170,60,.8)', null);
    }
  }
  // aperçu des déplacements d'une unité survolée (ennemi en orange, allié en bleu)
  if (G.aiShow) drawCells(G.aiShow.cells, G.aiShow.cast ? 'rgba(226,70,60,.6)' : 'rgba(240,90,40,.55)', 'rgba(255,215,180,.95)');
  const pu = previewUnit();
  if (pu) { const pm = (!G.over && G.units[G.turn]===pu) ? pu.pm : pu.maxPm;
    const cells = [...reachable(pu, pm).values()].filter(n => n.d>0);
    if (pu.team==='hero') drawCells(cells, 'rgba(60,140,255,.5)', 'rgba(200,230,255,.95)');
    else drawCells(cells, 'rgba(240,90,40,.5)', 'rgba(255,215,180,.95)'); }
  if (G.hover) { const [cx,cy]=iso(...G.hover); diamond(ctx,cx,cy,1); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.stroke(); }
  // entités triées par profondeur
  const ents = [];
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (G.grid[y][x]===1) ents.push({d:x+y, rock:[x,y]});
  for (const u of G.units) if (u.alive) ents.push({d:u.rx+u.ry+.01, u});
  ents.sort((a,b) => a.d-b.d);
  const cur = G.over ? null : G.units[G.turn];
  for (const e of ents) e.rock ? drawRock(...e.rock) : drawUnit(e.u, e.u===cur, now);
  // projectiles
  for (let i=projs.length-1;i>=0;i--) { const p=projs[i], k=(now-p.t0)/p.dur; if (k>=1) { projs.splice(i,1); continue; }
    const [ax,ay]=iso(p.fx,p.fy), [bx,by]=iso(p.tx,p.ty); const px=ax+(bx-ax)*k, py=ay+(by-ay)*k-40-Math.sin(Math.PI*k)*30;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=14; ctx.fillRect(px-6,py-6,12,12); ctx.fillStyle='#fff'; ctx.fillRect(px-3,py-3,6,6); ctx.shadowBlur=0; }
  // vie au survol, et PV restants (tête de mort si mort assurée) quand un sort vise la cible
  const pvs = dmgPreview();
  if (pvs.length) for (const {t,r,c} of pvs) { const lo = Math.max(0, t.hp-r[1]), hi = Math.max(0, t.hp-r[0]);
    const crit = `Critique -${c[0]} à ${c[1]}` + (c[0]>=t.hp ? ' : vaincu' : c[1]>=t.hp ? ' : peut tuer' : '');
    if (hi===0) hpLabel(t, 'Vaincu', '#ffd24a', true);
    else hpLabel(t, `${t.hp} → ${lo===hi ? hi : lo+' à '+hi} PV`, lo===0 ? '#ffb04a' : '#ff8a7a', false, crit); }
  else if (G.hover && !G.over) { const o = unitAt(...G.hover); if (o && o!==h) hpLabel(o, `${o.hp} / ${o.maxHp} PV`, '#f3ead2'); }
  // textes flottants
  ctx.textAlign='center'; ctx.font='bold 18px Segoe UI, sans-serif';
  for (let i=floats.length-1;i>=0;i--) { const f=floats[i], k=(now-f.t0)/1000; if (k>=1) { floats.splice(i,1); continue; }
    const [cx,cy]=iso(f.x,f.y); const ty = cy-100-k*30; ctx.globalAlpha=1-k*k; ctx.fillStyle='#111'; ctx.fillText(f.text,cx+1,ty+1); ctx.fillStyle=f.color; ctx.fillText(f.text,cx,ty); ctx.globalAlpha=1; }
}

// unité survolée dont on montre les cases accessibles (pas pendant la visée d'un sort)
function previewUnit() {
  if (!G.hover || G.over || G.busy) return null;
  const o = unitAt(...G.hover);
  if (!o || (isHeroTurn() && (G.sel || o===G.hero))) return null;
  return o;
}
// cases en un seul tracé : remplissage + liseré sombre puis liseré clair (lisible sur herbe comme sur neige)
function drawCells(cells, fill, edge) {
  if (!cells.length) return;
  ctx.beginPath();
  for (const n of cells) { const [cx,cy]=iso(n.x,n.y); ctx.moveTo(cx,cy-TH/2+1); ctx.lineTo(cx+TW/2-2,cy); ctx.lineTo(cx,cy+TH/2-1); ctx.lineTo(cx-TW/2+2,cy); ctx.closePath(); }
  ctx.fillStyle = fill; ctx.fill();
  if (!edge) return;
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  for (const n of cells) { const [cx,cy]=iso(n.x,n.y); ctx.moveTo(cx,cy-TH/2+4); ctx.lineTo(cx+TW/2-8,cy); ctx.lineTo(cx,cy+TH/2-4); ctx.lineTo(cx-TW/2+8,cy); ctx.closePath(); }
  ctx.strokeStyle = edge; ctx.lineWidth = 1.5; ctx.stroke();
}

const SKULL = ['.xxxxx.','xxxxxxx','x..x..x','x..x..x','xxx.xxx','.xxxxx.','.x.x.x.'];
function hpLabel(u, txt, col, skull, sub) {
  const [cx,cy] = iso(u.rx,u.ry);
  ctx.textAlign='center';
  if (sub) { ctx.font='bold 12px Segoe UI, sans-serif'; const w2 = ctx.measureText(sub).width+12;
    ctx.fillStyle='rgba(20,24,33,.88)'; ctx.fillRect(cx-w2/2, cy-114, w2, 18); ctx.fillStyle='#ffd04a'; ctx.fillText(sub, cx, cy-100); }
  ctx.font='bold 14px Segoe UI, sans-serif';
  const sw = skull ? 20 : 0, w = ctx.measureText(txt).width+14+sw, x0 = cx-w/2, y0 = cy-96;
  ctx.fillStyle='rgba(20,24,33,.88)'; ctx.fillRect(x0, y0, w, 21);
  if (skull) { ctx.fillStyle='#f3ead2'; SKULL.forEach((row,j) => [...row].forEach((ch,i) => { if (ch==='x') ctx.fillRect(x0+6+i*2, y0+3+j*2, 2, 2); })); }
  ctx.fillStyle = col; ctx.fillText(txt, cx+sw/2, y0+16);
}

function drawRock(x,y) {
  const [cx,cy]=iso(x,y), v=hash(y,x), tree = v>.55 && !isVolcano();
  const img = tree ? (isNorth() ? DECOR.snowTrees : DECOR.trees)[(v*30|0)%3] : DECOR.rocks[(v*30|0)%3];
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx,cy+3,tree?20:26,tree?8:10,0,0,7); ctx.fill();
  drawSprite(img, cx, cy + (tree ? 8 : 10), SC, v*100%2<1);
}

function drawUnit(u, isCur, now) {
  const [cx,cy] = iso(u.rx,u.ry), s = u.scale;
  ctx.globalAlpha = u.alpha ?? 1;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx,cy+2,17*s,7*s,0,0,7); ctx.fill();
  ctx.lineWidth = isCur ? 3 : 2; ctx.strokeStyle = isCur ? '#e8b94a' : (u.team==='hero' ? '#4aa3ff' : '#e2554a');
  ctx.beginPath(); ctx.ellipse(cx,cy+2,20*s,9*s,0,0,7); ctx.stroke();
  const hit = u.flash && now-u.flash < 260;
  const hitImg = hit && IMG[u.sprite+'_hit_anim_f0'];
  const img = hitImg || animFrame(u.sprite, u.moving, now, u.animOff);
  if (u.team==='hero') drawSprite(animFrame('forest', false, now, 1.5), cx - 30*u.face, cy+14, 3, u.face<0);
  drawSprite(img, cx, cy+6, SC, u.face<0, hit && !hitImg);
  // barre de vie
  const top = cy + 6 - (img ? img.height*SC : 60);
  const bw=40, by=top-10;
  ctx.fillStyle='#11151d'; ctx.fillRect(cx-bw/2-1,by-1,bw+2,7);
  ctx.fillStyle = u.team==='hero' ? '#4aa3ff' : '#e2554a'; ctx.fillRect(cx-bw/2,by,bw*u.hp/u.maxHp,5);
  ctx.globalAlpha = 1;
}

let lastTick = -1;
function frame(now) {
  const tick = Math.floor(now/140);
  if (tick !== lastTick) { lastTick = tick; dirty = true; } // animation des sprites (~7 images/s au repos)
  if (G.mode==='map' && (G.view==='scene' ? bg : mapBg) && (dirty || tweening)) { if (G.view==='scene') renderScene(now); else renderMap(now); dirty = false; }
  else if (G.mode==='fight' && bg && (dirty || tweening || floats.length || projs.length)) { render(now); dirty = false; }
  requestAnimationFrame(frame);
}

// ---------- Interface ----------
function buildSpellButtons() {
  const box = $('#spells'); box.innerHTML = ''; box.classList.toggle('many', G.hero.spells.length > 6);
  G.hero.spells.forEach((sp,i) => {
    const b = document.createElement('button'); b.className='spell'; b.id='sp-'+sp.id;
    b.title = sp.desc + '\n' + spellUseText(sp) + critLine(sp, G.hero);
    b.innerHTML = `<img class="ico" src="${SPRITES[sp.icon]}" alt=""><span class="k">${SPELL_KEYS[i]}</span><div><b>${sp.name}</b><span class="c">${sp.pa} PA</span> <span class="info"></span></div>`;
    b.onclick = () => selectSpell(i);
    box.appendChild(b);
  });
}
function selectSpell(i) {
  if (!isHeroTurn()) return;
  const sp = G.hero.spells[i]; if (!sp) return;
  if (!affordable(G.hero,sp)) return;
  G.sel = G.sel===sp ? null : sp; hint(); updateUI(); dirty = true;
}
function refreshReach() { G.reach = isHeroTurn() ? reachable(G.hero) : null; }
async function doHero(fn) {
  G.busy = true; G.sel = null; dirty = true; updateUI();
  await fn();
  G.busy = false;
  checkEnd(); refreshReach(); updateUI(); hint(); dirty = true;
}
function updateUI() {
  const h = G.hero; if (!h) return;
  const hn = $('#hname'), ti = heroTitle(); hn.textContent = h.name; if (ti) { const sm = document.createElement('small'); sm.textContent = `« ${ti} »`; hn.appendChild(sm); }
  $('#hpbar').style.width = (100*h.hp/h.maxHp)+'%';
  $('#hhp').textContent = `${h.hp}/${h.maxHp} PV`;
  $('#hpa').textContent = `${h.pa} PA`;
  $('#hpm').textContent = `${h.pm} PM`;
  const ht = isHeroTurn();
  h.spells.forEach(sp => { const b = $('#sp-'+sp.id); if (!b) return;
    b.disabled = !ht || !affordable(h,sp); b.classList.toggle('sel', G.sel===sp);
    b.querySelector('.info').textContent = sp.potion ? `· ×${jobs().cons[sp.potion]||0}` : h.cds[sp.id] ? `· ${h.cds[sp.id]} tour${h.cds[sp.id]>1?'s':''}` : (sp.perTurn ? `· ${sp.perTurn-(h.uses[sp.id]||0)}/${sp.perTurn}` : ''); });
  $('#endturn').disabled = !ht;
  $('#timeline').innerHTML = G.units.map((u,i) => `<div class="chip${i===G.turn&&!G.over?' cur':''}${u.alive?'':' dead'}" data-i="${i}"><span class="dot" style="background:${u.team==='hero'?'#4aa3ff':'#e2554a'}"></span>${u.team==='hero'?'Toi':u.name} ${u.alive?u.hp:0}</div>`).join('');
}
const SPELL_KEYS = ['&', 'é', '"', "'", '(', '§', 'è', '_', 'ç', 'à'];
function markChip() { const o = G.hover && unitAt(...G.hover); [...$('#timeline').children].forEach((c,i) => c.classList.toggle('hov', !!o && G.units[i]===o)); }
$('#timeline').addEventListener('mouseover', e => { const c = e.target.closest('.chip'); if (!c || G.mode!=='fight') return; const u = G.units[+c.dataset.i];
  if (u && u.alive) { G.hover = [u.x,u.y]; dirty = true; hint(); } });
$('#timeline').addEventListener('mouseleave', () => { if (G.mode==='fight') { G.hover = null; dirty = true; hint(); } });
function hint() {
  markChip();
  const h = G.hero; let t = '';
  if (G.hover) { const o = unitAt(...G.hover); if (o && o!==h) t = `${o.name} · ${o.hp}/${o.maxHp} PV · ${o.maxPa} PA · ${o.maxPm} PM. ${stateText(o)}Sorts : ${o.spells.map(sp => foeSpellText(o,sp)).join(' · ')}. `;
    else if (o && stateText(o)) t = stateText(o); }
  if (G.sel) {
    const pv = dmgPreview();
    if (pv.length) t = pv.map(({t:o,r,c}) => `${o.name} : ${r[0]===r[1] ? r[0] : r[0]+' à '+r[1]} dégâts (critique ${c[0]} à ${c[1]}), ` + (r[0]>=o.hp ? 'vaincu à coup sûr' : r[1]>=o.hp ? `peut être vaincu (${o.hp} PV)` : c[1]>=o.hp ? `il restera ${o.hp-r[1]} à ${o.hp-r[0]} PV, vaincu sur un critique` : `il restera ${o.hp-r[1]} à ${o.hp-r[0]} PV`)).join(' · ') + '. ';
    t += `${G.sel.name} : ${G.sel.desc}${critLine(G.sel, h)}` + (G.sel.self ? ' Clique sur ton personnage pour le lancer.' : '');
    if (G.hover && !canCast(h,G.sel,...G.hover)) { const d = man(h.x,h.y,...G.hover);
      t += (d<G.sel.minR||d>G.sel.maxR) ? ' (hors de portée)' : (G.grid[G.hover[1]][G.hover[0]]===1 ? '' : (G.sel.needEmpty && !walkable(...G.hover) ? ' (case occupée)' : ' (pas de ligne de vue)')); }
  } else if (!t && isHeroTurn()) t = `Clique sur une case verte pour te déplacer, ou choisis un sort (touches ${SPELL_KEYS.slice(0, G.hero.spells.length).join(' ')}). Clic droit ou Échap pour annuler.`;
  $('#hint').textContent = t;
}
let bannerTimer;
function banner(t) { const b=$('#banner'); b.textContent=t; b.style.opacity=1; clearTimeout(bannerTimer); bannerTimer=setTimeout(() => b.style.opacity=0, 1300); }
function log(t) { const l=$('#log'); const d=document.createElement('div'); d.textContent=t; l.appendChild(d); while (l.children.length>12) l.firstChild.remove(); }

function cellFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX-r.left)*cv.width/r.width, my = (e.clientY-r.top)*cv.height/r.height;
  const a = (mx-OX)/(TW/2), b = (my-OY)/(TH/2);
  const x = Math.floor((a+b)/2), y = Math.floor((b-a)/2);
  return inB(x,y) ? [x,y] : null;
}
cv.addEventListener('mousemove', e => { if (G.mode==='map') return mapMove(e); if (G.mode!=='fight') return; const c = cellFromEvent(e);
  if (String(c)!==String(G.hover)) { G.hover = c; dirty = true; hint(); } });
cv.addEventListener('mouseleave', () => { if (G.mode==='map') { G.mapHover = null; dirty = true; return; } G.hover = null; dirty = true; hint(); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); G.sel = null; dirty = true; updateUI(); hint(); });
cv.addEventListener('click', e => {
  if (G.mode==='map') return mapClick(e);
  if (!isHeroTurn()) return;
  const c = cellFromEvent(e); if (!c) return;
  const h = G.hero;
  if (G.sel) {
    const sp = G.sel;
    if (sp.self) { if (c[0]===h.x && c[1]===h.y) doHero(() => cast(h,sp,h.x,h.y)); else { G.sel = null; dirty = true; updateUI(); hint(); } }
    else if (canCast(h,sp,...c)) doHero(() => cast(h,sp,...c));
    else { G.sel = null; dirty = true; updateUI(); hint(); }
    return;
  }
  if (G.reach && G.reach.has(key(...c)) && G.reach.get(key(...c)).d>0) doHero(() => moveAlong(h, pathFrom(G.reach,...c)));
});
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') { if (e.key==='Enter' && e.target.id==='heroName' && $('#b1')) $('#b1').click(); return; }
  // la touche qui a ouvert un menu le referme

function genItem(tier, cls, slot, forcedRarity) {
  slot = slot || Object.keys(SLOTS)[rnd(0, Object.keys(SLOTS).length-1)];
  const r = Math.random() + Math.min(tier,9)*0.06 + Math.max(0,tier-9)*0.03; // rareté progressive : pas de Légendaire avant le Nord
  const rar = forcedRarity ?? (r>1.25 ? 3 : r>1.0 ? 2 : r>0.7 ? 1 : 0);
  const k = (1 + tier*0.35) * RARITIES[rar].mult;
  const roll = base => Math.max(1, Math.round(base*k*(0.8+Math.random()*0.4)));
  const st = {}, add = (s,v) => st[s] = (st[s]||0) + v;
  const lvl = Math.min(4, Math.floor(tier/2 + Math.random()));
  let name, icon;
  if (slot==='arme') { add('puissance', roll(4)); const pool = WEAPONS[cls], w = pool[Math.min(pool.length-1, Math.floor((Math.min(tier,9)/9*0.7 + Math.random()*0.3)*pool.length))]; icon = w[0]; name = w[1]; }
  else if (slot==='coiffe') { add('vie', roll(6)); icon = cls==='mage' ? 'chapeau' : 'casque'; name = ARMOR_NAMES.coiffe[cls][lvl]; }
  else if (slot==='anneau') { add('puissance', roll(2)); add('vie', roll(3)); icon = 'anneau'; name = ARMOR_NAMES.anneau[lvl]; }
  else if (slot==='amulette') { add('puissance', roll(3)); icon = 'amulette'; name = ARMOR_NAMES.amulette[lvl]; }
  else if (slot==='cape') { add('vie', roll(4)); add('resistance', roll(1)); icon = 'cape'; name = ARMOR_NAMES.cape[lvl]; }
  else { add('resistance', roll(2)); icon = 'bottes'; name = ARMOR_NAMES.bottes[lvl]; }
  for (let i=0; i<Math.min(rar,2); i++) { const s = ['vie','puissance','resistance'][rnd(0,2)]; add(s, roll(STATS[s][1]/2)); }
  if (rar===3) { if (slot==='arme') add('pa',1); else if (slot==='bottes') add('pm',1); else add('vie', roll(4)); } // équipement complet : au plus +1 PA et +1 PM
  if (rar===2 && slot==='bottes' && Math.random()<.5) add('pm',1);
  if (rar>=2 && (slot==='amulette' || slot==='coiffe') && Math.random()<.25) add('portee',1);
  const value = Math.round(Object.entries(st).reduce((a,[s,v]) => a + v*STATS[s][2], 0) * 1.2);
  return { id: G.profile.nextId++, slot, cls: (slot==='arme'||slot==='coiffe') ? cls : null, name: name + RARITIES[rar].suffix, rarity: rar, icon, stats: st, value };

function statText(st) { return Object.entries(st).filter(([,v]) => v).map(([s,v]) => `${v>0?'+':''}${v} ${STATS[s][0]}`).join(' · '); }
// Forest, le chat noir du héros : familier unique dont les bonus grandissent avec l'histoire.
// Indice 0 = début du jeu, indice i = après la i-ème quête principale (mineure : PV/dégâts/résistance, fin d'acte : PA/PM).
const FOREST_STEPS = [{vie:3},{vie:4},{puissance:2},{resistance:2},{vie:4},{puissance:2},{pm:1},{resistance:2},{vie:5},{puissance:2},{resistance:2},{vie:5},{pa:1},

// Collier de Forest : on l'améliore en donnant à Forest des ressources. Deux paliers par région : récolte du Paysan, minerai du Mineur,

// p.collar = niveau atteint (absent dans les anciennes sauvegardes = 0).

  {vie:14,puissance:5},{vie:16,puissance:5,resistance:1},{vie:18,puissance:6},{vie:20,puissance:6},{vie:22,puissance:7},{vie:24,puissance:8,resistance:1}];

  return `<h3>Collier de Forest</h3><div class="items"><div class="item" style="border-color:#b77dff88;grid-column:1/-1"><img src="${CAT_ICON}" alt=""><div class="txt">
    <b style="color:#c99bff">${lv ? COLLAR_NAMES[lv-1] : 'Collier simple'} · niveau ${lv}/${COLLAR.length}</b><small>${cur ? `Bonus du collier : ${cur}` : 'Pas encore de bonus : donne des ressources à Forest pour renforcer son collier.'}</small>

// Butin unique des boss : un objet par boss, plus fort qu'un Légendaire, qui tombe rarement à chaque victoire contre lui
const BOSS_DROP = 0.05;

function genBossItem(z, p) {

  for (const k of Object.keys(it.stats)) if (STATS[k][1]) it.stats[k] = Math.round(it.stats[k]*1.25);

function rollLoot(z, first) {

  for (let i=0;i<n;i++) items.push(Math.random() < SET_DROP ? genSetItem(z, p) : genItem(z.tier, p.cls));

// Répertoire du butin (touche D) : chaque combat gagné donne des objets tirés selon la zone ; on en déduit, pour chaque
// équipement, la chance de l'obtenir par combat dans chaque zone et les monstres qu'on y affronte
const LOOT_ICONS = { anneau:'anneau', bottes:'bottes', amulette:'amulette', cape:'cape' };
const lootPct = x => x < 0.001 ? '< 0,1 %' : (x*100).toLocaleString('fr-FR', { maximumFractionDigits: x < 0.1 ? 1 : 0 }) + ' %';

function lootSources() {
  const out = [];

    [base, ...(ZONE_PHASES[z.id] || []).map(ph => ({ ...base, ...ph }))].forEach(s => out.push({ ...s, id:z.id, region:base.region || 1 })); }
  return out;

  pool.forEach((w,k) => add(w[1], 'arme', w[0], g * Math.max(0, Math.min(k===L-1 ? Infinity : k+1, hi) - Math.max(k, lo)) / (hi-lo)));

  if (set) for (const [slot,name] of Object.entries(set.pieces)) add(name, slot, slot==='coiffe' ? (cls==='mage' ? 'chapeau' : 'casque') : slot==='arme' ? pool[0][0] : LOOT_ICONS[slot], SET_DROP/4, set.id);

function lootFilter() { return G.lootFilter || (G.lootFilter = { kind:'eq', slot:'', q:'', all:false }); }
function lootBookHtml() {

  const srcs = lootSources().filter(seen), foeNames = s => [...new Set(s.foes.map(k => MONSTERS[k].name))].join(', ');
  const match = (...txt) => !q || txt.some(x => x.toLowerCase().includes(q));
  if (f.kind==='res') {
    const rows = Object.entries(MONSTER_DROPS).map(([k,res]) => ({ k, res, zones: srcs.filter(s => s.foes.includes(k)) })).filter(r => r.zones.length)

      <small>Où : ${[...new Set(r.zones.map(s => s.name))].join(', ')}</small></div></div>`).join('') || '<p class="help">Aucune ressource ne correspond à ta recherche.</p>';

      <b${e.boss ? ' style="color:#ff5c8a"' : e.set ? ' style="color:#7fe08a"' : ''}>${e.name}</b><small>${SLOTS[e.slot]}${e.set ? ' · ' + setById(e.set).name + ' (au moins Rare)' : ''}${e.boss ? ' · Unique, butin rare de ' + MONSTERS[e.boss].name + ' (salle du boss)' : ''}</small>${lines}
      ${src.length > top.length ? `<small>… et ${src.length - top.length} autre${src.length - top.length > 1 ? 's' : ''} zone${src.length - top.length > 1 ? 's' : ''} avec moins de chance</small>` : ''}</div></div>`; }).join('')

// ---------- Métiers et fabrication (façon Dofus) ----------
// Trois métiers qui progressent séparément. On récolte dans les scènes (une ressource par métier et par zone hors villages,

    res:['Blé','Seigle des neiges','Lin des ruines','Herbe de lumière','Trèfle des fées','Piment de braise'] },
  bucheron: { name:'Bûcheron', icon:'🪓', desc:'Coupe les arbres. Fabrique des armes, des amulettes et des bottes.',
    res:['Frêne','Sapin','Saule','Chêne blanc','Bois de sylve','Bois de cendre'], mat:['de frêne','de sapin','de saule','de chêne blanc','de sylve','de cendre'],
    slots:['arme','amulette','bottes'] },
  mineur:   { name:'Mineur', icon:'⛏', desc:'Extrait les minerais. Fabrique des armes, des casques et des anneaux.',

    slots:['arme','coiffe','anneau'] },
};
const JOB_IDS = Object.keys(JOBS);
const resName = (job, t) => JOBS[job].res[t];
// consommables du Paysan : potion (rend un % des PV max en combat) et repas (+% PV et +% dégâts pendant MEAL_FIGHTS combats)
const CONS = {};
['Potion de soin','Potion des neiges','Élixir des ruines','Élixir de lumière','Élixir des fées','Élixir de braise'].forEach((name,t) => CONS['potion'+t] = { id:'potion'+t, kind:'potion', t, name, heal:0.25 + 0.05*t });
['Pain de blé','Pain de seigle','Galette de lin','Brioche dorée','Tarte au trèfle','Ragoût pimenté'].forEach((name,t) => CONS['repas'+t] = { id:'repas'+t, kind:'repas', t, name, vie:5 + 2*t, puissance:2 + t });
const consText = c => c.kind==='potion' ? `En combat : rend ${Math.round(c.heal*100)} % de tes PV max (2 PA, 1 fois par tour).` : `Repas : +${c.vie} % PV et +${c.puissance} % dégâts pendant ${MEAL_FIGHTS} combats.`;
// noms des objets fabriqués : [guerrier, mage]
const CRAFT_NAMES = { bucheron:{ arme:['Hache','Bâton'], amulette:['Amulette','Amulette'], bottes:['Sabots','Sabots'] },
  mineur:{ arme:['Épée','Sceptre'], coiffe:['Casque','Diadème'], anneau:['Anneau','Anneau'] } };
const CRAFT_ICONS = { bucheron:['weapon_axe','weapon_green_magic_staff'], mineur:['weapon_regular_sword','weapon_red_magic_staff'] };
const RECIPES = [];
for (let t=0; t<JOB_REQ.length; t++) {
  RECIPES.push({ id:'potion'+t, job:'paysan', t, cons:'potion'+t, need:{ ['paysan'+t]:4 }, xp:2*harvestXp(t) });
  RECIPES.push({ id:'repas'+t, job:'paysan', t, cons:'repas'+t, need:{ ['paysan'+t]:3, ['bucheron'+t]:1 }, xp:2*harvestXp(t) });
  for (const job of ['bucheron','mineur']) for (const slot of JOBS[job].slots)
    RECIPES.push({ id:job+slot+t, job, t, slot, need:{ [job+t]:8, [(job==='mineur' ? 'bucheron' : 'mineur')+t]:3 }, xp:4*harvestXp(t) });
}
// butin des monstres : chaque monstre vaincu laisse parfois une ressource (toujours pour les grands monstres et les chefs),
// et chaque recette en demande une, prise parmi les monstres de la région de son palier
const DROP_CHANCE = 0.5;
const MONSTER_DROPS = { gobelin:'Oreille de gobelin', chaman:'Plume de chaman', gluant:'Gelée gluante', orc:"Défense d'orc", ogre:"Dent d'ogre",
  squelette:'Os ancien', zombie:'Lambeau de zombie', givre:'Cœur de givre', orcmasque:'Masque brisé', necro:'Grimoire noir', diablotin:'Corne de diablotin',
  chort:'Sabot de chort', zombiegeant:'Os de géant', demon:'Corne démoniaque', ombre:"Essence d'ombre", gardien:'Éclat de miroir',
  fidele:'Médaillon du Soleil noir', pretre:'Encens noir', lezard:'Écaille de lézard', limace:'Bave de limace', pretresse:'Page volée',
  eclipse:"Fragment d'éclipse", eclaireur:'Flèche noire', pierre:'Cœur de pierre', bourreau:'Lame du bourreau', feufollet:'Lueur follette',
  bete:'Griffe corrompue', treant:'Écorce corrompue', champignon:'Spore géante', grandtreant:'Racine millénaire', salamandre:'Langue de salamandre',
  elemfeu:'Braise vive', golem:'Noyau de lave', ignarok:'Écaille de dragon' };
const dropPool = t => [...new Set(ZONES.filter(z => z.foes && regionOf(z.id)===t+1 && z.tier <= CRAFT_TIER[t]+1).flatMap(z => z.foes))].filter(k => MONSTER_DROPS[k] && !MONSTERS[k].big);
JOB_REQ.forEach((_,t) => { const pool = dropPool(t); RECIPES.filter(r => r.t===t).forEach((r,i) => { if (pool.length) r.need['m_'+pool[i % pool.length]] = r.slot ? 2 : 1; }); });
const ingName = id => id.startsWith('m_') ? MONSTER_DROPS[id.slice(2)] : resName(id.replace(/\d+$/,''), +id.match(/\d+$/)[0]);
function rollDrops() {
  const j = jobs(), got = {};
  for (const u of G.units) if (u.team==='enemy' && !u.alive && !u.summoned && MONSTER_DROPS[u.kind] && (MONSTERS[u.kind].big || Math.random() < DROP_CHANCE)) {
    const id = 'm_' + u.kind; j.res[id] = (j.res[id]||0) + 1; got[id] = (got[id]||0) + 1; }
  return got;
}
const dropsHtml = got => { const l = Object.entries(got); return l.length ? `<p class="help">🐾 Ressources de monstres : ${l.map(([id,n]) => `<b>${ingName(id)}</b> × ${n}`).join(' · ')} (métiers, touche J)</p>` : ''; };
const recipeName = (r, cls) => r.cons ? CONS[r.cons].name : `${CRAFT_NAMES[r.job][r.slot][cls==='mage' ? 1 : 0]} ${JOBS[r.job].mat[r.t]}`;
function jobs(p = G.profile) {
  const j = p.jobs || (p.jobs = {});
  for (const k of ['lv','xp','res','cons','cut']) j[k] = j[k] || {};
  for (const id of JOB_IDS) { j.lv[id] = j.lv[id] || 1; j.xp[id] = j.xp[id] || 0; }
  j.fights = j.fights || 0;

}
function jobXp(job, n) {
  const j = jobs(), ups = [];
  if (j.lv[job] >= JOB_MAX) return ups;
  j.xp[job] += n;
  while (j.lv[job] < JOB_MAX && j.xp[job] >= jobXpNeed(j.lv[job])) { j.xp[job] -= jobXpNeed(j.lv[job]); j.lv[job]++; ups.push(j.lv[job]); }
  if (j.lv[job] >= JOB_MAX) j.xp[job] = 0;
  return ups;
}
const mealBonus = p => { const m = p.jobs && p.jobs.meal, c = m && CONS[m.id]; return c ? { vie:c.vie, puissance:c.puissance } : { vie:0, puissance:0 }; };
// au début de chaque combat (pas entre deux salles d'un donjon) : les ressources repoussent, le repas s'use
function jobFightStart(room) {
  if (room > 1) return;
  const j = jobs(); j.fights++;
  if (j.meal && --j.meal.fights <= 0) j.meal = null;
}
// potion utilisable en combat : la meilleure que le héros possède, comme un sort de la barre
function potionSpells(p) {
  const j = p.jobs; if (!j || !j.cons) return [];
  const c = Object.values(CONS).filter(c => c.kind==='potion' && j.cons[c.id] > 0).pop(); if (!c) return [];
  return [{ id:'potion', potion:c.id, icon:'flask_big_red', name:c.name, pa:2, self:true, perTurn:1, healPct:c.heal,
    desc:`Boire une potion : rend ${Math.round(c.heal*100)} % de tes PV max. 1 fois par tour. Fabriquée par le Paysan.` }];
}
// ---- récolte dans les scènes ----
const nodeKey = (id, job) => id + ':' + job;
const nodeWait = (id, job) => { const c = jobs().cut[nodeKey(id, job)]; return c==null ? 0 : Math.max(0, JOB_REGROW - (jobs().fights - c)); };
function nodeText(id, n) {
  const J = JOBS[n.job], w = nodeWait(id, n.job), lv = jobs().lv[n.job];
  return `${J.icon} ${resName(n.job, n.t)}` + (lv < JOB_REQ[n.t] ? ` (${J.name} niv. ${JOB_REQ[n.t]} requis)` : w ? ` (repousse dans ${w} combat${w>1?'s':''})` : '');
}
function harvest(n) {
  const p = G.profile, j = jobs(), J = JOBS[n.job], id = p.pos;
  if (j.lv[n.job] < JOB_REQ[n.t]) { banner(`${J.name} niveau ${JOB_REQ[n.t]} requis`); return; }
  const w = nodeWait(id, n.job); if (w) { banner(`Repousse dans ${w} combat${w>1?'s':''}`); return; }
  const q = rnd(2,4) + Math.floor(j.lv[n.job]/10), xp = harvestXp(n.t), rid = n.job + n.t;
  j.res[rid] = (j.res[rid]||0) + q; j.cut[nodeKey(id, n.job)] = j.fights;
  const ups = jobXp(n.job, xp);
  play('swing'); if (ups.length) setTimeout(() => play('niveau'), 300);
  addSceneFloat(n.x, n.y, `+${q} ${resName(n.job, n.t)}`);
  banner(ups.length ? `${J.name} niveau ${ups[ups.length-1]} !` : `+${q} ${resName(n.job, n.t)} · ${J.name} +${xp} XP`);
  save(); dirty = true;

// ---- dessin des ressources et de l'atelier (pixel art généré une fois) ----
let JOB_ART = null;
function jobArt() {

  const ol = c => outline(c, '#1d140c');
  const WHEAT = ['#e8c25a','#d8c9a0','#8fb0ff','#fff0a0','#8be36a','#ff6a4a'], LEAF = ['#4f9a3a','#2f6a4a','#7fae5a','#e4e9d2','#3fd08a','#6a5656'],
    LEAF2 = ['#3a7a2a','#21513a','#5f8e40','#b9c2a4','#22a86a','#4a3a3a'], ORE = ['#e07a3a','#c9d2e0','#f4f8ff','#ffd04a','#4ae08a','#9a5aff'];
  const stalks = (px, col, cut) => { for (const sx of [2,5,8,11,13]) { const h = cut ? 2 : 9 + (sx*7)%4;
    for (let y=15; y>15-h; y--) px(sx, y, '#7a8c3a'); if (!cut) for (let y=15-h; y<19-h; y++) { px(sx-1,y,col); px(sx+1,y,col); px(sx,y-1,col); } } };

    for (let y=0;y<16;y++) for (let x=0;x<18;x++) { const dx = x-8.5, dy = (y-7.5)*1.15; if (dx*dx+dy*dy < 64) px(x,y, (x*3+y*5)%7===0 || dx > 3 ? LEAF2[t] : LEAF[t]); } };
  const rock = (px, t) => { for (let y=2;y<14;y++) for (let x=1;x<19;x++) { const dx = (x-9.5)/9, dy = (y-8)/6; if (dx*dx+dy*dy < 1) px(x,y, y<6 ? '#a09a92' : x>12 ? '#6e6962' : '#8a847c'); }
    if (t!=null) for (const [x,y] of [[5,6],[9,9],[13,7],[7,11],[12,11],[10,5]]) { px(x,y,ORE[t]); px(x+1,y,ORE[t]); px(x,y+1,ORE[t]); } };

  }
  JOB_ART.cut = { paysan: ol(pixelCanvas(16,16, px => stalks(px, null, true))),
    bucheron: ol(pixelCanvas(12,8, px => { for (let y=2;y<8;y++) for (let x=2;x<10;x++) px(x,y, y===2 ? '#c49a62' : x>6 ? '#4e3119' : '#6b4524'); })),
    mineur: ol(pixelCanvas(20,14, px => rock(px, null))) };
  JOB_ART.bench = ol(pixelCanvas(24,18, px => {
    for (let x=0;x<24;x++) for (let y=6;y<9;y++) px(x,y, y===6 ? '#b07a42' : '#8a5a32');
    for (const lx of [2,20]) for (let y=9;y<18;y++) { px(lx,y,'#6b4524'); px(lx+1,y,'#4e3119'); }
    for (let x=4;x<11;x++) for (let y=2;y<6;y++) px(x,y, y===2 ? '#b8bcc4' : '#6d727c');   // enclume
    for (let x=6;x<9;x++) px(x,1,'#9aa3b5');
    for (let y=0;y<6;y++) px(16,y,'#8a5a32'); for (let x=14;x<19;x++) px(x,0,'#9aa3b5');    // marteau
    for (let x=12;x<14;x++) for (let y=3;y<6;y++) px(x,y,'#e8c25a');                        // gerbe

function drawJobThings(s, now, hv, ents, tags) {
  const A = jobArt();
  for (const n of s.nodes || []) ents.push({ d:n.x+n.y, f:() => { const [cx,cy] = iso(n.x,n.y), ok = !nodeWait(s.id, n.job);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx,cy+3,18,7,0,0,7); ctx.fill();
    // cercle doré si l'on peut récolter, gris si le niveau manque ou si la ressource repousse
    ctx.strokeStyle = ok && jobs().lv[n.job] >= JOB_REQ[n.t] ? `rgba(232,185,74,${.55+.3*Math.sin(now/300)})` : 'rgba(170,170,180,.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(cx,cy+2,20,9,0,0,7); ctx.stroke();
    drawSprite(ok ? A[n.job][n.t] : A.cut[n.job], cx, cy+8, SC);
    if (hv && hv.kind==='node' && hv.n===n) tags.push([nodeText(s.id, n), cx, cy-(n.job==='bucheron' ? 84 : 58)]); } });
  if (s.bench) { const [x,y] = s.bench; ents.push({ d:x+y, f:() => { const [cx,cy] = iso(x,y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx,cy+3,26,9,0,0,7); ctx.fill();
    drawSprite(A.bench, cx, cy+10, SC); if (hv && hv.kind==='bench') tags.push(['Atelier', cx, cy-58]); } }); }
  const f = G.sFloat;
  if (f) { const k = (now - f.at) / 1200; if (k >= 1 || f.zone!==s.id) G.sFloat = null; else { const [cx,cy] = iso(f.x,f.y); tags.push([f.t, cx, cy - 70 - k*30, '#ffe08a']); } }
}
// ---- fenêtre Métiers (J) : métiers, ressources et consommables, fabrication à l'atelier ----
function haveAll(r) { const j = jobs(); return Object.entries(r.need).every(([id,n]) => (j.res[id]||0) >= n); }
function craft(r) {
  const p = G.profile, j = jobs();
  if (!nearBench() || j.lv[r.job] < JOB_REQ[r.t] || !haveAll(r)) return;
  if (r.slot && p.inv.length >= BAG_MAX) return flashMsg('Sac plein : vends ou équipe un objet avant de fabriquer.');
  for (const [id,n] of Object.entries(r.need)) j.res[id] -= n;
  let msg;
  if (r.slot) {
    const rar = j.lv[r.job] >= Math.min(JOB_MAX, JOB_REQ[r.t] + 10) && Math.random() < .3 ? 2 : 1;
    const it = genItem(CRAFT_TIER[r.t], p.cls, r.slot, rar);
    it.name = recipeName(r, p.cls); it.crafted = r.job;
    if (r.slot==='arme') it.icon = CRAFT_ICONS[r.job][p.cls==='mage' ? 1 : 0];
    p.inv.push(it); msg = `Tu as fabriqué : ${it.name} (${RARITIES[rar].name}). Il est dans ton sac.`;
  } else { j.cons[r.cons] = (j.cons[r.cons]||0) + 1; msg = `Tu as fabriqué : ${CONS[r.cons].name} (tu en as ${j.cons[r.cons]}).`; }
  const ups = jobXp(r.job, r.xp);
  play('equip'); if (ups.length) setTimeout(() => play('niveau'), 300);
  save(); refreshMapTitle(); showJobs('fab');
  flashMsg(msg + ` ${JOBS[r.job].name} +${r.xp} XP` + (ups.length ? `, niveau ${ups[ups.length-1]} !` : '.'));
}
function eatMeal(id) {
  const j = jobs(); if (!(j.cons[id] > 0)) return;
  j.cons[id]--; j.meal = { id, fights:MEAL_FIGHTS };
  play('soin'); save(); showJobs('res');
  flashMsg(`Tu as mangé : ${CONS[id].name}. +${CONS[id].vie} % PV et +${CONS[id].puissance} % dégâts pendant tes ${MEAL_FIGHTS} prochains combats.`);
}
function showJobs(tab) {
  const p = G.profile, j = jobs(), bench = nearBench();
  tab = G.jobTab = tab || G.jobTab || 'jobs';
  const jf = G.jobFilter = G.jobFilter || 'paysan';
  const tb = (k, label) => `<button class="btn sm alt${tab===k ? ' on' : ''}" data-jtab="${k}">${label}</button>`;
  let body = '';
  if (tab==='jobs') body = `<div class="items">${JOB_IDS.map(id => { const J = JOBS[id], lv = j.lv[id], max = lv >= JOB_MAX;
    return `<div class="item"><div class="ic" style="font-size:28px">${J.icon}</div><div class="txt"><b>${J.name} niv. ${lv}${max ? ' (max)' : ''}</b><small>${J.desc}</small>
      ${max ? '' : `<div class="fbar"><div style="width:${100*j.xp[id]/jobXpNeed(lv)}%"></div></div><small>${j.xp[id]} / ${jobXpNeed(lv)} XP</small>`}
      <small>Récolte : ${J.res.map((r,t) => lv >= JOB_REQ[t] ? r : `<span style="opacity:.55">🔒 ${r} (niv. ${JOB_REQ[t]})</span>`).join(' · ')}</small></div></div>`; }).join('')}</div>
    <p class="help">Clique sur une ressource dans une zone (cercle doré) pour la récolter : elle repousse après ${JOB_REGROW} combats. Chaque région a ses ressources, de plus en plus rares. Les monstres vaincus laissent aussi des ressources, demandées par les recettes. Récolter et fabriquer font monter le niveau du métier.</p>`;
  else if (tab==='res') {
    const cons = Object.values(CONS).filter(c => j.cons[c.id] > 0), m = j.meal && CONS[j.meal.id];
    body = JOB_IDS.map(id => { const own = JOBS[id].res.map((r,t) => [r, j.res[id+t]||0, t]).filter(([,n]) => n);
      return `<h3>${JOBS[id].icon} ${JOBS[id].name}</h3>${own.length ? `<div class="items">${own.map(([r,n,t]) => `<div class="item"><div class="txt"><b>${r} × ${n}</b><small>${REGION_NAMES[t+1]}</small></div></div>`).join('')}</div>`
        : '<p class="help">Aucune ressource pour l\'instant.</p>'}`; }).join('')
      + (() => { const own = Object.keys(MONSTER_DROPS).filter(k => j.res['m_'+k] > 0);
        return `<h3>🐾 Butin de monstres</h3>${own.length ? `<div class="items">${own.map(k => `<div class="item"><div class="txt"><b>${MONSTER_DROPS[k]} × ${j.res['m_'+k]}</b><small>Sur : ${MONSTERS[k].name}</small></div></div>`).join('')}</div>`
          : '<p class="help">Les monstres vaincus laissent parfois une ressource (les chefs et les grands monstres toujours).</p>'}`; })()
      + `<h3>Consommables</h3>${m ? `<p class="goal">🍞 ${m.name} : +${m.vie} % PV et +${m.puissance} % dégâts, encore ${j.meal.fights} combat${j.meal.fights>1?'s':''}.</p>` : ''}
      <div class="items">${cons.map(c => `<div class="item"><img src="${SPRITES[c.kind==='potion' ? 'flask_big_red' : 'flask_big_yellow']}" alt=""><div class="txt"><b>${c.name} × ${j.cons[c.id]}</b><small>${consText(c)}</small></div>
        <div class="act">${c.kind==='repas' ? `<button class="btn sm" data-eat="${c.id}">Manger</button>` : ''}</div></div>`).join('') || '<p class="help">Aucun consommable. Le Paysan fabrique des potions et des repas à l\'atelier.</p>'}</div>
      <p class="help">Les potions apparaissent dans ta barre de sorts pendant les combats. Un nouveau repas remplace l'ancien.</p>`;
  } else {
    const fb = id => `<button class="btn sm alt${jf===id ? ' on' : ''}" data-jf="${id}">${JOBS[id].icon} ${JOBS[id].name}</button>`;
    const open = JOB_REQ.filter(v => v <= j.lv[jf]).length; // paliers ouverts, plus le suivant pour donner un objectif
    const list = RECIPES.filter(r => r.job===jf && r.t <= open).map(r => { const lvOk = j.lv[r.job] >= JOB_REQ[r.t], ok = lvOk && haveAll(r);
      const need = Object.entries(r.need).map(([id,n]) => { const has = j.res[id]||0; return `<span style="color:${has>=n ? '#5ad16a' : '#e2554a'}"${id.startsWith('m_') ? ` title="Sur : ${MONSTERS[id.slice(2)].name}"` : ''}>${id.startsWith('m_') ? '🐾 ' : ''}${ingName(id)} ${has}/${n}</span>`; }).join(' · ');
      const what = r.cons ? consText(CONS[r.cons]) : `${SLOTS[r.slot]} Rare (parfois Épique quand ton métier est niv. ${Math.min(JOB_MAX, JOB_REQ[r.t]+10)}), de la force d'un objet de ${REGION_NAMES[r.t+1]}.`;
      return `<div class="item"${lvOk ? '' : ' style="opacity:.55"'}><div class="txt"><b>${recipeName(r, p.cls)}</b><small>${what}</small><div>${need}</div>${lvOk ? '' : `<small>🔒 ${JOBS[r.job].name} niv. ${JOB_REQ[r.t]} requis</small>`}</div>
        <div class="act"><button class="btn sm" data-craft="${r.id}"${bench && ok ? '' : ' disabled'}>Fabriquer</button></div></div>`; }).join('');
    body = `<div class="filters">${JOB_IDS.map(fb).join('')}</div>
      <p class="help">${bench ? '🔨 Tu es à l\'atelier : tu peux fabriquer.' : 'Pour fabriquer, rends-toi à l\'atelier d\'un village (l\'établi avec l\'enclume) et clique dessus.'}</p><div class="items bag">${list}</div>`;
  }
  overlay(`<h2>Métiers de ${heroName()}</h2><div class="filters">${tb('jobs','Métiers')}${tb('res','Ressources')}${tb('fab','Fabrication')}</div>${body}
    <div style="text-align:center"><button class="btn alt" id="b2">Mon équipement</button><button class="btn" id="b1">Fermer</button></div>`, true);
  $('#overlay').dataset.menu = 'jobs';
  const o = $('#overlay');
  o.querySelectorAll('[data-jtab]').forEach(b => b.onclick = () => showJobs(b.dataset.jtab));
  o.querySelectorAll('[data-jf]').forEach(b => b.onclick = () => { G.jobFilter = b.dataset.jf; showJobs('fab'); });
  o.querySelectorAll('[data-craft]').forEach(b => b.onclick = () => craft(RECIPES.find(r => r.id===b.dataset.craft)));
  o.querySelectorAll('[data-eat]').forEach(b => b.onclick = () => eatMeal(b.dataset.eat));
  $('#b2').onclick = () => showBag(() => showJobs());
  $('#b1').onclick = () => { hideOverlay(); showNextScene(); };
}
