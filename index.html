<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Héritiers de l'Aube</title>
<style>
  :root { --bg:#161a24; --panel:#232a38; --panel2:#2c3446; --text:#ece6d6; --muted:#a59f8f; --gold:#e8b94a; --pa:#4aa3ff; --pm:#5ad16a; --red:#e2554a; }
  * { box-sizing:border-box; }
  /* écran de démarrage */
  #title { position:fixed; inset:0; z-index:200; cursor:pointer; overflow:hidden; background:#0b1020; transition:opacity .6s; }
  #title.out { opacity:0; pointer-events:none; }
  #title canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  #title .tt { position:absolute; left:0; right:0; top:11vh; text-align:center; padding:0 16px; }
  #title h1 { margin:0; font-size:clamp(34px, 7vw, 76px); color:var(--gold); letter-spacing:1px; text-shadow:0 3px 0 #5a3a10, 0 0 28px rgba(255,190,90,.55); }
  #title .sub { margin-top:10px; font-size:clamp(14px, 2vw, 19px); color:#f3e2c8; text-shadow:0 2px 6px #000; }
  #title .go { position:absolute; left:0; right:0; bottom:calc(5vh + 22px); text-align:center; }
  #title .go .btn { font-size:20px; padding:12px 40px; box-shadow:0 0 24px rgba(232,185,74,.5); }
  #title .press { margin-top:12px; color:#f3e2c8; font-size:15px; text-shadow:0 2px 4px #000; animation:titleBlink 1.6s ease-in-out infinite; }
  @keyframes titleBlink { 50% { opacity:.35; } }
  #title .copy { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:12px; color:#c9b9a0; opacity:.8; text-shadow:0 1px 3px #000; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,sans-serif; overflow:hidden; user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; }
  #top { display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:2px solid #11151d; min-height:46px; flex-wrap:wrap; }
  #top .lbl { color:var(--gold); font-weight:600; margin-right:8px; font-size:14px; }
  .chip { display:flex; align-items:center; gap:6px; padding:3px 9px; border-radius:14px; background:var(--panel2); font-size:13px; border:2px solid transparent; }
  .chip.cur { border-color:var(--gold); }
  .chip .dot { width:10px; height:10px; border-radius:50%; }
  .chip.dead { opacity:.35; text-decoration:line-through; }
  #mapZoom { position:absolute; left:12px; top:12px; display:flex; gap:6px; } #mapZoom .btn { margin:0; padding:4px 14px; font-size:20px; line-height:1; }
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
  #cv { width:min(100%, calc((100vh - 170px) * 1.607)); aspect-ratio:900/560; display:block; cursor:pointer; }
  #log { position:absolute; right:10px; top:10px; width:290px; max-height:45%; overflow:hidden; font-size:12.5px; line-height:1.35; background:rgba(20,24,33,.75); border-radius:8px; padding:8px; color:#cfc8b6; pointer-events:none; }
  #log div { margin:2px 0; opacity:.6; } #log div:nth-last-child(-n+3) { opacity:1; color:#f3ead2; }
  #banner { position:absolute; left:50%; top:16px; transform:translateX(-50%); background:rgba(20,24,33,.85); padding:6px 18px; border-radius:8px; font-weight:600; color:var(--gold); pointer-events:none; transition:opacity .3s; }
  #bottom { display:flex; align-items:center; gap:14px; padding:8px 12px; background:var(--panel); border-top:2px solid #11151d; flex-wrap:wrap; }
  #hero { min-width:190px; }
  #hero .name { font-weight:600; }
  #hero .name small { display:block; font-weight:600; font-size:12px; color:var(--gold); }
  .bar { height:10px; background:#11151d; border-radius:5px; overflow:hidden; margin:4px 0; }
  .bar > div { height:100%; background:linear-gradient(90deg,#c93d33,#ef6b5b); }
  .res { display:flex; gap:10px; font-weight:700; }
  .res .pa { color:var(--pa); } .res .pm { color:var(--pm); }
  #spells { display:flex; gap:8px; }
  .spell { position:relative; width:138px; padding:6px 8px; background:var(--panel2); border:2px solid #3a4459; border-radius:8px; color:var(--text); cursor:pointer; text-align:left; font:inherit; font-size:12px; }
  .spell:hover:not(:disabled) { border-color:#7d8db0; }
  .spell.sel { border-color:var(--gold); background:#3a3a2c; }
  .spell:disabled { opacity:.4; cursor:default; }
  .spell b { display:block; font-size:12.5px; padding-right:6px; }
  .spell .ico { height:30px; margin:0 6px 0 0; image-rendering:pixelated; flex:none; }
  .spell { display:flex; align-items:center; }
  .cls .por { float:right; width:48px; height:84px; image-rendering:pixelated; margin-left:8px; }
  .spell .k { position:absolute; top:3px; right:6px; color:var(--muted); font-size:11px; }
  .spell .c { color:var(--pa); font-weight:700; }
  #spells.many { gap:6px; } #spells.many .spell { width:104px; padding:5px 5px; font-size:11.5px; } #spells.many .spell b { font-size:12px; } #spells.many .spell .ico { height:26px; margin-right:4px; }
  .rkp { display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle; } .rkp button { width:20px; height:18px; padding:0; border-radius:4px; border:1px solid #3a4459; background:#11151d; color:var(--muted); font:inherit; font-size:11px; cursor:pointer; }
  .rkp button.own { background:#3a3a2c; color:var(--gold); border-color:#7a6a3a; } .rkp button.cur { outline:2px solid var(--gold); color:#fff; }
  .spuse { color:#9fb3d6; } .sppre { color:#8fe39b; }
  #endturn { margin-left:auto; padding:10px 18px; font:inherit; font-weight:700; border:none; border-radius:8px; background:var(--gold); color:#2a2110; cursor:pointer; }
  #endturn:disabled { opacity:.4; cursor:default; }
  #hint { width:100%; font-size:12px; color:var(--muted); height:48px; line-height:16px; overflow-y:auto; } /* hauteur fixe : l'écran de jeu ne bouge jamais */
  #overlay { position:fixed; inset:0; background:rgba(10,12,18,.88); display:flex; overflow:auto; padding:16px 0; z-index:10; }
  #overlay > .box { margin:auto; }
  .chip.hov { outline:2px solid #fff; }
  #overlay.hide { display:none; }
  .box { background:var(--panel); border:2px solid #3a4459; border-radius:14px; padding:26px 30px; max-width:680px; width:calc(100% - 32px); text-align:center; }
  .box { position:relative; } .xclose { position:absolute; top:10px; right:12px; width:34px; height:34px; border-radius:8px; border:1px solid #3a4459; background:var(--panel2); color:var(--text); font-size:18px; cursor:pointer; z-index:2; } .xclose:hover { border-color:var(--gold); color:var(--gold); }
  .xpbar { margin:8px auto; max-width:460px; text-align:left; } .xpbar .xplbl { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; } .xpbar .xplbl span { color:var(--muted,#9aa4b8); }
  .xpb { position:relative; height:12px; background:#222a38; border:1px solid #3a4560; border-radius:6px; overflow:hidden; } .xpb div { position:absolute; top:0; bottom:0; } .xpb .old { left:0; background:linear-gradient(#9a7bd8,#6a4fb0); } .xpb .new { background:linear-gradient(#ffe27a,#e0a92a); box-shadow:0 0 6px #ffd04a; animation:xpFill 1.4s ease-out .4s both; }
  @keyframes xpFill { from { width:0; } }
  .lvcard { text-align:left; background:#1b2232; border:2px solid var(--gold); border-radius:10px; padding:10px 14px; margin:10px 0; }
  .lvcard.forest { border-color:#b08cff; } .lvcard h4 { margin:0 0 4px; font-size:17px; color:var(--gold); } .lvcard.forest h4 { color:#cdb4ff; }
  .lvcard .chips span { display:inline-block; background:var(--panel); border:1px solid #3a4459; border-radius:12px; padding:3px 10px; margin:4px 5px 0 0; font-size:14px; color:var(--text); }
  .lvcard .help { margin:8px 0 0; }
  .box h1 { margin:0 0 4px; color:var(--gold); font-size:30px; }
  .box h2 { margin:0 0 10px; color:var(--gold); }
  .box p { color:#cfc8b6; line-height:1.45; }
  .classes { display:flex; gap:14px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
  .box:has(.classes) { max-width:900px; } /* écran d'accueil : les cartes de classe tiennent sur une ligne */
  .cls { width:260px; padding:14px; border-radius:10px; background:var(--panel2); border:2px solid #3a4459; cursor:pointer; text-align:left; color:var(--text); font:inherit; }
  .cls:hover { border-color:var(--gold); }
  .cls h3 { margin:0 0 6px; color:var(--gold); }
  .cls ul { margin:6px 0 0; padding-left:18px; font-size:13px; color:#cfc8b6; }
  .btn { padding:10px 22px; font:inherit; font-weight:700; border:none; border-radius:8px; background:var(--gold); color:#2a2110; cursor:pointer; margin:6px; }
  .btn.alt { background:var(--panel2); color:var(--text); }
  .help { font-size:12px; color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; margin:4px 0; }
  .filters .btn.sm.on { outline:2px solid var(--gold); }
  .filters .lbl { font-size:12px; color:var(--muted); margin-right:2px; }
  .box.wide { max-width:900px; max-height:calc(100vh - 32px); overflow:auto; text-align:left; }
  .box.wide h2, .box.wide > p { text-align:center; }
  .box h3 { margin:14px 0 6px; color:var(--gold); font-size:15px; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin:8px 0; text-align:left; }
  .item { display:flex; gap:10px; align-items:center; background:var(--panel2); border:2px solid #3a4459; border-radius:10px; padding:8px; font-size:13px; }
  .item.empty { opacity:.55; border-style:dashed; min-height:62px; }
  .item img { width:36px; height:36px; object-fit:contain; image-rendering:pixelated; flex:none; }
  .item .txt { flex:1; min-width:0; } .item .txt b { display:block; } .item small { display:block; color:var(--muted); }
  .item .act { display:flex; flex-direction:column; gap:4px; }
  .smith .act .btn { white-space:normal; max-width:140px; line-height:1.2; } .smith .act .btn small { display:block; font-weight:400; font-size:11px; margin-top:2px; }
  .btn.sm { padding:5px 10px; font-size:12px; margin:0; white-space:nowrap; }
  .item .btn.alt { background:#3e4860; }
  .btn:disabled { opacity:.45; cursor:default; }
  img.coin { width:12px; height:14px; image-rendering:pixelated; vertical-align:-2px; }
  .loot { display:flex; align-items:center; justify-content:center; gap:14px; font-size:18px; color:var(--gold); }
  .loot .chest { width:48px; height:48px; image-rendering:pixelated; }
  .statline { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-weight:600; margin:8px 0; }
  .scene { display:flex; gap:20px; align-items:flex-start; }
  .scene .portrait { width:96px; height:168px; image-rendering:pixelated; flex:none; background:var(--panel2); border-radius:12px; padding:8px; }
  .scene .say { flex:1; } .scene .say h2 { text-align:left; margin:2px 0 8px; } .scene .say p { font-size:16px; text-align:left; }
  .scene .who { color:var(--muted); font-size:13px; }
  .goal, .reward { background:var(--panel2); border-radius:8px; padding:8px 12px; }
  .lvup { color:var(--pm); font-weight:700; }
  .pts { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; margin:8px 0; text-align:left; }
  .pts .item .btn.sm { min-width:34px; }
  .pts.one { grid-template-columns:1fr; } .pts .act .btn.sm.alt { min-width:28px; padding:2px 6px; }
  .spkey { width:20px; text-align:center; font-weight:700; color:var(--gold); flex:none; }
  .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--pm); color:#10202a; font-size:12px; line-height:18px; }
  .quest { background:var(--panel2); border-radius:10px; padding:10px 12px; margin:6px 0; border-left:4px solid #3a4459; }
  .quest.main { border-left-color:var(--gold); } .quest b { display:block; } .quest small { display:block; color:var(--muted); }
  #topbtns { display:none; margin-left:auto; align-items:center; gap:12px; color:var(--gold); font-weight:600; }
  body.map #topbtns { display:flex; }
  #topbtns .btn { margin:0; padding:6px 14px; }
  #menuWrap { position:relative; }
  #menuList { display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:30; flex-direction:column; gap:4px; padding:6px; background:var(--panel); border:2px solid #11151d; border-radius:8px; box-shadow:0 6px 18px #0008; min-width:200px; }
  #menuWrap.open #menuList { display:flex; }
  #menuList .btn { text-align:left; width:100%; }
  #menuBtn.dot::after { content:''; display:inline-block; width:9px; height:9px; margin-left:6px; border-radius:50%; background:var(--pm); vertical-align:middle; }
  #sndBtn { margin:0 0 0 auto; padding:6px 10px; } body.map #sndBtn { margin-left:12px; } #musBtn { margin:0; padding:6px 10px; }
  body.map #log, body.map #hero, body.map #spells, body.map #endturn, body.map #timeline { display:none !important; }
  body.map #cv { cursor:default; }
  .foes { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .foes span { background:var(--panel2); padding:4px 10px; border-radius:12px; font-size:13px; }
  #dbg { position:fixed; top:56px; right:12px; width:290px; max-height:calc(100vh - 70px); overflow:auto; background:#1b1f2b; border:2px solid #e05a5a; border-radius:10px; padding:10px 12px; z-index:20; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #dbg.hide { display:none; }
  #dbg h3 { margin:0 0 6px; color:#ff8a7a; font-size:15px; }
  #dbg h4 { margin:10px 0 4px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  #dbg .row { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  #dbg select { font:inherit; font-size:12px; background:var(--panel2); color:var(--text); border:1px solid #444; border-radius:6px; padding:4px; max-width:100%; }
  #dbg .btn.on { background:#e05a5a; color:#fff; }
  #dbg .note { color:var(--muted); font-size:11px; margin-top:8px; }
  .namebox { text-align:center; margin:10px 0 4px; font-weight:600; }
  .namebox input { font:inherit; font-size:16px; padding:7px 12px; border-radius:8px; border:2px solid #3a4459; background:var(--panel2); color:var(--text); width:230px; }
  .namebox input.need { border-color:#e2554a; }
  .story p, .guide li { line-height:1.45; } .guide { padding-left:20px; color:#cfc8b6; }
  .keys { border-collapse:collapse; margin:4px 0; } .keys td { padding:4px 10px; border-bottom:1px solid #3a4459; color:#cfc8b6; } .keys td:first-child { white-space:nowrap; }
  kbd { display:inline-block; min-width:18px; text-align:center; padding:1px 6px; border:1px solid #5a6680; border-bottom-width:3px; border-radius:5px; background:var(--panel2); color:var(--text); font:600 12px Segoe UI, sans-serif; }
  .chars { display:flex; flex-direction:column; gap:6px; margin:6px 0 4px; text-align:left; }
  .charrow { display:flex; align-items:center; gap:10px; background:var(--panel2); border:2px solid #3a4459; border-radius:10px; padding:6px 10px; }
  .charrow img { height:34px; image-rendering:pixelated; } .charrow .txt { flex:1; } .charrow .txt b { display:block; } .charrow small { color:var(--muted); }
  .charrow .btn { margin:0; } .charrow .btn.sm { padding:6px 10px; font-size:17px; }
  .savecode { width:100%; height:70px; font:12px monospace; background:var(--panel2); color:var(--text); border:2px solid #3a4459; border-radius:8px; padding:6px; resize:vertical; word-break:break-all; }
  #hfToast { position:absolute; right:12px; top:12px; display:flex; gap:10px; align-items:center; background:rgba(20,24,33,.95); border:2px solid var(--gold); border-radius:10px; padding:8px 14px; max-width:320px; z-index:20; pointer-events:none; cursor:pointer; opacity:0; transform:translateY(-10px); transition:opacity .3s, transform .3s; }
  #hfToast.on { opacity:1; transform:none; pointer-events:auto; } #hfToast.on:hover { border-color:#fff3; box-shadow:0 0 0 2px var(--gold); }
  /* effets du nom (débloqués par les hauts faits) */
  .nfx { display:inline-flex; align-items:center; white-space:nowrap; }
  .nfx .t { background:var(--grad); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; font-weight:800; filter:drop-shadow(0 0 5px var(--g)); }
  .nfx .o { color:var(--g); margin:0 .3em; font-weight:400; text-shadow:0 0 6px var(--g); display:inline-block; animation:nfxBob 2.4s ease-in-out infinite; }
  .nfx .o.r { animation-delay:-1.2s; }
  .nfx.shift .t { animation:nfxShift 4s linear infinite; }
  .nfx.pulse .t { animation:nfxPulse 2.2s ease-in-out infinite; }
  .nfx.flicker .t { animation:nfxShift 3s linear infinite, nfxFlick 1.3s steps(6) infinite; }
  @keyframes nfxShift { to { background-position:-200% 0; } }
  @keyframes nfxPulse { 50% { filter:drop-shadow(0 0 12px var(--g)); } }
  @keyframes nfxFlick { 0%,100% { filter:drop-shadow(0 0 5px var(--g)); } 33% { filter:drop-shadow(0 0 11px var(--g)); } 66% { filter:drop-shadow(0 0 3px var(--g)); } }
  @keyframes nfxBob { 50% { transform:translateY(-3px) scale(1.15); } }
  .fxs { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:4px 0 10px; }
  .fxc { background:rgba(255,255,255,.05); border:1px solid #ffffff22; border-radius:8px; color:var(--text); padding:5px 8px; font:inherit; font-size:14px; cursor:pointer; }
  .fxc.on { border-color:var(--gold); background:rgba(232,194,106,.15); }
  .fxc.locked { opacity:.45; cursor:help; }
  .sharecard { display:block; margin:8px auto; max-width:100%; max-height:62vh; border-radius:12px; box-shadow:0 4px 24px #000a; }
  #hfToast .ic, .feat .ic { font-size:26px; } #hfToast b { display:block; color:var(--gold); } #hfToast small { display:block; font-size:12px; opacity:.85; }
  .feats { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:8px; }
  .feat { display:flex; gap:10px; align-items:center; background:var(--panel2); border:2px solid #3a4459; border-radius:8px; padding:6px 10px; opacity:.6; }
  .feat.got { opacity:1; border-color:#f4c84a99; } .feat.got b { color:var(--gold); } .feat .txt { flex:1; } .feat small { display:block; font-size:12px; }
  .feat .pts { display:block; margin:0; font-weight:700; color:var(--gold); } .fbar { height:5px; background:#222a38; border-radius:3px; margin-top:3px; } .fbar div { height:100%; background:var(--pm); border-radius:3px; }
  /* tactile (iPad) : pas de zoom au double toucher, pas de loupe ni de surbrillance */
  html { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  body.touch { -webkit-user-select:none; -webkit-touch-callout:none; }
  body.touch input, body.touch textarea { -webkit-user-select:text; user-select:text; }
  body.touch .btn.sm { min-height:30px; }
  /* iPad : la scène remplit toute la place libre (100vh de Safari compte les barres du navigateur) et reste nette sur écran Retina */
  body.touch #app { height:100dvh; }
  body.touch #stage { container-type:size; }
  body.touch #cv { width:min(100cqw, 100cqh * 1.607); image-rendering:pixelated; }
  /* iPad : barres du haut et du bas sur une seule ligne, tous les sorts visibles, journal plus discret */
  body.touch #top { flex-wrap:nowrap; } body.touch #topbtns { flex:none; }
  body.touch #timeline { flex-wrap:nowrap !important; overflow-x:auto; min-width:0; flex:1; scrollbar-width:none; } body.touch #timeline .chip { flex:none; }
  body.touch #bottom { gap:8px; padding:6px 10px; }
  body.touch #hero { min-width:0; width:170px; flex:none; } body.touch #hero .res { gap:6px; font-size:13px; white-space:nowrap; }
  body.touch #spells { flex:1; min-width:0; gap:5px; }
  body.touch #spells .spell { flex:1 1 0; min-width:0; width:auto; max-width:138px; padding:5px 4px; overflow:hidden; }
  body.touch #endturn { margin-left:0; padding:8px 10px; flex:none; max-width:96px; line-height:1.2; }
  body.touch .spell .k { display:none; } body.touch #spells .spell .ico { display:none; } body.touch #spells .spell { padding:5px 6px; } body.touch #spells .spell b { font-size:11.5px; hyphens:auto; -webkit-hyphens:auto; }
  body.touch #hint { height:32px; }
  body.touch #log { width:230px; max-height:28%; font-size:11.5px; background:rgba(20,24,33,.55); }
  /* écrans tactiles peu hauts (paysage) : fenêtres plus compactes pour que leurs boutons restent dans l'écran */
  body.touch #overlay { bottom:auto; height:100dvh; }
  @media (max-height:560px) { body.touch .box { padding:14px 18px; } body.touch .scene .portrait { display:none; } body.touch .scene .say p { font-size:14px; } }

const inB = (x,y) => x>=0 && y>=0 && x<W && y<H;
const unitAt = (x,y) => G.units.find(u => u.alive && u.x===x && u.y===y);

const HERO_SPAWN = [10,10];

function genMap() {
  for (let tries=0; tries<200; tries++) {
    const g = Array.from({length:H}, () => Array(W).fill(0));
    const n = rnd(12,18);
    for (let i=0;i<n;i++) {
      const x = rnd(0,W-1), y = rnd(0,H-1);
      if (x>=8 && y>=8) continue;          // zone du héros
      if (x<=4 && y<=4 && Math.random()<.6) continue; // zone ennemie un peu dégagée
      g[y][x] = Math.random()<.6 ? 1 : 2;  // 1 = rocher, 2 = eau
    }
    // connexité : toutes les cases libres doivent être accessibles
    let free = 0; for (const r of g) for (const c of r) if (c===0) free++;
    const seen = new Set([key(...HERO_SPAWN)]), q = [HERO_SPAWN];
    while (q.length) { const [x,y] = q.pop(); for (const [a,b] of DIRS) { const nx=x+a, ny=y+b; if (inB(nx,ny) && g[ny][nx]===0 && !seen.has(key(nx,ny))) { seen.add(key(nx,ny)); q.push([nx,ny]); } } }
    if (seen.size === free) return g;
  }
  return Array.from({length:H}, () => Array(W).fill(0));
}

// bonus de dégâts d'un boss contre une cible

// effets au début du tour d'une unité (boss, ou héros soumis à un boss)

// Donjon : chaque boss attend au fond, derrière 2 salles de monstres de sa zone. Les PV se gardent d'une salle à l'autre,

  return { ...z, icon:'room', name:`${z.name} · Salle ${n}/${DUNGEON_ROOMS}`, foes:[0,1,2].map(i => pool[(i + n - 1) % pool.length]) };
}
function startFight(zoneId, room, group) {

  G.token++;
  const token = G.token;
  applyPhases();
  const base = zoneById(zoneId), run = G.dunRun && G.dunRun.id===zoneId ? G.dunRun : null, carry = run && room > 1 ? run.hp : null;
  G.dungeon = base.icon==='boss' && !group ? { id:zoneId, room: room || 1, hp:carry } : null;
  if (G.dungeon && !run) G.dunRun = { id:zoneId, done:G.dungeon.room - 1, hp:null, cine:true }; // combat lancé hors du donjon (mode test)
  const f = group ? { ...base, icon:'fight', foes:group, extra:true } : G.dungeon && G.dungeon.room <= DUNGEON_ROOMS ? dungeonRoom(base, G.dungeon.room) : G.dungeon ? { ...base, name:`${base.name} · Salle du boss` } : base;
  G.zone = f; G.seed = rnd(1,1e6); G.mode = 'fight'; document.body.classList.remove('map'); setTimeout(renderDbg);
  setBoard(...FIGHT_BOARD); G.bgSize = null;
  G.grid = genMap();
  const st = heroStats(G.profile), c = CLASSES[G.profile.cls];
  jobFightStart(room);
  const hero = makeUnit(c, 'hero', HERO_SPAWN[0], HERO_SPAWN[1], { hp:st.hp, maxHp:st.hp, pa:st.pa, maxPa:st.pa, pm:st.pm, maxPm:st.pm, mul:st.mul, res:st.res, name:heroName() + ' niv. ' + G.profile.level, spells: heroSpells(G.profile).concat(potionSpells(G.profile)), crit:st.crit });
  if (carry != null) hero.hp = Math.min(hero.maxHp, carry + Math.round(hero.maxHp*DUNGEON_HEAL));
  G.hero = hero;
  const units = [hero];
  const spots = [];
  for (let y=0;y<=4;y++) for (let x=0;x<=4;x++) if (G.grid[y][x]===0) spots.push([x,y]);
  spots.sort(() => Math.random()-.5);
  const scale = (f.tier >= 5 ? 1 + f.tier*0.18 : 1 + f.tier*0.07) * (f.icon==='boss' ? 1 : MONSTER_BOOST); // les Terres du Nord sont nettement plus dures
  const champ = group && G.fightGroup && G.fightGroup.rare && G.fightGroup.foes===group ? group.length - 1 : -1;
  f.foes.forEach((k, i) => {
    const m = MONSTERS[k], [x,y] = spots[i];
    if (i===champ) return units.push(champUnit(m, k, f, x, y, scale));
    const hp = Math.round(m.hp*scale);
    const mech = f.icon==='boss' && i===0 && BOSS_MECHS[k] ? k : null;
    units.push(makeUnit(m, 'enemy', x, y, { hp, maxHp:hp, mul:scale, kind:k, name:`${m.name} niv. ${monsterLevel(k, f)}`, mech, ice: mech==='hrimgar' ? Math.round(hp*0.15) : 0 }));
  });
  const esc = G.escortFight && group && G.escortFight.zone===zoneId ? questById(G.escortFight.q) : null;
  if (esc) { const c = [[9,10],[10,9],[11,10],[10,11],[9,9],[11,11],[8,10],[10,8]].find(([x,y]) => inB(x,y) && G.grid[y][x]===0 && !units.some(u => u.x===x && u.y===y)); if (c) units.splice(1, 0, allyUnit(esc.goal, hero, scale, c)); }
  else G.escortFight = null;
  G.units = units; G.turn = 0; G.round = 1; G.hurtTaken = 0; G.sel = null; G.busy = false; G.over = false;
  $('#log').innerHTML = '';
  $('#fightname').textContent = f.name;
  buildBg();
  buildSpellButtons();
  hideOverlay();
  log(`Le combat commence : ${f.name}.`);
  { const b = units.find(u => u.mech); if (b) setTimeout(() => { if (G.token===token) mechAlert(`${BOSS_MECHS[b.mech][0]} : ${BOSS_MECHS[b.mech][1]}`); }, 900/Math.min(SPEED, 8)); }
  runTurns(token);
}

// ---------- Ligne de vue / déplacements ----------
function blocksLos(x,y,ign) { if (G.grid[y][x]===1) return true; const o = unitAt(x,y); return !!o && o!==ign; }

  for (let i=1;i<n;i++) {
    const t=i/n, cx=Math.round(x0+dx*t+1e-6), cy=Math.round(y0+dy*t+1e-6);
    if ((cx===x0&&cy===y0)||(cx===x1&&cy===y1)) continue;
    if (blocksLos(cx,cy,ign)) return false;
  }

}
function reachable(u, pm=u.pm) {

    if (d >= pm) continue;
    for (const [a,b] of DIRS) { const nx=x+a, ny=y+b;

      m.set(key(nx,ny), {d:d+1, prev:key(x,y), x:nx, y:ny}); q.push([nx,ny]); }
  }

}

  return m;

// ---------- Sorts ----------
function affordable(u,sp) { return u.pa>=sp.pa && !(u.cds[sp.id]>0) && !(sp.perTurn && (u.uses[sp.id]||0)>=sp.perTurn) && !(sp.potion && !(jobs().cons[sp.potion] > 0)); }

// dégâts min/max d'un sort sur une cible (même calcul que cast + hurt)

const comboOn = (sp, t) => !!(sp.combo && t && (sp.combo.dot ? (t.dots||[]).some(d => d.id===sp.combo.dot) : sp.combo.mark ? (t.marks||{})[sp.combo.mark] >= G.round : false));

// Assassinat : tous les dégâts de poison restants d'un coup
const dotsLeft = (sp, t) => sp.consumeDots ? (t.dots||[]).filter(d => d.name==='Poison').reduce((a,d) => a + d.v*d.n, 0) : 0;
// états posés par les combos : marque valable jusqu'à la fin du tour (rond) indiqué
function fury(u, val) { if (u.furyNext) return; u.furyNext = val/100; addFloat(u.x, u.y-.8, 'Fureur !', '#ff9a3c'); log(`Fureur : la Rage de ${u.name} durera aussi au tour suivant.`); }

  addFloat(t.x, t.y-.4, { desequ:'Déséquilibré', gel:'Gelé' }[k] || k, k==='gel' ? '#9fe3ff' : '#ffd04a'); }
function dmgRange(u,sp,t,f,m=1) {
  const res = resOf(t);
  const extra = dotsLeft(sp, t);
  return sp.dmg.map(d => { let v = Math.max(1, Math.round(d*(u.mul + (u.turnBonus||0))*f*m*condMul(sp, t))); if (res) v = Math.max(1, Math.round(v*(1-res/100))); return v + extra; });
}
function dmgPreview() {
  const h = G.hero, sp = G.sel;
  if (!sp || !sp.dmg || !G.hover || !isHeroTurn() || !canCast(h,sp,...G.hover)) return [];
  if (sp.self && (G.hover[0]!==h.x || G.hover[1]!==h.y)) return [];
  const out = [];
  for (const [x,y,f] of zoneCells(sp, ...(sp.self ? [h.x,h.y] : G.hover))) { const t = unitAt(x,y); if (t && t!==h) out.push({ t, r: dmgRange(h,sp,t,f), c: dmgRange(h,sp,t,f,CRIT_MUL) }); }

}
// chance de coup critique d'un sort pour une unité (u.crit = base + Agilité), affichée dans les descriptions
const critPct = u => Math.round((((u && u.crit) || CRIT_CHANCE) + ((u && u.turnCrit) || 0))*100);
const critLine = (sp, u) => sp.dmg ? ` Coup critique : ${critPct(u)} % de chance (+${Math.round((CRIT_MUL-1)*100)} % de dégâts).` : '';

const CRIT_CHANCE = 0.05, CRIT_MUL = 1.5, CRIT_CAP = 0.3; // 1 chance sur 20 de faire 50 % de dégâts en plus

  const res = resOf(t);

  if (t.mech) v = mechHurt(t, v);
  if (t.team==='hero' && DBG.god) v = 0;
  t.hp = Math.max(0, t.hp-v); if (t===G.hero) G.hurtTaken += v;
  addFloat(t.x,t.y, crit ? `Critique ! -${v}` : `-${v}`, crit ? '#ffd04a' : '#ff5a4a');
  play(t.team==='hero' ? 'aie' : 'impact'); if (crit) play('critique');
  log(`${t.name} perd ${v} PV.`);
  t.flash = performance.now();
  fxHit(t, crit);
  if (t.hp<=0) { t.alive = false; play(G.zone && G.zone.icon==='boss' && t.kind===G.zone.foes[0] ? 'mortboss' : 'mort'); log(`${t.name} est vaincu !`); }

// ---------- Tours ----------
async function runTurns(token) {
  while (!G.over && token===G.token) {
    const u = G.units[G.turn];
    if (u.alive) {
      beginTurn(u);
      if (!u.alive) { if (checkEnd()) return; }
      else if (u.team==='hero') await new Promise(r => G.endHeroTurn = r);
      else { await aiTurn(u, token); await sleep(250); }
      if (G.over || token!==G.token) return;
    }
    G.turn = (G.turn+1) % G.units.length;
    if (G.turn===0) G.round++;
  }
}
function beginTurn(u) {
  u.pa = u.maxPa; u.pm = u.maxPm; u.uses = {}; u.turnBonus = 0; u.turnCrit = 0; u.tempRes = 0;
  if (u.furyNext) { u.turnBonus = u.furyNext; addFloat(u.x,u.y,'Fureur','#ff9a3c'); log(`Fureur : ${u.name} garde +${Math.round(u.furyNext*100)} % de dégâts ce tour.`); u.furyNext = 0; }
  if (u.malus) { u.pm = Math.max(0, u.pm - u.malus); addFloat(u.x,u.y,`-${u.malus} PM`,'#9fe3ff'); log(`${u.name} est ralenti : -${u.malus} PM ce tour.`); u.malus = 0; u.slowFree = G.round; } // pas de nouveau ralentissement avant le tour suivant
  if (u.dots && u.dots.length) { for (const d of u.dots) { if (!u.alive) break; log(`${d.name} sur ${u.name}.`); hurt(u, d.v); d.n--; } u.dots = u.dots.filter(d => d.n > 0); }
  for (const k in u.cds) { u.cds[k]--; if (u.cds[k]<=0) delete u.cds[k]; }
  if (u.alive && !G.over) mechTurn(u);
  G.sel = null;
  banner(u.team==='hero' ? `Tour ${G.round} · À toi de jouer !` : `Tour de ${u.name}`);
  if (u.team==='hero') play('tour');
  refreshReach(); updateUI(); hint(); dirty = true;
}
function isHeroTurn() { return !G.over && G.units[G.turn]===G.hero && !G.busy; }
function endHeroTurn() { if (isHeroTurn() && G.endHeroTurn) { const f=G.endHeroTurn; G.endHeroTurn=null; G.sel=null; G.reach=null; f(); } }
function checkEnd() {
  if (G.over) return true;
  if (!G.hero.alive || G.units.some(u => u.team==='ally' && !u.alive)) { G.over = true; setTimeout(showDefeat, 700/SPEED); return true; }
  if (!G.units.some(u => u.team==='enemy' && u.alive)) { G.over = true; setTimeout(showVictory, 700/SPEED); return true; }
  return false;
}

// ---------- IA des monstres ----------
// Chaque monstre note toutes ses actions possibles (frapper, achever, empoisonner, soigner l'allié le plus blessé,
// protéger, invoquer, bondir, repousser, attirer…) et joue la meilleure. Les lanceurs gardent leurs distances
// et finissent leur tour à couvert derrière un rocher quand ils le peuvent.
async function aiTurn(u, token) {
  await sleep(350);
  for (let guard=0; guard<10; guard++) {
    if (G.over || token!==G.token || !u.alive) return;
    const now = aiBest(u, u.x, u.y);
    // case d'où la meilleure action serait possible (si elle vaut mieux que ce qu'il peut faire sur place)
    const m = u.pm>0 ? reachable(u) : null;
    let best=null, bs=-1e9;
    if (m) for (const n of m.values()) { if (n.d===0) continue;
      const o = aiBest(u, n.x, n.y); if (!o) continue;
      const sc = o.score - n.d*1.5 + aiPlace(u, n.x, n.y);
      if (sc>bs) { bs=sc; best=n; } }
    if (now && (!best || now.score >= bs - 2)) { await aiShow(now.sp.self && !now.sp.zone ? [[u.x,u.y]] : zoneCells(now.sp,now.tx,now.ty), true); await cast(u,now.sp,now.tx,now.ty); if (checkEnd()) return; await sleep(220); continue; }
    if (best) { const pa = pathFrom(m,best.x,best.y); await aiShow(pa); await moveAlong(u, pa); continue; }
    if (m) await aiApproach(u, m);
    break;
  }
  // un lanceur que le héros pourrait rejoindre au prochain tour recule
  if (!G.over && token===G.token && u.alive && u.ranged && u.pm>0 && man(u.x,u.y,G.hero.x,G.hero.y) <= G.hero.maxPm+1) await aiRetreat(u);
}
// cible de l'IA : pour un monstre, le héros (ou l'allié escorté s'il est plus près) ; pour l'allié, le monstre le plus proche
function aiFoe(u) { let b = G.hero, bd = Infinity; for (const o of G.units) if (o.alive && (o.team==='enemy') !== (u.team==='enemy')) { const d = man(o.x,o.y,u.x,u.y) - (o===G.hero ? .5 : 0); if (d < bd) { bd = d; b = o; } } return b; }
function aiBest(u, fx, fy) { let b = null; for (const o of aiOptions(u, fx, fy)) if (o.score > 0 && (!b || o.score > b.score)) b = o; return b; }
function aiOptions(u, fx, fy) {
  const h = aiFoe(u), out = [], here = fx===u.x && fy===u.y, d = man(fx,fy,h.x,h.y);
  const can = (sp,tx,ty) => inB(tx,ty) && G.grid[ty][tx]!==1 && inRangeFrom(u,sp,fx,fy,tx,ty) && !(sp.needEmpty && !walkable(tx,ty));
  const team = G.units.filter(o => o.alive && (o.team==='enemy')===(u.team==='enemy'));
  for (const sp of u.spells) {
    if (!affordable(u,sp)) continue;
    if (sp.summon) {
      if (here && G.units.filter(o => o.alive && o.summoner===u).length < sp.max && summonCell(u.x,u.y)) out.push({ sp, tx:u.x, ty:u.y, score: d <= 6 ? 20 : 8 });
    } else if (sp.heal && sp.ally) { // soigne l'allié le plus blessé (lui compris)
      for (const o of team) { const [ox,oy] = o===u ? [fx,fy] : [o.x,o.y];
        const miss = o.maxHp - o.hp; if (miss < o.maxHp*0.25 || !(o===u ? sp.minR===0 : can(sp,ox,oy))) continue;
        out.push({ sp, tx:ox, ty:oy, score: Math.min(miss, (sp.heal[0]+sp.heal[1])/2*u.mul)*1.3 + (miss/o.maxHp)*10 + (o.scale>1 ? 5 : 0) }); }
    } else if (sp.effect==='ward') {
      if (!(u.ward && u.ward.r >= G.round+1) && man(fx,fy,h.x,h.y) <= 5) out.push({ sp, tx:fx, ty:fy, score: 10 + (1-u.hp/u.maxHp)*12 });
    } else if (sp.effect==='tp') {
      if (!here) continue;
      if (sp.charge && d > 1 && ![...reachable(u).values()].some(n => man(n.x,n.y,h.x,h.y)===1)) { // bondit au contact s'il ne peut pas y aller à pied
        const hit = u.spells.filter(s => s.dmg && s.maxR<=2 && s!==sp).map(s => s.pa);
        for (const [a,b] of DIRS) if (can(sp,h.x+a,h.y+b)) { out.push({ sp, tx:h.x+a, ty:h.y+b, score: hit.length && u.pa-sp.pa >= Math.min(...hit) ? 14 : 3 }); break; }

      }
    } else if (sp.dmg || sp.push || sp.pull) {

      let sc = 0;
      if (sp.dmg) { const [a,b] = dmgRange(u,sp,h,1); sc = (a+b)/2; if (a >= h.hp) sc += 40; else if (b >= h.hp) sc += 15; }
      if (sp.poison && !(h.dots||[]).some(x => x.id===sp.id)) sc += sp.poison[0]*u.mul*sp.poison[1]*0.8;
      if (sp.slowPm && !h.malus && G.round > (h.slowFree ?? -1)) sc += 5;
      if (sp.drain) sc += Math.min(u.maxHp-u.hp, sc*sp.drain)*0.5;
      if (sp.push || sp.pull) {
        let [dx,dy] = dirFrom(fx,fy,h.x,h.y); if (sp.pull) { dx=-dx; dy=-dy; }
        const p = pushDest(h, dx, dy, sp.push || sp.pull, u);
        if (sp.push) sc += p.left*4*u.mul + (u.ranged ? 6 : p.left ? 0 : -4);
        else sc += u.ranged ? -10 : (man(p.x,p.y,fx,fy)===1 && u.spells.some(s => s.dmg && s.maxR<=2 && s!==sp && u.pa-sp.pa >= s.pa) ? 14 : 2);
      }
      if (sc > 0) out.push({ sp, tx: sp.self ? fx : h.x, ty: sp.self ? fy : h.y, score: sc });
    }
  }

}
// préférence de placement : un lanceur évite le corps à corps
function aiPlace(u, x, y) {
  if (!u.ranged) return 0;
  const h = aiFoe(u), d = man(x,y,h.x,h.y);
  return Math.min(d,6)*0.8 - (d<=1 ? 12 : d===2 ? 4 : 0);
}
// aucun sort possible ce tour : se rapprocher (un lanceur s'arrête à 3 cases)
async function aiApproach(u, m) {
  const h = aiFoe(u), dm = distMap(h.x,h.y), sc = n => (dm.get(key(n.x,n.y)) ?? 999) + (u.ranged && man(n.x,n.y,h.x,h.y) < 3 ? 20 : 0) + n.d*0.01;
  let tgt = null; for (const n of m.values()) if (!tgt || sc(n) < sc(tgt)) tgt = n;
  if (tgt && tgt.d>0) { const pa = pathFrom(m,tgt.x,tgt.y); await aiShow(pa); await moveAlong(u, pa); }
}
// fin de tour d'un lanceur : reculer hors de portée du héros, à couvert si possible, sans trop s'éloigner
async function aiRetreat(u) {
  const h = aiFoe(u), m = reachable(u), rs = u.spells.filter(s => s.dmg && !s.self).map(s => s.maxR), maxR = rs.length ? Math.max(...rs) : 3;
  let best = null, bs = -1e9;
  for (const n of m.values()) {
    const d = man(n.x,n.y,h.x,h.y), cover = !los(h.x,h.y,n.x,n.y,u);
    const sc = Math.min(d, maxR+1)*3 + (cover ? 5 : 0) - (d > maxR + u.maxPm ? 8 : 0) - n.d*0.3;
    if (sc > bs) { bs = sc; best = n; } }
  if (best && best.d>0) { const pa = pathFrom(m,best.x,best.y); await aiShow(pa); await moveAlong(u, pa); }
}
function dirFrom(ax,ay,bx,by) { const dx=bx-ax, dy=by-ay; return Math.abs(dx)>=Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)]; }
// case d'arrivée d'une unité poussée de n cases ; left = cases restantes quand elle heurte un obstacle
function pushDest(t, dx, dy, n, ign) {
  let x=t.x, y=t.y, k=0;
  for (; k<n; k++) { const nx=x+dx, ny=y+dy; if (!inB(nx,ny) || G.grid[ny][nx]!==0 || (unitAt(nx,ny) && unitAt(nx,ny)!==ign)) break; x=nx; y=ny; }
  return { x, y, left:n-k };
}
async function knock(u, t, sp) {
  let [dx,dy] = dirFrom(u.x,u.y,t.x,t.y); if (sp.pull) { dx=-dx; dy=-dy; }
  const p = pushDest(t, dx, dy, sp.push || sp.pull);
  if (p.x!==t.x || p.y!==t.y) {
    const sx=t.x, sy=t.y; await tween(160, k => { t.rx=sx+(p.x-sx)*k; t.ry=sy+(p.y-sy)*k; });
    t.x=t.rx=p.x; t.y=t.ry=p.y; log(`${t.name} est ${sp.pull ? 'attiré' : 'repoussé'}.`);
  }
  if (sp.push && p.left>0) { log(`${t.name} heurte un obstacle !`); hurt(t, Math.max(1, Math.round(p.left*4*u.mul))); }
  refreshReach(); dirty = true;
}
function addDot(t, sp, u) {
  const v = Math.max(1, Math.round(sp.poison[0]*u.mul)), n = sp.poison[1], w = sp.dotName || (sp.burn ? 'Brûlure' : 'Poison');
  t.dots = (t.dots||[]).filter(x => x.id!==sp.id); t.dots.push({ id:sp.id, v, n, name:w });
  addFloat(t.x, t.y-.4, sp.dotName ? 'Entaillé' : sp.burn ? 'Brûlé' : 'Empoisonné', sp.dotName ? '#e2554a' : sp.burn ? '#ff9a3c' : '#9be36a');
  log(`${t.name} subit ${w.toLowerCase()} : ${v} PV par tour pendant ${n} tours.`);
}
function summonCell(x,y) {
  for (let r=1;r<=2;r++) for (let a=-r;a<=r;a++) for (const b of [r-Math.abs(a), Math.abs(a)-r]) if (walkable(x+a,y+b)) return [x+a,y+b];
  return null;
}
async function summon(u, sp) {
  const c = summonCell(u.x,u.y); if (!c) return;
  const m = MONSTERS[sp.summon], hp = Math.round(m.hp*u.mul*0.4); // les invocations sont plus fragiles, frappent moins fort et ne rapportent rien
  const s = makeUnit(m, 'enemy', c[0], c[1], { hp, maxHp:hp, mul:u.mul*0.7, kind:sp.summon, summoned:true, summoner:u, name:`${m.name} invoqué`, alpha:0 });
  G.units.push(s); play('tp'); log(`${u.name} invoque : ${m.name} !`);

// description courte d'un sort de monstre (infobulle)
function foeSpellText(u, sp) {
  const m = v => Math.max(1, Math.round(v*u.mul)), p = [];
  if (!sp.self && !sp.summon) p.push(sp.ally ? `allié à ${sp.maxR} cases` : sp.maxR<=1 ? 'corps à corps' : `portée ${sp.minR}-${sp.maxR}`);
  if (sp.dmg) p.push(`${m(sp.dmg[0])}-${m(sp.dmg[1])} dégâts`);
  if (sp.poison) p.push(`${sp.burn ? 'brûlure' : 'poison'} ${m(sp.poison[0])} PV/tour pendant ${sp.poison[1]} tours`);
  if (sp.slowPm) p.push(`-${sp.slowPm} PM au tour suivant`);
  if (sp.drain) p.push(`rend ${Math.round(sp.drain*100)} % des dégâts en PV`);
  if (sp.push) p.push(`repousse de ${sp.push} case${sp.push>1 ? 's' : ''} (choc contre un obstacle)`);
  if (sp.pull) p.push(`attire de ${sp.pull} cases`);
  if (sp.heal) p.push(`soigne ${m(sp.heal[0])}-${m(sp.heal[1])} PV`);
  if (sp.effect==='ward') p.push(`+${sp.val} % de résistance`);
  if (sp.summon) p.push(`invoque : ${MONSTERS[sp.summon].name}`);
  if (sp.effect==='tp') p.push(sp.escape ? "s'éloigne d'un bond" : 'bondit au contact');
  if (sp.cd) p.push(`recharge ${sp.cd} tours`);
  return `${sp.name} (${p.join(', ')})`;
}
function stateText(o) {
  const t = [];
  for (const d of o.dots||[]) t.push(`${d.name} ${d.v} PV/tour (${d.n} tour${d.n>1 ? 's' : ''})`);
  if (o.malus) t.push(`ralenti (-${o.malus} PM)`);
  if ((o.marks||{}).desequ >= G.round) t.push('déséquilibré');
  if ((o.marks||{}).gel >= G.round) t.push('gelé');
  if (o.ambush >= G.round) t.push('embuscade prête');
  if (o.furyNext) t.push('Fureur au prochain tour');
  if (o.ward && o.ward.r >= G.round) t.push(`protégé (+${o.ward.v} % résistance)`);
  if (o.ice) t.push(`armure de glace (${o.ice} PV)`);
  if (o.enraged) t.push('enragé');
  if (o.mech) return `${t.length ? `État : ${t.join(', ')}. ` : ''}Mécanique : ${mechText(o.mech)} `;
  return t.length ? `État : ${t.join(', ')}. ` : '';
}
// montre au joueur ce que l'ennemi va faire avant qu'il le fasse
async function aiShow(cells, cast) {
  G.aiShow = { cells: cells.map(([x,y]) => ({x,y})), cast }; dirty = true;
  await sleep(cast ? 260 : 220);
  G.aiShow = null; dirty = true;
}
async function moveAlong(u,path) {
  u.moving = true;
  for (const [nx,ny] of path) {
    const sx=u.x, sy=u.y; face(u,nx,ny); play('pas');
    await tween(130, k => { u.rx=sx+(nx-sx)*k; u.ry=sy+(ny-sy)*k; });
    u.x=nx; u.y=ny; u.rx=nx; u.ry=ny; u.pm--; updateUI();
  }
  u.moving = false; dirty = true;
}

// ---------- Animations ----------
function tween(ms,fn) {
  ms /= SPEED;
  return new Promise(res => { const t0=performance.now(); tweening++;
    function step(now) { const k=Math.min(1,(now-t0)/ms); fn(k); dirty=true; if (k<1) requestAnimationFrame(step); else { tweening--; res(); } }
    requestAnimationFrame(step); });
}
function projectile(fx,fy,tx,ty,color) {
  const dur = (120 + man(fx,fy,tx,ty)*45)/SPEED;
  projs.push({fx,fy,tx,ty,color,t0:performance.now(),dur});
  return sleep(dur);
}
function addFloat(x,y,text,color) { floats.push({x,y,text,color,t0:performance.now()}); dirty = true;
  if (G.mode==='fight' && text[0]==='+') { const [cx,cy] = iso(x,y); fxBurst(cx, cy-20, color, 10, { up:true, sp:60, g:-30, size:3, life:800, spread:30 }); } } // soin ou bonus : étincelles qui montent

// ---------- Rendu ----------

function genSetItem(z, p) {
  const s = SETS.find(s => s.region===(z.region || 1)); if (!s) return genItem(z.tier, p.cls);
  const slots = Object.keys(s.pieces), own = p.inv.concat(Object.values(p.equip)).filter(it => it && it.set===s.id).map(it => it.slot);
  const miss = slots.filter(sl => !own.includes(sl)), slot = miss.length && Math.random()<.7 ? miss[rnd(0, miss.length-1)] : slots[rnd(0, slots.length-1)];
  let it = genItem(z.tier, p.cls, slot); if (!it.rarity) it = genItem(z.tier, p.cls, slot, 1);
  return Object.assign(it, { set:s.id, name:s.pieces[slot] });

// ---------- Métiers et fabrication (façon Dofus) ----------
// Trois métiers qui progressent séparément. On récolte dans les scènes (une ressource par métier et par zone hors villages,
// qui repousse après quelques combats) et on fabrique à l'atelier des villages. Ressources et consommables sont rangés à part
// (p.jobs) : ils ne prennent pas de place dans le sac. Les PV remontent après chaque combat : les repas donnent donc un bonus
// pour les prochains combats, et les potions se boivent pendant le combat.
const JOB_MAX = 25, JOB_REGROW = 3, MEAL_FIGHTS = 5;   // niveau max d'un métier ; combats avant repousse ; durée d'un repas
const JOB_REQ = [1,4,8,12,16,20];                       // niveau de métier demandé pour chaque palier (un palier par région)
const CRAFT_TIER = [3,7,11,15,19,23];                   // force (tier) des objets fabriqués à chaque palier
const jobXpNeed = lv => 10*lv;
const harvestXp = t => 10 + 5*t;
const JOBS = {
  paysan:   { name:'Paysan', icon:'🌾', desc:'Récolte céréales et plantes. Fabrique des potions (en combat) et des repas (bonus pour les prochains combats).',
    res:['Blé','Seigle des neiges','Lin des ruines','Herbe de lumière','Trèfle des fées','Piment de braise'] },
  bucheron: { name:'Bûcheron', icon:'🪓', desc:'Coupe les arbres. Fabrique des armes, des amulettes et des bottes.',
    res:['Frêne','Sapin','Saule','Chêne blanc','Bois de sylve','Bois de cendre'], mat:['de frêne','de sapin','de saule','de chêne blanc','de sylve','de cendre'],
    slots:['arme','amulette','bottes'] },
  mineur:   { name:'Mineur', icon:'⛏', desc:'Extrait les minerais. Fabrique des armes, des casques et des anneaux.',
    res:['Cuivre','Fer','Argent','Or','Jade','Obsidienne'], mat:['de cuivre','de fer',"d'argent","d'or",'de jade',"d'obsidienne"],
    slots:['arme','coiffe','anneau'] },
};
const JOB_IDS = Object.keys(JOBS);
const resName = (job, t) => JOBS[job].res[t];
// consommables du Paysan : potion (rend un % des PV max en combat) et repas (+% PV et +% dégâts pendant MEAL_FIGHTS combats)
const CONS = {};
['Potion de soin','Potion des neiges','Élixir des ruines','Élixir de lumière','Élixir des fées','Élixir de braise'].forEach((name,t) => CONS['potion'+t] = { id:'potion'+t, kind:'potion', t, name, heal:0.40 + 0.05*t });
['Pain de blé','Pain de seigle','Galette de lin','Brioche dorée','Tarte au trèfle','Ragoût pimenté'].forEach((name,t) => CONS['repas'+t] = { id:'repas'+t, kind:'repas', t, name, vie:10 + 4*t, puissance:4 + 2*t });
const consText = c => c.kind==='potion' ? `En combat : rend ${Math.round(c.heal*100)} % de tes PV max (2 PA, 1 fois par tour).` : `Repas : +${c.vie} % PV et +${c.puissance} % dégâts pendant ${MEAL_FIGHTS} combats.`;
// noms des objets fabriqués : les mêmes pour toutes les classes, sauf l'arme et la coiffe (CLASSES[cls].craft)
const CRAFT_NAMES = { amulette:'Amulette', bottes:'Sabots', anneau:'Anneau' };
const craftName = (job, slot, cls) => slot==='arme' ? CLASSES[cls].craft[job][0] : slot==='coiffe' ? CLASSES[cls].craft.coiffe : CRAFT_NAMES[slot];
const RECIPES = [];
for (let t=0; t<JOB_REQ.length; t++) {
  RECIPES.push({ id:'potion'+t, job:'paysan', t, cons:'potion'+t, need:{ ['paysan'+t]:4 }, xp:2*harvestXp(t) });
  RECIPES.push({ id:'repas'+t, job:'paysan', t, cons:'repas'+t, need:{ ['paysan'+t]:3, ['bucheron'+t]:1 }, xp:2*harvestXp(t) });
  for (const job of ['bucheron','mineur']) for (const slot of JOBS[job].slots)
    RECIPES.push({ id:job+slot+t, job, t, slot, need:{ [job+t]:8, [(job==='mineur' ? 'bucheron' : 'mineur')+t]:3 }, xp:4*harvestXp(t) });
}
// butin des monstres : chaque monstre vaincu laisse parfois une ressource (toujours pour les grands monstres et les chefs),
// et chaque recette en demande une, prise parmi les monstres de la région de son palier
const DROP_CHANCE = 0.5;
const MONSTER_DROPS = { gobelin:'Oreille de gobelin', chaman:'Plume de chaman', gluant:'Gelée gluante', orc:"Défense d'orc", ogre:"Dent d'ogre",
  squelette:'Os ancien', zombie:'Lambeau de zombie', givre:'Cœur de givre', orcmasque:'Masque brisé', necro:'Grimoire noir', diablotin:'Corne de diablotin',
  chort:'Sabot de chort', zombiegeant:'Os de géant', demon:'Corne démoniaque', ombre:"Essence d'ombre", gardien:'Éclat de miroir',
  fidele:'Médaillon du Soleil noir', pretre:'Encens noir', lezard:'Écaille de lézard', limace:'Bave de limace', pretresse:'Page volée',
  eclipse:"Fragment d'éclipse", eclaireur:'Flèche noire', pierre:'Cœur de pierre', bourreau:'Lame du bourreau', feufollet:'Lueur follette',
  bete:'Griffe corrompue', treant:'Écorce corrompue', champignon:'Spore géante', grandtreant:'Racine millénaire', salamandre:'Langue de salamandre',
  elemfeu:'Braise vive', golem:'Noyau de lave', ignarok:'Écaille de dragon',
  marin:'Foulard de marin', pirate:'Boucle de pirate', crabe:'Pince de crabe', anguille:'Peau électrique', meduse:'Filament de méduse', triton:'Écaille de triton', kraken:'Bec du Kraken',
  loup:'Fourrure de loup blanc', yeti:'Touffe de yéti', golemglace:'Cœur de glace', hrimgar:'Givre éternel' };
const dropPool = t => [...new Set(ZONES.filter(z => z.foes && regionOf(z.id)===t+1 && z.tier <= CRAFT_TIER[t]+1).flatMap(z => z.foes))].filter(k => MONSTER_DROPS[k] && !MONSTERS[k].big);
JOB_REQ.forEach((_,t) => { const pool = dropPool(t); RECIPES.filter(r => r.t===t).forEach((r,i) => { if (pool.length) r.need['m_'+pool[i % pool.length]] = r.slot ? 2 : 1; }); });
const ingName = id => id.startsWith('m_') ? MONSTER_DROPS[id.slice(2)] : resName(id.replace(/\d+$/,''), +id.match(/\d+$/)[0]);
function rollDrops() {
  const j = jobs(), got = {};
  for (const u of G.units) if (u.team==='enemy' && !u.alive && !u.summoned && MONSTER_DROPS[u.kind] && (MONSTERS[u.kind].big || Math.random() < DROP_CHANCE)) {
    const id = 'm_' + u.kind; j.res[id] = (j.res[id]||0) + 1; got[id] = (got[id]||0) + 1; }
  return got;
}
const dropsHtml = got => { const l = Object.entries(got); return l.length ? `<p class="help">🐾 Ressources de monstres : ${l.map(([id,n]) => `<b>${ingName(id)}</b> × ${n}`).join(' · ')} (métiers, touche J)</p>` : ''; };
const recipeName = (r, cls) => r.cons ? CONS[r.cons].name : `${craftName(r.job, r.slot, cls)} ${JOBS[r.job].mat[r.t]}`;
function jobs(p = G.profile) {
  const j = p.jobs || (p.jobs = {});
  for (const k of ['lv','xp','res','cons','cut']) j[k] = j[k] || {};
  for (const id of JOB_IDS) { j.lv[id] = j.lv[id] || 1; j.xp[id] = j.xp[id] || 0; }
  j.fights = j.fights || 0;
  return j;
}
function jobXp(job, n) {
  const j = jobs(), ups = [];
  if (j.lv[job] >= JOB_MAX) return ups;
  j.xp[job] += n;
  while (j.lv[job] < JOB_MAX && j.xp[job] >= jobXpNeed(j.lv[job])) { j.xp[job] -= jobXpNeed(j.lv[job]); j.lv[job]++; ups.push(j.lv[job]); }
  if (j.lv[job] >= JOB_MAX) j.xp[job] = 0;
  return ups;
}
const mealBonus = p => { const m = p.jobs && p.jobs.meal, c = m && CONS[m.id]; return c ? { vie:c.vie, puissance:c.puissance } : { vie:0, puissance:0 }; };
// au début de chaque combat (pas entre deux salles d'un donjon) : les ressources repoussent, le repas s'use
function jobFightStart(room) {
  if (room > 1) return;

// ---- dessin des ressources et de l'atelier (pixel art généré une fois) ----
let JOB_ART = null;
function jobArt() {
  if (JOB_ART) return JOB_ART;

    for (let y=15; y>15-h; y--) px(sx, y, '#7a8c3a'); if (!cut) for (let y=15-h; y<19-h; y++) { px(sx-1,y,col); px(sx+1,y,col); px(sx,y-1,col); } } };
  const tree = (px, t) => { for (let y=14;y<24;y++) for (let x=7;x<11;x++) px(x,y, x<9 ? '#6b4524' : '#4e3119');
    for (let y=0;y<16;y++) for (let x=0;x<18;x++) { const dx = x-8.5, dy = (y-7.5)*1.15; if (dx*dx+dy*dy < 64) px(x,y, (x*3+y*5)%7===0 || dx > 3 ? LEAF2[t] : LEAF[t]); }
    // une hache plantée dans le tronc et une entaille : cet arbre-là se coupe (les arbres du décor n'en ont pas)
    for (let x=11;x<16;x++) px(x,19,'#a0703a'); px(15,18,'#a0703a');
    for (let y=17;y<22;y++) { px(10,y,'#c9d2e0'); px(11,y, y===17 || y===21 ? '#c9d2e0' : '#8a94a4'); } px(9,19,'#e8d0a0'); px(9,20,'#e8d0a0'); };
  const rock = (px, t) => { for (let y=2;y<14;y++) for (let x=1;x<19;x++) { const dx = (x-9.5)/9, dy = (y-8)/6; if (dx*dx+dy*dy < 1) px(x,y, y<6 ? '#a09a92' : x>12 ? '#6e6962' : '#8a847c'); }

  JOB_ART = { paysan:[], bucheron:[], mineur:[] };
  for (let t=0; t<JOB_REQ.length; t++) {
    JOB_ART.paysan.push(ol(pixelCanvas(16,16, px => stalks(px, WHEAT[t]))));
    JOB_ART.bucheron.push(ol(pixelCanvas(18,24, px => tree(px, t))));
    JOB_ART.mineur.push(ol(pixelCanvas(20,14, px => rock(px, t))));
  }
  JOB_ART.cut = { paysan: ol(pixelCanvas(16,16, px => stalks(px, null, true))),
    bucheron: ol(pixelCanvas(12,8, px => { for (let y=2;y<8;y++) for (let x=2;x<10;x++) px(x,y, y===2 ? '#c49a62' : x>6 ? '#4e3119' : '#6b4524'); })),
    mineur: ol(pixelCanvas(20,14, px => rock(px, null))) };
  JOB_ART.bench = ol(pixelCanvas(24,18, px => {
    for (let x=0;x<24;x++) for (let y=6;y<9;y++) px(x,y, y===6 ? '#b07a42' : '#8a5a32');
    for (const lx of [2,20]) for (let y=9;y<18;y++) { px(lx,y,'#6b4524'); px(lx+1,y,'#4e3119'); }
    for (let x=4;x<11;x++) for (let y=2;y<6;y++) px(x,y, y===2 ? '#b8bcc4' : '#6d727c');   // enclume
    for (let x=6;x<9;x++) px(x,1,'#9aa3b5');
    for (let y=0;y<6;y++) px(16,y,'#8a5a32'); for (let x=14;x<19;x++) px(x,0,'#9aa3b5');    // marteau
    for (let x=12;x<14;x++) for (let y=3;y<6;y++) px(x,y,'#e8c25a');                        // gerbe

// ---- fenêtre Métiers (J) : métiers, ressources et consommables, fabrication à l'atelier ----

function craft(r, bonus) {
  const p = G.profile, j = jobs();
  if (!nearBench() || j.lv[r.job] < JOB_REQ[r.t] || !haveAll(r)) return;
  if (r.slot && p.inv.length >= BAG_MAX) return flashMsg('Sac plein : vends ou équipe un objet avant de fabriquer.');
  for (const [id,n] of Object.entries(r.need)) j.res[id] -= n;
  let msg;
  if (r.slot) {
    const o = craftOdds(r), x = Math.random(), rar = x < o.leg ? 3 : x < o.leg + o.epi ? 2 : 1;
    const it = genItem(o.tier, p.cls, r.slot, rar);
    if (CRAFT_BONUS[bonus]) { const add = Math.max(1, Math.round(CRAFT_BONUS[bonus][1] * (1 + o.tier*0.35) * RARITIES[rar].mult));
      it.stats[bonus] = (it.stats[bonus]||0) + add; it.value = Math.round(Object.entries(it.stats).reduce((a,[k,v]) => a + v*STATS[k][2], 0) * 1.2); }
