}
function showJournal() {
  const p = G.profile;
  // quêtes proposées mais pas encore acceptées : on dit à qui parler et où
  const waiting = G.scenes.filter(s => s.talk).map(s => { const q = questById(s.quest); return `<div class="quest${q.main?' main':''}"><b>${q.main ? '★ ' : ''}${q.title}</b><small>À recevoir</small>
    <div>💬 Va parler à ${NPCS[s.npc].name} (${zoneById(talkPlace(s)).name}). Suis la flèche dorée.</div></div>`; }).join('');
  const fl = treasure().flowers ? `<div class="quest"><b>🌸 Fleurs de lune</b><small>${NPCS.lune.name}</small>
    <div>💬 Tu as ${treasure().flowers} fleur${treasure().flowers>1 ? 's' : ''} de lune : va les offrir à Lune (${zoneById(lunePlace()).name}). Une enseigne bleue flotte au-dessus d'elle.</div><small>Récompense : amitié et +${Math.round(LUNE_XP*100)} % d'expérience par fleur, pour toujours</small></div>` : '';
  const zqs = Object.entries(G.profile.zq || {}).filter(([b,q]) => q.st==='on').map(([b,q]) => `<div class="quest"><b>🧭 ${zqTitle(b)}</b><small>${askerOf(b).name} · ${zoneById(b).name}</small>
    <div>${zqGoal(b)} (${zqProgress(b)} / ${ZQ_N})${zqProgress(b) >= ZQ_N ? ` : retourne voir ${askerOf(b).name} sur la carte 2.` : ''}</div></div>`).join('');
  const act = waiting + fl + zqs + activeQuests().map(q => `<div class="quest${q.main?' main':''}"><b>${q.main ? '★ ' : ''}${q.title}</b><small>${NPCS[q.npc].name}</small>
    <div>🎯 ${goalText(q)}</div><small>Récompense : ${rewardText(q.reward)}</small></div>`).join('') || '<p class="help">Aucune quête en cours.</p>';
  const done = QUESTS.filter(q => qs(q) && qs(q).state==='done').map(q => `<li>${q.title}</li>`).join('');
  overlay(`<h2>Journal de quêtes</h2><p class="help">Chapitre ${Math.min(p.story+1, MAIN.length)}/${MAIN.length} · ${p.story>=MAIN.length ? 'Histoire terminée !' : 'Les quêtes principales (★) font avancer l\'histoire et ouvrent de nouvelles zones.'}</p>
    <h3>En cours</h3>${act}${done ? `<h3>Terminées</h3><ul class="help">${done}</ul>` : ''}
    <div style="text-align:center"><button class="btn" id="b1">Fermer</button></div>`, true);
  $('#overlay').dataset.menu = 'quests';
  $('#b1').onclick = () => { hideOverlay(); showNextScene(); };

  overlay(`<h2>🔍 ${c.clue.name}</h2><p>${fillHero(c.clue.text)}</p>${left ? `<p class="help">${c.q.title} : encore ${left} indice${left>1 ? 's' : ''} à trouver (voir le journal, touche Q).</p>` : next}
    <div style="text-align:center"><button class="btn" id="b1">Continuer</button></div>`, true);
  $('#b1').onclick = () => { hideOverlay(); showNextScene(); };
  npcCache.k = ''; dirty = true;
}
// ---------- Exploration : passages à dégager, quêtes de zone, événements, brouillard ----------
const RARE_GROUP = 0.03, TRADER_CHANCE = 0.08; // chance qu'un groupe errant soit rare ; qu'un marchand ambulant soit là en arrivant sur une carte
// passage vers la carte suivante d'une zone : bloqué tant qu'aucun groupe de la carte n'est battu (ouvert pour de bon une fois la zone libérée)
const gateLocked = (cur, e) => !!e && nMaps(baseOf(cur)) > 1 && e.to===mapId(baseOf(cur), mapN(cur)+1) && !isCleared(baseOf(cur)) && !(G.profile.gates || []).includes(cur);
// brouillard : une zone de combat apparaît sur la carte du monde une fois toutes ses cartes traversées (ou la zone libérée)
const seenMaps = b => { const s = G.profile.seen || []; let n = 0; for (let k=1; k<=nMaps(b); k++) if (s.includes(mapId(b, k))) n++; return n; };
const revealed = b => { const z = zoneById(b); return !z.foes || z.icon==='portal' || isCleared(b) || seenMaps(b) >= nMaps(b); };
function drawFog(x, y, r, now) {
  for (let k=0; k<7; k++) { const a = k/7*Math.PI*2 + now/4000, d = r*.75; ctx.fillStyle = `rgba(${k%2 ? '200,205,215' : '170,176,190'},.92)`; ctx.beginPath(); ctx.arc(x + Math.cos(a)*d, y + Math.sin(a)*d*.7 - 2, r*.62, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(215,220,228,.95)'; ctx.beginPath(); ctx.arc(x, y-2, r*.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a5f6a'; ctx.font = 'bold 18px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', x, y+4);
}
// quêtes de zone : un voyageur égaré sur la 2e carte de chaque zone de combat demande un service
const ZQ_N = 3;
const zqType = b => strHash(b + 'quête') % 2 ? 'lost' : 'hunt';
const zq = b => (G.profile.zq = G.profile.zq || {})[b];
const askerOf = b => { const h = strHash(b + 'voyageur'); return { name: FOLK_NAMES[h % FOLK_NAMES.length], look: FOLK_LOOKS[(h >> 3) % FOLK_LOOKS.length] }; };
const zqProgress = b => { const q = zq(b); return !q ? 0 : zqType(b)==='lost' ? q.got.length : q.kills; };
const zqTitle = b => zqType(b)==='lost' ? 'Les affaires perdues' : 'La route dangereuse';
const zqGoal = b => zqType(b)==='lost' ? `Retrouve les ${ZQ_N} sacs perdus, un sur chaque carte de la zone` : `Bats ${ZQ_N} groupes de monstres dans la zone`;
const lostVisible = s => { const b = baseOf(s.id), q = zq(b); return !q || (q.st==='on' && !q.got.includes(s.id)); };
function talkAsker() {
  const b = baseOf(G.profile.pos), z = zoneById(b), a = askerOf(b), q = zq(b), p = G.profile, done = q && q.st==='on' && zqProgress(b) >= ZQ_N;
  const say = !q ? (zqType(b)==='lost' ? `Ah, enfin quelqu'un ! Des monstres m'ont attaqué et j'ai perdu mes ${ZQ_N} sacs en fuyant à travers ${z.name}. Tu pourrais les retrouver ? Il y en a un sur chaque carte de la zone.`
      : `Je n'ose plus avancer : ${z.name} grouille de monstres. Si tu pouvais battre ${ZQ_N} de leurs groupes, je pourrais enfin reprendre la route…`)
    : done ? 'Tu as réussi ! Merci mille fois. Tiens, prends ceci, tu l\'as bien mérité.'
    : q.st==='on' ? `${zqGoal(b)} : ${zqProgress(b)} / ${ZQ_N}. Bon courage, ${heroName()} !` : 'Merci encore pour ton aide ! Je vais pouvoir rentrer chez moi.';
  overlay(`<div class="scene">${portraitOf(spriteSrc(a.look[0]), a.look[1])}<div class="say"><small class="who">Un voyageur égaré</small><h2>${a.name}</h2>
    <p>« ${say} »</p>${!q ? `<p class="help">🧭 Quête de zone : ${zqGoal(b)}. Récompense : de l'or et un objet rare.</p>` : ''}
    <div style="text-align:right">${!q ? '<button class="btn alt" id="b2">Plus tard</button><button class="btn" id="b1">J\'accepte</button>' : '<button class="btn" id="b1">Au revoir</button>'}</div></div></div>`, true);
  if (!q) { $('#b1').onclick = () => { p.zq[b] = { st:'on', got:[], kills:0 }; save(); hideOverlay(); dirty = true; banner(`Quête de zone : ${zqTitle(b)}`); showNextScene(); };
    $('#b2').onclick = () => { hideOverlay(); showNextScene(); }; return; }
  $('#b1').onclick = () => { hideOverlay(); showNextScene(); };
  if (done) { q.st = 'done'; const tier = z.tier || 0, gold = rnd(40,60) * (1 + tier); let it = genItem(tier + 1, p.cls); if (it.rarity < 1) it = genItem(tier + 1, p.cls, it.slot, 1);
    const kept = addToBag(it); p.gold += gold; play('piece'); save(); refreshMapTitle(); dirty = true;
    $('#b1').onclick = () => treasureBox('Quête de zone accomplie !', `<img class="coin" src="${SPRITES.coin_anim_f0}" alt=""> +${gold} or`, it, kept, `${a.name} te remercie et reprend la route.`); }
}
function pickLost(at) {
  const b = baseOf(G.profile.pos), q = zq(b);
  if (!q) return banner(`Un sac abandonné… Son propriétaire, ${askerOf(b).name}, doit être quelque part sur la carte 2 de la zone.`);
  if (q.st!=='on' || q.got.includes(G.profile.pos)) return;
  q.got.push(G.profile.pos); play('piece'); save(); dirty = true; addSceneFloat(at[0], at[1], `Sac ${q.got.length} / ${ZQ_N}`);
  banner(q.got.length >= ZQ_N ? `Tous les sacs sont retrouvés ! Rapporte-les à ${askerOf(b).name}.` : `Sac retrouvé (${q.got.length} / ${ZQ_N})`);
}
// ---------- Mode test (touche F2) ----------
const DBG = { god:false };
const CHAPTER_LEVEL = [1,2,3,4,5,6,8,10,11,13,14,17,20,23,25,27,29,31,34,35,36,37,38,39,41,42,43,44,45,46,48,49,50,51,52,53,55,56,57,58,59,60,62,63,64,65,66,67,69];
function dbgMsg(t) { banner('Test : ' + t); }
function dbgAfterChange() { save(); if (G.mode==='map') { refreshMapTitle(); dirty = true; } renderDbg(); }
function setSpeed(v) { SPEED = v; try { localStorage.setItem('chroniques-plaine-speed', v); } catch (e) {} renderDbg(); }
function giveGear(tier, rarity) {
  const p = G.profile;
  for (const slot of Object.keys(SLOTS)) { const it = genItem(tier, p.cls, slot, rarity); p.equip[slot] = it; }
}
function jumpToChapter(n, withLevel, withGear) {
  const p = G.profile;
  p.story = n; p.quests = {}; p.cleared = [];
  MAIN.forEach((q,i) => { if (i < n) { p.quests[q.id] = { state:'done' }; p.cleared.push(q.goal.zone); } });
  const q = MAIN[n], zone = q ? q.goal.zone : MAIN[MAIN.length-1].goal.zone;
  p.pos = { 1:'village', 2:'camp', 3:'ermitage', 4:'pelerins', 5:'fees', 6:'haltecendres', 7:'portecume', 8:'refuge' }[regionOf(zone)];
  if (withLevel) { p.level = CHAPTER_LEVEL[n]; p.xp = 0; }
  if (withGear) giveGear(zoneById(zone).tier, 1);
  p.shop = null; G.scenes = [];
  hideOverlay(); openMap(); talkAll(); renderDbg();
  dbgMsg(q ? `chapitre ${n+1} : ${q.title}` : 'histoire terminée');
}
function dbgWin(win) {
  if (G.mode!=='fight' || G.over) return;
  for (const u of G.units) if (win ? u.team==='enemy' : u===G.hero) { u.hp = 0; u.alive = false; }
  dirty = true; checkEnd();
}
function toggleDbg() { const d = $('#dbg'); d.classList.toggle('hide'); if (!d.classList.contains('hide')) renderDbg(); }
function renderDbg() {
  const d = $('#dbg'); if (d.classList.contains('hide')) return;
  const p = G.profile, inFight = G.mode==='fight' && !G.over;
  const sp = [1,2,4,8].map(v => `<button class="btn sm${SPEED===v?' on':''}" data-speed="${v}">x${v}</button>`).join('');
  let h = `<h3>🛠 Mode test <small style="color:var(--muted)">(F2 pour fermer)</small></h3>
    <h4>Vitesse des combats</h4><div class="row">${sp}</div>`;
  if (!p) { d.innerHTML = h + `<p class="note">Lance ou continue une partie pour accéder aux autres outils.</p>`; bindDbg(); return; }
  h += `<h4>Aller directement à un chapitre</h4>
    <div class="row"><select id="dbgCh">${MAIN.map((q,i) => `<option value="${i}"${i===p.story?' selected':''}>${i+1}. ${q.title}</option>`).join('')}<option value="${MAIN.length}"${p.story>=MAIN.length?' selected':''}>Fin de l'histoire</option></select></div>
    <div class="row"><label><input type="checkbox" id="dbgLv" checked> niveau conseillé</label> <label><input type="checkbox" id="dbgGear" checked> équipement rare</label></div>
    <div class="row"><button class="btn sm" id="dbgGo">Y aller</button></div>
    <h4>Personnage (niv. ${p.level}, ${p.gold} or)</h4>
    <div class="row"><button class="btn sm" data-lv="-1">Niveau −1</button><button class="btn sm" data-lv="1">Niveau +1</button><button class="btn sm" data-lv="5">+5</button><button class="btn sm" id="dbgGold">+1000 or</button></div>
    <div class="row" style="margin-top:4px"><button class="btn sm" data-gear="1">Équipement rare</button><button class="btn sm" data-gear="2">épique</button><button class="btn sm" data-gear="3">légendaire</button></div>
    <div class="row" style="margin-top:4px"><button class="btn sm" id="dbgLeg">Objet légendaire dans le sac</button><button class="btn sm" id="dbgRes">Ressources +20</button></div>
    <p class="note">Les changements de niveau et d'équipement s'appliquent au prochain combat.</p>
    <h4>Combat en cours</h4>
    <div class="row"><button class="btn sm" id="dbgWin"${inFight?'':' disabled'}>Gagner</button><button class="btn sm" id="dbgLose"${inFight?'':' disabled'}>Perdre</button><button class="btn sm" id="dbgHeal"${inFight?'':' disabled'}>Soigner</button><button class="btn sm${DBG.god?' on':''}" id="dbgGod">Invincible</button></div>
    <h4>Sauvegarde</h4>
    <div class="row"><button class="btn sm alt" id="dbgReset">Effacer et revenir au menu</button></div>
    <p class="note">Attention : ces outils modifient ta sauvegarde actuelle.</p>`;
  d.innerHTML = h; bindDbg();
}
function bindDbg() {
  const d = $('#dbg'), on = (sel, fn) => { const e = d.querySelector(sel); if (e) e.onclick = fn; };
  d.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => setSpeed(+b.dataset.speed));
  if (!G.profile) return;
  const p = G.profile;
  on('#dbgGo', () => jumpToChapter(+$('#dbgCh').value, $('#dbgLv').checked, $('#dbgGear').checked));
  d.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { p.level = Math.max(1, Math.min(XP_MAX_LEVEL, p.level + +b.dataset.lv)); p.xp = 0; dbgAfterChange(); });
  on('#dbgGold', () => { p.gold += 1000; dbgAfterChange(); });
  d.querySelectorAll('[data-gear]').forEach(b => b.onclick = () => { const z = MAIN[Math.min(p.story, MAIN.length-1)].goal.zone; giveGear(zoneById(z).tier, +b.dataset.gear); dbgAfterChange(); dbgMsg('équipement remplacé'); });
  on('#dbgLeg', () => { if (p.inv.length >= BAG_MAX) return dbgMsg('sac plein'); const z = MAIN[Math.min(p.story, MAIN.length-1)].goal.zone; const it = genItem(zoneById(z).tier, p.cls, null, 3); p.inv.push(it); dbgAfterChange(); dbgMsg(it.name); });
  on('#dbgRes', () => { const j = jobs(); for (const id of JOB_IDS) for (let t=0; t<JOB_REQ.length; t++) j.res[id+t] = (j.res[id+t]||0) + 20; for (const k in MONSTER_DROPS) j.res['m_'+k] = (j.res['m_'+k]||0) + 20; dbgAfterChange(); dbgMsg('ressources +20'); });
  on('#dbgWin', () => dbgWin(true));
  on('#dbgLose', () => dbgWin(false));
  on('#dbgHeal', () => { if (G.hero) { G.hero.hp = G.hero.maxHp; dirty = true; updateUI(); } });
  on('#dbgGod', () => { DBG.god = !DBG.god; renderDbg(); });
  on('#dbgReset', () => { if (!confirm('Effacer ce personnage ?')) return; if (G.profile && G.profile.slot) deleteSlot(G.profile.slot); G.token++; G.over = true; G.profile = null; G.scenes = []; document.body.classList.remove('map'); showMenu(); renderDbg(); });
}

buildDecor();
CAT_ICON = buildCat();
loadSprites().then(() => { buildVariants(); buildExtraSprites(); showMenu(); requestAnimationFrame(frame); initSaveFile(); initPersist(); showTitle(); });
// ---- écran de démarrage : ciel d'aube animé, les trois héros et Forest ; un clic, une touche ou un toucher mène au choix du personnage ----
function showTitle() {
  const el = document.getElementById('title'); if (!el) return;
  if (navigator.webdriver && !location.hash.includes('titre')) { el.remove(); return; } // tests automatiques : on passe directement au menu
  const c = el.querySelector('canvas'), g = c.getContext('2d'), stars = Array.from({ length:90 }, () => [Math.random(), Math.random()*.55, Math.random()*6.3, .5 + Math.random()*1.4]);
  let on = true;
  const hill = (W, H, base, amp, f, ph, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, H*base - amp*H*(.55*Math.sin(x/W*f + ph) + .3*Math.sin(x/W*f*2.3 + ph*1.7) + .15*Math.sin(x/W*f*5.1))); g.lineTo(W, H); g.fill(); };
  const draw = now => { if (!on) return;
    if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; } const W = c.width, H = c.height, t = now/1000;
    const sky = g.createLinearGradient(0, 0, 0, H*.72); sky.addColorStop(0, '#0b1020'); sky.addColorStop(.45, '#33285a'); sky.addColorStop(.78, '#b0567a'); sky.addColorStop(1, '#f4a35a');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    for (const [x, y, p, r] of stars) { g.globalAlpha = .35 + .65*Math.abs(Math.sin(t*.9 + p)); g.fillStyle = '#fff'; g.fillRect(x*W, y*H, r, r); } g.globalAlpha = 1;
    const sy = H*.60 - 6*Math.sin(t*.4), glow = g.createRadialGradient(W/2, sy, 0, W/2, sy, H*.45);
    glow.addColorStop(0, 'rgba(255,214,140,.95)'); glow.addColorStop(.12, 'rgba(255,170,90,.55)'); glow.addColorStop(1, 'rgba(255,140,80,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H); g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(W/2, sy, Math.min(W, H)*.07, 0, 7); g.fill();
    hill(W, H, .64, .06, 5, t*.03, '#4a2f55'); hill(W, H, .70, .05, 7, 1.3 + t*.05, '#2d2440'); hill(W, H, .78, .03, 4, 2.1, '#191a2a');
    g.imageSmoothingEnabled = false; const sc = Math.max(2, Math.round(Math.min(W, H)/230)), gy = H*.76;
    ['knight_m', 'wizzard_m', 'roublard'].forEach((sp, i) => { const img = animFrame(sp, false, now, i*1.3); if (img) g.drawImage(img, W/2 + (i-1)*26*sc - img.width*sc/2, gy - img.height*sc, img.width*sc, img.height*sc); });
    try { const cat = forestFrame(now, 1.5, { story:0 }); if (cat) g.drawImage(cat, W/2 + 44*sc - cat.width*sc/2, gy - cat.height*sc, cat.width*sc, cat.height*sc); } catch (e) {}
    requestAnimationFrame(draw); };
  requestAnimationFrame(draw);
  const go = e => { if (e) { e.preventDefault(); e.stopImmediatePropagation(); } if (!on) return; on = false;
    el.classList.add('out'); document.removeEventListener('keydown', go, true); setTimeout(() => el.remove(), 650); };
  el.addEventListener('click', go); document.addEventListener('keydown', go, true);
}
