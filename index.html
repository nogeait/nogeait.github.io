const QUESTS = [
  { id:'q1', main:true, title:'Les rôdeurs de la lisière', npc:'maela', goal:{ type:'clear', zone:'lisiere' },
    reward:{ xp:90, gold:30, item:{ slot:'anneau', rarity:0 } },
    intro:["Ah, te voilà enfin, {héros}. Et Forest est avec toi, bien sûr : ce chat noir ne te quitte jamais d'une patte. Aubépine a besoin de vous deux.",
      "Il y a trois lunes, le <b>Cristal de la Plaine</b> a disparu de notre sanctuaire. Depuis, plus rien ne protège nos terres et les monstres s'approchent chaque jour un peu plus.",
      "Des Gobelins rôdent déjà à la lisière de la plaine, à deux pas de nos maisons. Chasse-les, et nous verrons si tu es bien l'aventurier que la prophétie annonçait."],
    outro:["Bien joué ! Les Gobelins ne reviendront pas de sitôt.",
      "Mais regarde : ils transportaient des sacs de blé. Ce blé vient des Champs du nord… Va voir Bastien, notre fermier. Il a sûrement des choses à te raconter."] },
  { id:'q2', main:true, title:'Les récoltes pillées', npc:'bastien', goal:{ type:'clear', zone:'champs' },
    reward:{ xp:130, gold:50, item:{ slot:'bottes', rarity:1 } },
    intro:["Mes champs ! Mes pauvres champs ! Un Chaman orc a pris la tête d'une bande de Gobelins et ils volent toutes nos récoltes.",
      "Chasse-les, {héros}, je t'en prie. Pour ta peine, je te donnerai mes vieilles bottes de voyage. Elles valent bien mieux qu'elles n'en ont l'air !"],
    outro:["Merci, mille fois merci ! Tiens, ces bottes sont à toi.",
      "En s'enfuyant, le Chaman a crié quelque chose à propos du marais et d'un « maître »… Lune, l'herboriste, connaît le marais mieux que personne. Va lui parler."] },
  { id:'s1', title:'Chasseur de gobelins', npc:'bastien', startsWith:'q2', goal:{ type:'kill', monster:'gobelin', n:6 },
    reward:{ xp:120, gold:60 },
    intro:["Et pendant que tu y es… Ces Gobelins sont bien trop nombreux. Si tu en élimines six, je te paierai de ma poche !"],
    outro:["Six Gobelins ! Les champs respirent enfin. Voilà ta récompense, bien méritée."] },
  { id:'c_roublard', cls:'roublard', title:"Les ombres d'Aubépine", npc:'corwin', startsWith:'q1', goal:{ type:'kill', monster:'gobelin', n:4 },
    reward:{ xp:80, gold:40, item:{ slot:'arme', rarity:2, name:"Croc d'Aubépine" } },
    intro:["Psst… Par ici, {héros}. Ne fais pas cette tête : je ne suis qu'un vieux voleur qui a raccroché ses dagues.",
      "Je reconnais une lame silencieuse quand j'en vois une. Les Gobelins de la lisière m'ont dérobé un vieux souvenir : le <b>Croc d'Aubépine</b>, la meilleure dague que j'aie jamais portée.",
      "Élimine quatre de ces voleurs de bas étage, sans bruit si possible. La dague est à toi si tu la retrouves."],
    outro:["Quatre Gobelins, et aucun n'a rien vu venir. Tu as le geste, {héros}.",
      "Voilà le Croc d'Aubépine. Garde-le bien affûté… et méfie-toi de ceux qui sourient trop."] },
  { id:'s_metier', title:'Apprenti paysan', npc:'bastien', startsWith:'q2', goal:{ type:'craft', recipe:'potion0', n:1 },
    reward:{ xp:100, gold:40, cons:{ potion0:2, repas0:1 } },
    intro:["Dis-moi, {héros}, tu sais te débrouiller avec une faucille ? Un aventurier qui sait récolter et fabriquer ne manque jamais de rien.",
      "Dans chaque zone, tu trouveras du blé, un arbre et un filon <b>entourés d'un cercle doré</b> : clique dessus pour récolter. Ça repousse après quelques combats.",
      "Les monstres aussi laissent des choses utiles : garde bien les <b>Oreilles de gobelin</b> que tu trouveras sur eux.",
      "Ensuite, va à l'<b>atelier d'Aubépine</b>, l'établi avec l'enclume, et fabrique une <b>Potion de soin</b>. Ta fenêtre <b>Métiers (touche J)</b> te montrera la recette."],
    outro:["Ta première potion ! Pendant un combat, elle apparaît dans ta barre de sorts : bois-la quand ça tourne mal.",
      "Tiens, deux autres potions et un bon pain de blé pour la route. Plus tes métiers montent, plus tu pourras fabriquer de belles choses : un jour, même des objets légendaires !"] },
  { id:'s2', title:'Bien équipé', npc:'bastien', startsWith:'q2', goal:{ type:'equip', n:4 },
    reward:{ xp:100, gold:40 },
    intro:["Un conseil de vieux fermier : on ne part pas à l'aventure les mains vides. Équipe-toi d'une arme, d'une coiffe, d'un anneau et de bottes. Le marchand d'Aubépine pourra t'aider."],
    outro:["Te voilà équipé de la tête aux pieds ! Tu as fière allure, {héros}."] },
  { id:'q3', main:true, title:'Le marais gluant', npc:'lune', goal:{ type:'clear', zone:'marais' },
    reward:{ xp:170, gold:70, item:{ slot:'coiffe', rarity:1 } },
    intro:["Bonjour, {héros}. Bastien m'a parlé de toi.",
      "Des Gluants ont envahi le marais où je cueille mes plantes. Ce n'est pas naturel : on dirait qu'une magie étrange les attire là-bas… comme si quelqu'un les avait appelés.",
      "Débarrasse le marais de ces créatures et rapporte-moi ce que tu y trouveras."] },
  { id:'s3', title:'Le mucus des Gluants', npc:'lune', startsWith:'q3', goal:{ type:'kill', monster:'gluant', n:4 },
    reward:{ xp:150, gold:50, item:{ rarity:1 } },
    intro:["Oh, et si tu croises des Gluants, rapporte-moi leur mucus. Il m'en faut celui de quatre Gluants pour préparer un remède."],
    outro:["Parfait, ce mucus est d'une qualité rare ! Prends cet objet en échange, je n'en ai plus l'usage."] },
  { id:'q4', main:true, title:'La piste du moulin', npc:'lune', goal:{ type:'clear', zone:'moulin' },
    reward:{ xp:210, gold:90, item:{ slot:'arme', rarity:1 } },
    intro:["Regarde ce que portait le Chaman du marais : une plume d'ogre ! Le <b>Chef Ogre</b> est derrière tout ça, j'en suis sûre.",
      "Son repaire se cache quelque part au-delà du Bois des murmures, mais personne n'en connaît le chemin. Garrick, notre éclaireur, est parti le chercher… et il n'est jamais revenu.",
      "On l'a vu pour la dernière fois près du vieux moulin. Retrouve-le, {héros} !"],
    outroNpc:'garrick',
    outro:["(Garrick sort du moulin en se frottant les poignets.)",
      "Tu m'as sauvé la vie ! Ces brutes me retenaient prisonnier. Prends cette arme, je l'ai prise à l'un d'eux."] },
  { id:'s4', title:"Les chamans de l'Ogre", npc:'garrick', startsWith:'q5', goal:{ type:'kill', monster:'chaman', n:6 },
    reward:{ xp:180, gold:80 },
    intro:["Les Chamans orcs sont les yeux et les oreilles du Chef Ogre. Élimine-en six, et il sera aveugle quand tu viendras frapper à sa porte."],
    outro:["Six Chamans ! Le Chef Ogre ne verra pas le coup venir."] },
  { id:'q5', main:true, title:'Le bois des murmures', npc:'garrick', goal:{ type:'clear', zone:'bois' },
    reward:{ xp:250, gold:120, item:{ rarity:2 } },
    intro:["Pendant ma captivité, j'ai entendu leurs plans. Le Chef Ogre se sert du Cristal pour rendre ses troupes plus fortes.",
      "Son armée se rassemble dans le Bois des murmures, sous les ordres d'un <b>Orc guerrier</b>. Abats-le, et nous trouverons sûrement le chemin de l'antre."],
    outro:["L'Orc guerrier est tombé ! Et regarde : il portait une carte.",
      "Elle mène à l'antre du Chef Ogre, dans les montagnes. Avant d'y aller, prépare-toi bien : passe voir le marchand, et n'hésite pas à refaire quelques combats."] },
  { id:'q6', main:true, title:'Le Cristal de la Plaine', npc:'maela', goal:{ type:'clear', zone:'antre' },
    reward:{ xp:400, gold:300, item:{ rarity:2 } },
    intro:["Garrick m'a tout raconté. Tu as accompli des merveilles, {héros}.",
      "Il ne reste qu'une chose à faire : affronter le <b>Chef Ogre</b> dans son antre et nous rapporter le Cristal de la Plaine.",
      "Sois prudent. Tout Aubépine compte sur toi."],
    outro:["Tu l'as fait, {héros} ! Les monstres fuient déjà nos terres. Aubépine se souviendra de ton nom pour toujours.",
      "La Plaine est vaste, et d'autres aventures t'attendent peut-être. Continue à t'entraîner : on ne sait jamais ce que l'avenir nous réserve."] },
  // ----- Acte II : les Terres du Nord -----
  { id:'q7', main:true, title:'Le passage du Nord', npc:'maela', goal:{ type:'clear', zone:'col' },
    reward:{ xp:350, gold:180, item:{ slot:'cape', rarity:1 } },
    intro:["Le Cristal est revenu, mais quelque chose me trouble, {héros}. Le Chef Ogre n'était pas assez malin pour le voler tout seul.",
      "Dans son antre, Garrick a trouvé des lettres signées d'un certain <b>Nécromancien</b>, venu des Terres du Nord, au-delà des montagnes.",
      "Garrick est parti installer un camp là-bas. Emprunte le <b>Passage du Nord</b>, à côté de l'antre, rejoins-le et franchis le Col des brumes."],
    outroNpc:'garrick',
    outro:["Te voilà enfin ! Et tu as traversé le col sans une égratignure… ou presque.",
      "Tu as vu ces squelettes et ces zombies ? Le Nécromancien relève les morts pour en faire son armée. Prends cette cape, les nuits sont glaciales par ici."] },
  { id:'s5', title:'Repos éternel', npc:'garrick', startsWith:'q8', goal:{ type:'kill', monster:'squelette', n:6 },
    reward:{ xp:400, gold:150, item:{ rarity:1 } },
    intro:["Ces squelettes ne méritent que le repos. Renvoies-en six sous terre, et je te donnerai une pièce de mon équipement."],
    outro:["Six squelettes de moins ! Les morts te remercient, à leur façon."] },
  { id:'s6', title:'Bien équipé, version Nord', npc:'garrick', startsWith:'q7', goal:{ type:'equip', n:6 },
    reward:{ xp:300, gold:120 },
    intro:["Dans le Nord, on porte une amulette et une cape en plus du reste. Équipe-toi des six emplacements, tu en auras besoin !"],
    outro:["Six emplacements équipés. Là, tu es prêt pour le froid !"] },
  { id:'q8', main:true, title:'Le cimetière oublié', npc:'garrick', goal:{ type:'clear', zone:'cimetiere' },
    reward:{ xp:420, gold:200, item:{ slot:'amulette', rarity:1 } },
    intro:["Le cimetière, au nord du col, est envahi. Chaque nuit, de nouveaux morts sortent de terre et rejoignent l'armée du Nécromancien.",
      "Va là-bas et fais-les retourner au repos, {héros}."],
    outro:["Le cimetière est enfin calme. Sur une tombe, j'ai trouvé ce symbole gravé : un flocon traversé d'un crâne.",
      "J'ai écrit à Lune, elle connaît tous les vieux symboles. Elle est déjà en route pour le camp ! En attendant, garde cette amulette."] },
  // Longue quête en plusieurs étapes (steps) : chaque étape a son objectif ; « say » se dit à la fin de l'étape, « end » s'affiche avec le dernier indice trouvé
  { id:'l1', title:"L'épée de Hautelys", npc:'garrick', startsWith:'q8',
    reward:{ xp:1000, gold:350, item:{ slot:'arme', rarity:2, names:{ guerrier:'Épée de Hautelys', mage:'Sceptre de Hautelys', roublard:'Dague de Hautelys' } } },
    intro:["En plantant les piquets du camp, mes hommes ont déterré ça : une lame brisée, rongée par le givre.",
      "Regarde la garde : un <b>soleil levant sous une couronne</b>. Je n'ai jamais vu ce blason, et pourtant j'ai parcouru tout Valdoria.",
      "Quelqu'un est mort ici avec cette épée, il y a très longtemps. Fouille le Col des brumes et le Cimetière oublié : tu trouveras peut-être d'où elle vient."],
    steps:[
      { goal:{ type:'clue', label:"Chercher des traces du porteur de l'épée", clues:[
          { zone:'col', name:'Une stèle à demi enterrée', text:"Sous la neige, une vieille stèle penche vers le sol. On devine encore quelques mots : « … ici tomba la garde du roi … fidèle jusqu'à l'aube … ». Le soleil couronné est gravé à son sommet." },
          { zone:'cimetiere', name:'Une tombe de chevalier', text:"Une tombe bien plus ancienne que les autres, ornée du soleil couronné. Le nom est presque effacé : « Sire Aldric, dernier chevalier de Hautelys ». Étrange : la dalle semble avoir été poussée de l'intérieur…" }] },
        end:"Hautelys… Maela, l'Ancienne d'Aubépine, connaît les vieilles histoires mieux que personne. Va lui montrer l'épée." },
      { goal:{ type:'talk', npc:'maela', zone:'village', lines:[
          "Un soleil levant sous une couronne… Je n'avais pas revu ce blason depuis mon enfance, dans un vieux livre de ma grand-mère.",
          "C'est celui de <b>Hautelys</b>, l'ancien royaume qui unissait autrefois tout Valdoria. On disait que ses rois descendaient de l'Aube elle-même.",
          "Le royaume est tombé il y a des siècles, pendant une terrible guerre. Ses derniers chevaliers ont fui vers le Nord pour mettre à l'abri ce qu'ils pouvaient.",
          "Si la tombe d'Aldric a été ouverte de l'intérieur, son esprit n'a pas trouvé le repos. Ses gardes errent sans doute encore là-haut. Libère-les, {héros}."] } },
      { goal:{ type:'kill', monster:'squelette', n:4, label:"squelettes, les gardes d'Aldric" },
        say:{ npc:'aldric', pages:["(Le dernier squelette s'effondre. Une silhouette pâle se dresse au-dessus des tombes.)",
          "Tu as rendu le repos à mes hommes, voyageur. Depuis la chute de Hautelys, ils montaient la garde sans fin.",
          "Ma lame s'est brisée ici, dans notre dernier combat. Son cœur, le <b>pommeau d'aube</b>, je l'ai caché au pied de ma tombe pour que l'ennemi ne le prenne jamais.",
          "… Cette lumière autour de toi. Je la connais. Prends le pommeau, et rends à ma lame son éclat."] } },
      { goal:{ type:'clue', label:"Trouver le pommeau d'aube", clues:[
          { zone:'cimetiere', name:"Le pommeau d'aube", text:"Au pied de la tombe d'Aldric, une pierre dorée brille sous la neige : le pommeau de l'épée, taillé en forme de soleil. Il est tiède dans ta main, comme s'il gardait un peu de lumière." }] },
        end:"Il faudra une forgeronne habile pour réunir la lame et le pommeau. Au camp de Garrick, Brenna rêve justement de forger une arme digne de toi." },
      { goal:{ type:'talk', npc:'brenna', zone:'camp', item:"la lame brisée et le pommeau d'aube", lines:[
          "Une lame de Hautelys ?! Les vieux forgerons en parlent comme d'une légende. Je n'aurais jamais cru en tenir une un jour.",
          "Le métal est étrange : il chauffe tout seul quand tu t'approches… Laisse-moi la nuit, {héros}.",
          "(Toute la nuit, le marteau de Brenna résonne dans le camp.)"] } }],
    outroNpc:'brenna',
    outro:["Voilà. Je l'ai reforgée à ta main. Le pommeau s'est mis à briller dès que tu es entré.",
      "On dirait qu'elle t'a reconnu… Prends-en soin : c'est un morceau d'histoire que tu tiens là."],
    lore:"Le soleil levant sous une couronne était le blason de <b>Hautelys</b>, l'ancien royaume qui unissait Valdoria et dont les rois descendaient, dit-on, de l'Aube. Après sa chute, Sire Aldric, son dernier chevalier, a fui vers le Nord et y est mort en protégeant son épée. Brenna l'a reforgée pour toi, et elle brille à ton contact." },
  { id:'q9', main:true, title:'Le lac gelé', npc:'lune', goal:{ type:'clear', zone:'lac' },
    reward:{ xp:480, gold:230, item:{ slot:'anneau', rarity:2 } },
    intro:["Brrr ! J'ai fait tout le voyage depuis Aubépine. Ce symbole, je le connais : c'est celui des <b>Zombies de givre</b>.",
      "Ils gardent le Lac gelé, où le Nécromancien puise sa magie de glace. Brise leur emprise sur le lac, et sa magie faiblira."],
    outro:["Regarde, le lac dégèle déjà ! Et prise dans la glace, il y avait cette clé de fer…",
      "Elle porte le blason de la <b>Forteresse en ruine</b>. Garrick saura quoi en faire."] },
  { id:'s7', title:'La chasse aux zombies', npc:'lune', startsWith:'q9', goal:{ type:'kill', monster:'zombie', n:6 },
    reward:{ xp:450, gold:160 },
    intro:["Les zombies répandent une maladie qui fait faner mes plantes. Élimines-en six, s'il te plaît !"],
    outro:["Six zombies ! Mes plantes vont pouvoir repousser. Merci, {héros} !"] },
  { id:'q10', main:true, title:'La forteresse en ruine', npc:'garrick', goal:{ type:'clear', zone:'forteresse' },
    reward:{ xp:550, gold:260, item:{ slot:'arme', rarity:2 } },
    intro:["La clé de la forteresse ! Bien joué. Cette forteresse est tenue par les <b>Orcs masqués</b>, l'élite du Nécromancien.",
      "Leur chef garde la seule route qui mène à la tour de leur maître. Entre, et fais le ménage."],
    outro:["La forteresse est tombée ! Les Orcs masqués étaient commandés par un apprenti nécromancien.",
      "Le maître, lui, s'est enfermé dans sa tour. Tiens, cette arme vient de l'armurerie de la forteresse."] },
  { id:'s8', title:'Masques brisés', npc:'garrick', startsWith:'q10', goal:{ type:'kill', monster:'orcmasque', n:3 },
    reward:{ xp:550, gold:200, item:{ rarity:2 } },
    intro:["Les Orcs masqués sont redoutables. Si tu en abats trois, le reste de leur clan prendra peur."],
    outro:["Trois masques brisés ! Le clan s'est dispersé dans les montagnes."] },
  { id:'q11', main:true, title:'La tour du Nécromancien', npc:'lune', goal:{ type:'clear', zone:'tour' },
    reward:{ xp:620, gold:300, item:{ slot:'coiffe', rarity:2 } },
    intro:["J'ai étudié les grimoires de la forteresse. Le Nécromancien prépare un rituel pour ouvrir une <b>faille</b> vers le monde des démons !",
      "Il est protégé par un <b>Zombie géant</b>. Il faut l'arrêter avant qu'il n'achève son rituel. Vite, {héros} !"],
    outro:["Le Nécromancien est vaincu… mais avant de tomber, il a ri : « Trop tard… la Faille est ouverte. »",
      "Là-bas, à l'est, le ciel est devenu rouge. Un <b>Grand Démon</b> est en train de franchir la Faille démoniaque !"] },
  { id:'s9', title:'Diablotins farceurs', npc:'garrick', startsWith:'q12', goal:{ type:'kill', monster:'diablotin', n:3 },
    reward:{ xp:700, gold:250, item:{ rarity:2 } },
    intro:["Des diablotins s'échappent déjà de la Faille et volent nos provisions. Attrapes-en trois !"],
    outro:["Trois diablotins renvoyés chez eux. Nos provisions sont sauves !"] },
  { id:'q12', main:true, title:'La faille démoniaque', npc:'maela', goal:{ type:'clear', zone:'faille' },
    reward:{ xp:1200, gold:600, item:{ rarity:2 } },
    intro:["Je suis venue aussi vite que j'ai pu. Je sens la Faille d'ici… C'est la dernière bataille, {héros}.",
      "Si le Grand Démon passe, la Plaine et le Nord seront perdus. Prépare-toi bien : refais quelques combats, passe voir le marchand du camp.",
      "Tout le monde compte sur toi. Nous croyons en toi."],
    outro:["Tu l'as fait ! Tu as sauvé la Plaine ET le Nord. Ton nom sera chanté dans tous les villages, {héros}.",
      "Repose-toi bien… et continue à t'entraîner, on ne sait jamais ce que l'avenir nous réserve."] },
  // ----- Acte III : le Reflet -----
  { id:'q13', main:true, title:'Le Cristal fissuré', npc:'maela', goal:{ type:'clear', zone:'sanctuaire' },
    reward:{ xp:1300, gold:650, item:{ slot:'amulette', rarity:2 } },
    intro:["{héros} ! Reviens vite à Aubépine ! Le Cristal… il s'est <b>fissuré</b> pendant la nuit.",
      "Une fumée noire s'échappe de la fissure, et des <b>Ombres</b> en sortent. Elles attaquent tout ce qui bouge autour du sanctuaire.",
      "Le Cristal repousse la magie du Nécromancien. S'il se brise, plus rien ne nous protégera. Chasse ces Ombres !"],
    outro:["Les Ombres se sont dissipées… Lune les a bien observées : c'est la magie du Nécromancien, aucun doute possible.",
      "Mais au moment où la dernière Ombre a disparu, une voix glaciale a résonné dans tout le sanctuaire : « <i>Tu n'as vaincu que mon reflet.</i> »",
      "Le Nécromancien est vivant, {héros}. Et Forest n'a pas quitté le Cristal des yeux depuis. Ce chat sent des choses que nous ne voyons pas."] },
  { id:'s10', title:'Chasse aux Ombres', npc:'maela', startsWith:'q13', goal:{ type:'kill', monster:'ombre', n:8 },
    reward:{ xp:700, gold:280 },
    intro:["Des Ombres rôdent encore dans la Plaine et ailleurs. Élimines-en huit, que nos villageois puissent dormir tranquilles."],
    outro:["Huit Ombres de moins. Les enfants osent de nouveau sortir le soir. Merci, {héros}."] },
  { id:'q14', main:true, title:'Le miroir noir', npc:'lune', goal:{ type:'clear', zone:'miroir' },
    reward:{ xp:1500, gold:720, item:{ slot:'bottes', rarity:2 } },
    intro:["Un reflet… J'ai relu les grimoires de la forteresse. Un sorcier peut projeter son image très loin grâce à un <b>miroir noir</b>.",
      "Si celui que tu as vaincu n'était qu'une image, le miroir doit se trouver dans les <b>ruines de la tour</b>, dans les Terres du Nord.",
      "Il sera sûrement gardé. Trouve-le et brise-le, {héros}."],
    outro:["Tu as brisé le miroir ? Et tu as vu… quoi exactement ?",
      "(Dans les éclats du miroir, tu as aperçu un homme enchaîné dans un monde gris et sans soleil. Il tirait sur ses chaînes, et elles cédaient peu à peu.)",
      "Alors le vrai Nécromancien est prisonnier d'un autre monde… et il cherche à se libérer. Il faut savoir comment le vaincre avant qu'il n'y parvienne."] },
  { id:'s11', title:'Éclats de miroir', npc:'lune', startsWith:'q14', goal:{ type:'kill', monster:['gardien','ombre'], label:'Gardiens ou Ombres', n:5 },
    reward:{ xp:800, gold:300, item:{ rarity:2 } },
    intro:["Chaque Ombre porte un petit éclat du miroir. Rapporte-m'en cinq, je veux les étudier."],
    outro:["Cinq éclats ! Ils sont froids comme la glace, même au soleil. Tiens, prends ceci pour ta peine."] },
  { id:'q15', main:true, title:'La vallée oubliée', npc:'maela', goal:{ type:'clear', zone:'entree' },
    reward:{ xp:1700, gold:800, item:{ slot:'cape', rarity:2 } },
    intro:["Le miroir m'a rappelé un vieux conte que me racontait ma grand-mère. La lumière du Cristal ne viendrait pas de notre monde…",
      "On disait que la réponse dormait dans les ruines de la <b>Vallée oubliée</b>, au sud de la Plaine. Le chemin part d'Aubépine.",
      "Fais attention : des voyageurs disent avoir vu des gens en robe sombre y rôder. Ils portent un symbole, un <b>soleil noir</b>."],
    outro:["(À l'entrée des ruines, un vieil homme sort d'une cabane couverte de lierre.)",
      "Bien joué, jeune {héros}. Je m'appelle <b>Orwin</b>. Je garde ce qu'il reste de la grande bibliothèque de la vallée.",
      "Ces gens en robe sont l'<b>Ordre du Soleil noir</b>. Ils fouillent les ruines depuis des semaines. Je me demande bien ce qu'ils cherchent… et je crains de le savoir."] },
  { id:'q16', main:true, title:'Les pages noyées', npc:'orwin', goal:{ type:'clear', zone:'bibliotheque' },
    reward:{ xp:1900, gold:880, item:{ slot:'anneau', rarity:2 } },
    intro:["La bibliothèque a été engloutie par la rivière il y a des siècles. Les livres les plus précieux sont encore là, sous l'eau.",
      "Hélas, des <b>hommes-lézards</b> et des <b>limaces géantes</b> s'y sont installés. Chasse-les, que je puisse fouiller les rayonnages."],
    outro:["Merci, {héros}. J'ai retrouvé le livre de la légende… mais regarde : <b>les pages les plus importantes ont été arrachées</b>.",
      "Les coupures sont nettes et récentes. C'est l'Ordre du Soleil noir, j'en mettrais ma barbe à couper."] },
  { id:'s12', title:'Les écailles des ruines', npc:'orwin', startsWith:'q16', goal:{ type:'kill', monster:'lezard', n:6 },
    reward:{ xp:900, gold:330 },
    intro:["Les hommes-lézards abîment les dernières ruines debout. Chasses-en six, veux-tu ?"],
    outro:["Six hommes-lézards ! Les vieilles pierres te remercient."] },
  { id:'q17', main:true, title:"L'Ordre du Soleil noir", npc:'garrick', goal:{ type:'clear', zone:'temple' },
    reward:{ xp:2100, gold:950, item:{ slot:'arme', rarity:2 } },
    intro:["Salut, {héros} ! Maela m'a envoyé un message, alors j'ai suivi des membres de l'Ordre. Ils ont un <b>temple caché</b> dans la vallée.",
      "D'après ce que j'ai entendu, ils servent un maître qu'ils appellent « <b>le Fils</b> ». Ils veulent le libérer de sa prison.",
      "Leur chef, la <b>Grande Prêtresse</b>, garde les pages volées. Va les reprendre, je couvre tes arrières."],
    outro:["Tu as les pages ! La Prêtresse s'est enfuie, mais avant de disparaître, elle a crié : « <i>Mon maître te trouvera !</i> »",
      "Son maître… le Nécromancien, tu crois ? Ou quelqu'un d'autre qui tire les ficelles ? Je n'aime pas ça.",
      "Orwin dit que ces pages parlent d'« <b>objets de lumière</b> », mais la fin de la légende est gravée au <b>Cœur des ruines</b>."] },
  { id:'s13', title:'Soleils éteints', npc:'garrick', startsWith:'q17', goal:{ type:'kill', monster:['fidele','pretre','pretresse'], label:"membres de l'Ordre", n:8 },
    reward:{ xp:1000, gold:380, item:{ rarity:2 } },
    intro:["Chaque membre de l'Ordre qu'on arrête, c'est un espion de moins dans nos villages. Neutralises-en huit."],
    outro:["Huit soleils noirs éteints ! L'Ordre va y réfléchir à deux fois avant de revenir."] },
  { id:'q18', main:true, title:'La légende de lumière', npc:'maela', goal:{ type:'clear', zone:'coeur' },
    reward:{ xp:2500, gold:1200, item:{ rarity:2 } },
    intro:["J'ai fait le voyage jusqu'à la vallée, {héros}. Orwin m'a tout raconté.",
      "L'Ordre invoque une créature d'ombre gigantesque, l'<b>Éclipse</b>, pour détruire la fin de la légende avant que tu ne la lises.",
      "Rejoins le Cœur des ruines et arrête-les. Nous devons savoir comment vaincre le Nécromancien."],
    outro:["Ces objets de lumière sont nés de la même magie que le Cristal… Mais combien sont-ils ? Où sont-ils ? Qui les a créés ? La légende ne le dit pas."] },
  { id:'s14', title:'Bien préparé', npc:'orwin', startsWith:'q18', goal:{ type:'equip', n:7, pet:true },
    reward:{ xp:600, gold:300 },
    intro:["Avant d'affronter l'Éclipse, sois prêt : équipe tes sept emplacements. Forest compte, bien sûr, il est le plus fidèle de tes équipements !"],
    outro:["Te voilà paré de la tête aux pieds, et Forest ronronne. Vous êtes prêts."] },
  // ----- Acte IV : la mémoire du Cristal -----
  { id:'q19', main:true, title:'La mémoire du Cristal', npc:'lune', goal:{ type:'clear', zone:'chemin' },
    reward:{ xp:2700, gold:1300, item:{ slot:'coiffe', rarity:2 } },
    intro:["{héros}, viens voir ! Quand je pose la main sur le Cristal fissuré, je vois des images… comme des <b>souvenirs</b>.",
      "Pour le réparer, il faudrait des <b>éclats d'aube</b>. Les vieux livres disent qu'on en trouvait jadis dans les <b>Hauts de l'Aube</b>, les montagnes à l'est.",
      "Mais des éclaireurs de l'Ordre du Soleil noir surveillent déjà le sentier des pèlerins. Ouvre-nous le passage."],
    outro:["Le sentier est libre ! Et regarde : j'ai trouvé un premier éclat d'aube, coincé entre deux pierres.",
      "Dès que tu l'as touché, Forest s'est figé, les yeux grands ouverts. Et toi aussi, tu as vu quelque chose, n'est-ce pas ?"],
    vision:{ title:'Vision : la lumière tombée du ciel', pages:[
      "(Une nuit très ancienne. Le ciel de Valdoria s'ouvre, et une lumière dorée descend lentement vers le monde.)",
      "(Là où elle touche le sol, l'herbe se met à briller. Puis la vision s'efface.)"] } },
  { id:'s15', title:"Éclats d'aube", npc:'lune', startsWith:'q19', goal:{ type:'kill', monster:'eclaireur', n:8 },
    reward:{ xp:1200, gold:450 },
    intro:["Les éclaireurs de l'Ordre ramassent tous les éclats qu'ils trouvent. Arrêtes-en huit avant qu'ils ne les emportent tous."],
    outro:["Huit éclaireurs de moins, et quelques éclats sauvés. Le Cristal brille un tout petit peu plus fort."] },
  { id:'q20', main:true, title:'Le temple oublié', npc:'garrick', goal:{ type:'clear', zone:'templeoublie' },
    reward:{ xp:2900, gold:1380, item:{ slot:'bottes', rarity:2 } },
    intro:["Au bout du sentier, il y a un temple que personne n'a visité depuis des siècles. Enfin, personne… sauf des <b>Ombres</b>.",
      "Les murs sont couverts d'inscriptions. Si quelqu'un a laissé l'histoire du Cristal quelque part, c'est là. Nettoie le temple, je te suis."],
    outro:["Les Ombres sont parties. Regarde ces murs, {héros} : ils racontent l'histoire d'un <b>dieu</b>.",
      "Son nom est gravé partout, en lettres d'or : <b>Auréon</b>, le dieu de l'Aube."],
    vision:{ title:'Vision : le dieu parmi les hommes', pages:[
      "(Un homme lumineux marche parmi les habitants de Valdoria. Les gens s'écartent, émerveillés.)",
      "(Il s'arrête devant une femme. Tu ne vois jamais son visage, seulement sa main qui se tend vers lui.)"] } },
  { id:'s16', title:'Le temple purifié', npc:'garrick', startsWith:'q20', goal:{ type:'kill', monster:'ombre', n:10 },
    reward:{ xp:1300, gold:480, item:{ rarity:2 } },
    intro:["Des Ombres reviennent sans cesse rôder autour du temple. Chasses-en dix, qu'on puisse travailler en paix."],
    outro:["Dix Ombres ! Le temple respire de nouveau. Prends ça, je l'ai trouvé dans une niche du mur."] },
  { id:'q21', main:true, title:"L'épreuve de la Gardienne", npc:'ilys', goal:{ type:'clear', zone:'epreuves' },
    reward:{ xp:3100, gold:1450, item:{ slot:'amulette', rarity:2 } },
    intro:["(Une silhouette pâle et translucide apparaît entre les colonnes.)",
      "Je suis <b>Ilys</b>, la Gardienne de ce temple. Depuis des siècles, personne n'est venu ici avec des intentions pures.",
      "Si tu veux connaître l'histoire d'Auréon, prouve ta valeur. Affronte les <b>Gardiens de pierre</b> dans la Salle des épreuves."],
    outro:["Tu as réussi l'épreuve. Alors écoute.",
      "Auréon est descendu dans notre monde parce qu'il était tombé amoureux d'une femme de Valdoria. C'est <b>par amour pour elle</b> qu'il a créé le Cristal et l'a offert au peuple de la Plaine, pour le protéger.",
      "(Ilys te regarde longuement, en silence, comme si elle te reconnaissait. Puis elle détourne les yeux sans rien expliquer.)"] },
  { id:'s17', title:'Pierre contre pierre', npc:'ilys', startsWith:'q21', goal:{ type:'kill', monster:'pierre', n:6 },
    reward:{ xp:1350, gold:500 },
    intro:["Certains Gardiens de pierre se sont réveillés de travers et attaquent tout le monde. Rends-leur le sommeil : six suffiront."],
    outro:["Six Gardiens apaisés. Le temple te remercie, et moi aussi."] },
  // Longue quête (Acte IV) : enquête, escorte d'Orwin jusqu'au Temple oublié, puis Ilys
  { id:'l2', title:'La loi des dieux', npc:'orwin', startsWith:'q21',
    reward:{ xp:3300, gold:1200, item:{ slot:'amulette', rarity:2, name:'Médaillon des gardiens' } },
    intro:["Ah, {héros} ! J'ai fait la route depuis mon ermitage. Ce nom gravé dans le temple, <b>Auréon</b>, ne me laisse plus dormir.",
      "La bibliothèque engloutie était celle des anciens rois. Ils y gardaient leurs chroniques les plus précieuses sous des <b>sceaux de lumière</b>.",
      "Les hommes-lézards ont dispersé les dernières pages scellées dans les ruines de la Vallée oubliée. Retrouve-les, et rapporte-les-moi à l'ermitage."],
    steps:[
      { goal:{ type:'clue', label:'Retrouver les pages scellées', clues:[
          { zone:'bibliotheque', name:'Une page scellée', text:"Coincée sous une étagère effondrée, une page brille faiblement. Quand tu la touches, le sceau de lumière s'ouvre tout seul. On y lit : « Au commencement, <b>Valdor</b> façonna Valdoria, puis confia chaque part du monde à l'un de ses enfants divins… »" },
          { zone:'entree', name:'Une page sous les décombres', text:"Une page scellée dépasse d'un tas de pierres. Le sceau s'ouvre dès que tes doigts l'effleurent : « … et Valdor fit une loi : <b>nul dieu ne vivra parmi les mortels</b>, car le ciel et la terre ne doivent pas se mêler. »" },
          { zone:'coeur', name:'Une page roussie', text:"Une page à moitié brûlée, que l'Ordre n'a pas fini de détruire : « … mais l'Aube aima une mortelle, et descendit… ». La suite est réduite en cendres." }] },
        end:"Trois pages, et une phrase qui manque. Orwin saura sûrement les lire en entier : retourne à son ermitage." },
      { goal:{ type:'talk', npc:'orwin', zone:'ermitage', item:'les pages scellées', lines:[
          "Par tous les livres ! Ces sceaux ne s'ouvrent que devant la lumière de l'Aube… Et ils se sont ouverts pour toi ?",
          "(Orwin te regarde longuement, puis secoue la tête, comme pour chasser une idée.)",
          "Ces pages parlent de <b>Valdor</b>, le dieu suprême, celui qui a créé notre monde. Et d'une loi : aucun dieu ne doit vivre parmi les mortels.",
          "La dernière page manque. D'après le catalogue des rois, une copie était gardée au <b>Temple oublié</b>. Je viens avec toi : je veux la lire de mes propres yeux. Protège un vieil homme, veux-tu ?"] } },
      { goal:{ type:'escort', npc:'orwin', zone:'templeoublie', foes:['eclaireur','pretre','eclaireur'], lines:[
          "(Au moment où vous entrez dans le temple, des silhouettes en noir surgissent d'entre les colonnes.)",
          "L'Ordre ! Ils nous suivaient depuis la Vallée… {héros}, ne les laisse pas prendre les pages !"] },
        say:{ npc:'orwin', pages:["Ouf… Je suis bien trop vieux pour ces aventures. Mais regarde : la copie est là, sur l'autel.",
          "« … l'Aube aima une mortelle, et descendit vivre auprès d'elle. Pour cela, Valdor le condamna : à la mort de sa bien-aimée, il dut remonter au ciel, pour toujours. »",
          "Ilys, la Gardienne, doit savoir ce que cela veut dire. Porte-lui ma copie, à la Halte des pèlerins."] } },
      { goal:{ type:'talk', npc:'ilys', zone:'pelerins', item:"la copie d'Orwin", lines:[
          "(Ilys lit la page en silence. Sa lumière tremble.)",
          "Oui. C'est ainsi que cela s'est passé. Auréon a enfreint la loi de Valdor par amour pour <b>Séléna</b>, et il a payé : quand elle est morte, il a dû quitter Valdoria.",
          "Valdor est un dieu froid, {héros}. Il ne regarde ni les mortels ni ses propres enfants. Certains ne le lui ont jamais pardonné.",
          "(Elle te fixe un instant, comme si elle voyait quelqu'un d'autre à travers toi, puis détourne les yeux.)"] } }],
    outroNpc:'ilys',
    outro:["Garde ceci. Il appartenait aux gardiens du temple, qui veillaient autrefois sur la lumière de l'Aube.",
      "Puisse-t-il te protéger mieux qu'il ne les a protégés."],
    lore:"<b>Valdor</b>, le dieu suprême, a créé Valdoria et fait une loi : aucun dieu ne doit vivre parmi les mortels. Auréon l'a enfreinte par amour pour Séléna ; à sa mort, il a dû remonter au ciel pour toujours. Les sceaux de lumière des anciens rois se sont ouverts devant toi, et Orwin n'a pas su dire pourquoi." },
  { id:'q22', main:true, title:'La forge de lumière', npc:'ilys', goal:{ type:'clear', zone:'forge' },
    reward:{ xp:3300, gold:1520, item:{ slot:'anneau', rarity:2 } },
    intro:["Au cœur du temple se trouve la <b>forge de lumière</b>. C'est là qu'Auréon a façonné ses plus grandes œuvres.",
      "Mais l'Ordre du Soleil noir l'a trouvée avant nous et la pille. Chasse-les avant qu'ils ne détruisent ce qu'il en reste."],
    outro:["La forge est sauvée. Pose ta main sur l'enclume, {héros}. Elle se souvient, elle aussi."],
    vision:{ title:'Vision : la forge de lumière', pages:[
      "(Auréon, seul devant la forge. Le métal brille comme le soleil levant.)",
      "(Il façonne un objet de lumière, puis un deuxième… et un sixième. Ilys murmure leur nom : les <b>Reliques de l'Aube</b>.)",
      "(Puis Auréon les disperse aux quatre coins du monde. Les lieux sont flous, impossibles à reconnaître.)",
      "Six reliques… Ce sont elles, les objets de lumière de la légende. Les seules armes capables de vaincre le Nécromancien. Mais où sont-elles ?"] } },
  { id:'q23', main:true, title:"L'assaut du Soleil noir", npc:'garrick', goal:{ type:'clear', zone:'remparts' },
    reward:{ xp:3500, gold:1600, item:{ slot:'cape', rarity:2 } },
    intro:["Alerte ! L'Ordre revient en force pour piller ce qui reste de la forge. Ils attaquent les <b>remparts du temple</b> !",
      "On ne les laissera pas faire. Je tiens la porte, toi, tu les repousses."],
    outro:["On les a repoussés ! Mais tu as vu cette silhouette masquée, tout en haut de la falaise ? Elle a regardé tout le combat sans bouger, puis elle a disparu.",
      "Ce n'était pas la Grande Prêtresse… Quelqu'un d'autre commande l'Ordre, j'en suis sûr.",
      "Et j'ai entendu les fuyards : ils veulent attaquer <b>Aubépine</b> pendant que Maela et Lune réparent le Cristal. Il faut rentrer, vite !"] },
  { id:'s18', title:'Soleils éteints, la suite', npc:'garrick', startsWith:'q23', goal:{ type:'kill', monster:['fidele','pretre','eclaireur','pretresse','bourreau'], label:"membres de l'Ordre", n:10 },
    reward:{ xp:1500, gold:560, item:{ rarity:2 } },
    intro:["L'Ordre est partout maintenant. Neutralises-en dix de plus, ça leur fera réfléchir."],
    outro:["Dix de plus ! Je commence à croire qu'on peut les vaincre."] },
  { id:'q24', main:true, title:'Le Cristal restauré', npc:'maela', goal:{ type:'clear', zone:'sanctuaire' },
    reward:{ xp:4200, gold:2200, item:{ rarity:2 } },
    intro:["{héros}, te voilà ! Lune et moi allons réparer le Cristal avec les éclats d'aube. Mais il nous faut du temps.",
      "L'Ordre a envoyé son champion, le <b>Bourreau du Soleil noir</b>. Il marche déjà sur Aubépine.",
      "Protège le sanctuaire jusqu'à ce que le Cristal soit restauré. Tout Aubépine compte sur toi."],
    outro:["Le Cristal est restauré ! Grâce à toi, {héros}. Et à Forest, qui n'a pas quitté le sanctuaire une seule seconde."] },
  // ----- Acte V : le Cœur de Sylve -----
  { id:'q25', main:true, title:"L'orée enchantée", npc:'lune', goal:{ type:'clear', zone:'oree' },
    reward:{ xp:3800, gold:1800, item:{ slot:'arme', rarity:2 } },
    intro:["Une forêt ancienne, au sud-est… Les vieux bergers parlent d'un <b>sentier de la Sylve</b>, près du marais. Personne n'en revient jamais.",
      "On dit que des illusions égarent les voyageurs et que des <b>feux follets noirs</b> rôdent à l'orée. Sois prudent, {héros}."],
    outro:["Tu as traversé l'orée ! Comment as-tu trouvé ton chemin dans ces illusions ?",
      "(C'est Forest qui t'a guidé. Il marchait devant toi sans hésiter, comme s'il connaissait chaque sentier.)",
      "(Soudain, des silhouettes vertes sortent des arbres et vous encerclent : des <b>dryades</b>.)"] },
  { id:'s19', title:'Feux follets', npc:'lune', startsWith:'q25', goal:{ type:'kill', monster:'feufollet', n:8 },
    reward:{ xp:1700, gold:620 },
    intro:["Ces feux follets noirs ne sont pas naturels. Éteins-en huit, que j'étudie ce qu'il en reste."],
    outro:["Huit feux follets ! Il reste un peu de cendre violette… la magie de l'Ordre, encore."] },
  { id:'q26', main:true, title:'Le peuple de la sylve', npc:'neria', goal:{ type:'clear', zone:'bosquet' },
    reward:{ xp:4000, gold:1880, item:{ slot:'coiffe', rarity:2 } },
    intro:["Je suis <b>Néria</b>, reine des dryades. Les humains n'ont rien à faire dans notre forêt. Repartez…",
      "(Néria s'arrête net en voyant Forest. Son regard s'adoucit.)",
      "Ce chat… c'est <b>l'enfant de la sylve</b>. Il est né ici, il y a bien longtemps, puis il est parti sans prévenir personne. S'il te suit, c'est que tu en es digne.",
      "Alors aide-nous. L'Ordre du Soleil noir a planté des <b>totems</b> dans notre bosquet sacré. Abats-les."],
    outro:["Les totems sont tombés. Mais regarde : ils aspiraient la vie de la forêt vers un point précis…",
      "Vers le <b>sanctuaire des racines</b>, là où dort quelque chose de très ancien et de très précieux. L'Ordre sait qu'il est là."] },
  { id:'s20', title:'Totems brisés', npc:'neria', startsWith:'q26', goal:{ type:'kill', monster:['fidele','pretre','eclaireur','pretresse','bourreau'], label:"membres de l'Ordre", n:8 },
    reward:{ xp:1800, gold:660, item:{ rarity:2 } },
    intro:["Chaque membre de l'Ordre peut planter un nouveau totem. Chasses-en huit hors de la forêt."],
    outro:["Huit de moins. Les arbres chantent de nouveau. Tiens, un présent des dryades."] },
  { id:'q27', main:true, title:'La sève noire', npc:'neria', goal:{ type:'clear', zone:'boiscorrompus' },
    reward:{ xp:4200, gold:1960, item:{ slot:'bottes', rarity:2 } },
    intro:["Une partie de la forêt est déjà perdue. Les Ombres de l'Ordre font couler une <b>sève noire</b> dans les arbres, et les <b>tréants</b> deviennent fous.",
      "Libère les bois corrompus, je t'en supplie."],
    outro:["Les bois respirent mieux. Seul le <b>Cerf d'argent</b>, l'esprit le plus ancien de la forêt, connaît le chemin du sanctuaire.",
      "Et l'Ordre le traque en ce moment même."] },
  { id:'s21', title:'Écorce malade', npc:'neria', startsWith:'q27', goal:{ type:'kill', monster:['treant','grandtreant'], label:'tréants corrompus', n:6 },
    reward:{ xp:1900, gold:700 },
    intro:["Les tréants corrompus ne peuvent plus être sauvés. Libère-en six, leur esprit retournera à la forêt."],
    outro:["Six tréants apaisés. Leurs graines repousseront au printemps."] },
  { id:'q28', main:true, title:"Le Cerf d'argent", npc:'garrick', goal:{ type:'clear', zone:'licornes' },
    reward:{ xp:4400, gold:2050, item:{ slot:'amulette', rarity:2 } },
    intro:["{héros} ! J'ai suivi des chasseurs de l'Ordre jusqu'à la <b>clairière des licornes</b>. Ils ont repéré le Cerf d'argent !",
      "Si on arrive trop tard, on ne trouvera jamais le sanctuaire. Fonce !"],
    outro:["(Un grand cerf aux bois argentés s'avance lentement vers toi. Les licornes se tiennent derrière lui.)",
      "Le Cerf d'argent incline la tête devant Forest… puis devant toi. On dirait qu'il nous remercie."] },
  { id:'s22', title:'Les fées perdues', npc:'fee', startsWith:'q28', goal:{ type:'kill', monster:'bete', n:3 },
    reward:{ xp:2000, gold:740, item:{ rarity:2 } },
    intro:["Psst ! Ici, en bas ! Des <b>bêtes corrompues</b> nous empêchent de rentrer chez nous. Chasses-en trois, s'il te plaît, s'il te plaît !"],
    outro:["Merci, merci ! Toutes les fées sont rentrées. Voilà un petit cadeau, il brille presque autant que nous !"] },
  { id:'q29', main:true, title:'Les racines du monde', npc:'cerf', goal:{ type:'clear', zone:'racines' },
    reward:{ xp:4600, gold:2150, item:{ slot:'anneau', rarity:2 } },
    intro:["(Le Cerf d'argent ne parle pas, mais sa voix résonne dans ta tête, douce et très ancienne.)",
      "« Le chemin passe par les <b>racines</b> du plus vieil arbre du monde. L'Ordre s'y est déjà glissé. »",
      "« Traverse les racines. Ce qui dort au fond attend quelqu'un comme toi depuis très longtemps. »"],
    outro:["(Au fond des racines, une lumière verte et dorée palpite comme un cœur.)",
      "« Le gardien de la forêt veille sur elle depuis mille ans. Mais l'Ordre l'a <b>corrompu</b>. Il ne te reconnaîtra pas. »"] },
  // Longue quête (Acte V) : la lettre au sceau noir, le sanctuaire de la Nuit, le miroir d'obsidienne
  { id:'l3', title:'La mère de la Nuit', npc:'fee', startsWith:'q29',
    reward:{ xp:5000, gold:1800, item:{ slot:'cape', rarity:2, name:'Cape de la nuit sans lune' } },
    intro:["Pas de « hi hi » aujourd'hui, {héros}. J'ai eu très peur.",
      "Cette nuit, au <b>Bosquet sacré</b>, des hommes en noir priaient la lune noire. L'un d'eux a laissé tomber une lettre quand Forest lui a sauté dessus !",
      "Je n'ai pas osé y toucher. Tu veux bien aller la chercher ?"],
    steps:[
      { goal:{ type:'clue', label:'Retrouver la lettre au sceau noir', clues:[
          { zone:'bosquet', name:'Une lettre au sceau noir', text:"Dans l'herbe, une lettre fermée par un sceau de cire noire : un soleil éteint, entouré d'un croissant de lune. L'écriture est très ancienne, presque illisible." }] },
        end:"Orwin, à son ermitage de la Vallée oubliée, saura lire cette écriture." },
      { goal:{ type:'talk', npc:'orwin', zone:'ermitage', item:'la lettre au sceau noir', lines:[
          "Montre… Ce n'est pas une lettre, c'est une prière. Elle s'adresse à <b>Obsidia, la déesse de la Nuit</b>.",
          "Obsidia ne fait pas partie des six grands dieux. Les anciens la craignaient : on disait qu'elle avait eu un fils, et que le père de l'enfant les avait abandonnés tous les deux.",
          "La prière parle d'un <b>sanctuaire de la Nuit</b>, caché dans la forêt, où l'Ordre se réunit à chaque nouvelle lune. Trouve-le, {héros}."] } },
      { goal:{ type:'clue', label:'Trouver le sanctuaire de la Nuit', clues:[
          { zone:'boiscorrompus', name:'Un autel de pierre noire', text:"Entre les arbres malades, un autel de pierre noire couvert de cire fondue. Des traces de pas s'enfoncent vers le Sanctuaire des racines." },
          { zone:'racines', name:'Des statues voilées', text:"Trois statues de femme, le visage caché sous un voile de pierre. À leurs pieds, on a gravé : « Mère de la Nuit, rends-nous le Fils. »" }] },
        end:"Les prêtres de l'Ordre gardent le sanctuaire. Chasse-les avant leur prochaine prière." },
      { goal:{ type:'kill', monster:'pretre', n:3, label:'prêtres du sanctuaire de la Nuit' },
        say:{ npc:'fee', pages:["(Une petite lumière te rejoint en voletant : la fée t'a suivi depuis le village.)",
          "Ils sont partis ! Mais regarde, derrière les statues des racines… quelque chose brille comme de l'eau noire."] } },
      { goal:{ type:'clue', label:"Trouver ce qui brille derrière les statues", clues:[
          { zone:'racines', name:"Le miroir d'obsidienne", text:"Derrière les statues, un miroir de pierre noire, poli comme de l'eau. Quand tu te penches, ton reflet ne bouge pas tout à fait comme toi… et une voix lointaine murmure : « Je te vois. » Tu le recouvres vite de ta cape." }] },
        end:"Néria, la reine des dryades, saura quoi faire de ce miroir. Elle t'attend au Village des fées." },
      { goal:{ type:'talk', npc:'neria', zone:'fees', item:"le miroir d'obsidienne", lines:[
          "Pose-le là, vite. Et ne le regarde plus.",
          "Les miroirs noirs sont les yeux de celui que l'Ordre appelle <b>le Fils</b>. C'est à travers eux qu'il parle à ses fidèles, depuis sa prison.",
          "Les dryades se souviennent : il y a très longtemps, Obsidia pleurait dans cette forêt. Un dieu l'avait aimée, puis oubliée, elle et leur enfant.",
          "Cet enfant a grandi dans l'ombre et la colère. C'est lui que l'Ordre veut libérer. (D'un coup de bâton, Néria brise le miroir.)"] } }],
    outroNpc:'neria',
    outro:["La forêt te remercie, {héros}. Prends cette cape, tissée par mes dryades sous la nouvelle lune.",
      "Tant que tu la porteras, les yeux de la Nuit auront du mal à te trouver."],
    lore:"<b>Obsidia</b>, la déesse de la Nuit, ne fait pas partie des six grands dieux. Un dieu l'a aimée puis abandonnée, elle et leur enfant. Cet enfant, devenu « le Fils » que vénère l'Ordre du Soleil noir, parle à ses fidèles à travers des miroirs noirs depuis sa prison." },
  { id:'q30', main:true, title:'Le Cœur de Sylve', npc:'neria', goal:{ type:'clear', zone:'coeursylve' },
    reward:{ xp:5200, gold:2600, item:{ rarity:3 } },
    intro:["Le <b>Grand Tréant</b>, notre gardien millénaire… L'Ordre l'a retourné contre nous.",
      "Il faut l'affronter pour le libérer de la sève noire. C'est le seul moyen d'atteindre la relique.",
      "Va, {héros}. Et toi aussi, enfant de la sylve. La forêt entière compte sur vous."],
    outro:["(Au loin, la voix du Nécromancien gronde de colère.)",
      "Merci, {héros}. La forêt ne t'oubliera jamais."] },

  // ----- Acte VI : la Braise d'Aube -----
  { id:'q31', main:true, title:'Le chemin des cendres', npc:'garrick', goal:{ type:'clear', zone:'plainescendres' },
    reward:{ xp:5600, gold:2700, item:{ slot:'cape', rarity:2 } },
    intro:["{héros}, Néria m'a raconté pour le Cœur de Sylve. Il paraît qu'il t'a montré quelque chose ?",
      "(Dans la lumière de la relique, tu as vu une <b>montagne qui crache du feu</b>, loin au nord de la Plaine.)",
      "Un volcan… Ça ne peut être que le <b>Mont Brasier</b>. Le chemin traverse des plaines couvertes de cendres. Allons-y ensemble."],
    outro:["Ces salamandres ne nous ont pas facilité la tâche ! Mais regarde, au pied du volcan…",
      "Une <b>cité naine</b>, taillée dans la roche. Et elle est assiégée !"] },
  { id:'s23', title:'Queues de salamandre', npc:'garrick', startsWith:'q31', goal:{ type:'kill', monster:'salamandre', n:8 },
    reward:{ xp:2200, gold:800 },
    intro:["Les salamandres attaquent tous les voyageurs. Chasses-en huit, le chemin sera plus sûr pour les caravanes."],
    outro:["Huit salamandres ! Les caravanes de Forgefeu vont pouvoir repartir."] },
  { id:'q32', main:true, title:"Le peuple de l'enclume", npc:'durgan', goal:{ type:'clear', zone:'portes' },
    reward:{ xp:5900, gold:2800, item:{ slot:'bottes', rarity:2 } },
    intro:["Par ma barbe, des renforts ! Je suis <b>Durgan</b>, maître de la forge de <b>Forgefeu</b>.",
      "Des <b>élémentaires de feu</b> sortent du volcan et martèlent nos portes. Aide-nous à les repousser, et tu seras l'ami des nains pour toujours."],
    outro:["Les portes tiennent ! Merci, {héros}. Et merci à ton chat, qui a sifflé sur un élémentaire comme s'il n'avait peur de rien.",
      "Depuis que le volcan gronde, notre <b>braise sacrée</b> faiblit. C'est elle qui alimente toutes nos forges depuis des siècles. Si elle s'éteint, Forgefeu mourra."] },
  { id:'s24', title:'Les murs de Forgefeu', npc:'durgan', startsWith:'q32', goal:{ type:'kill', monster:'elemfeu', n:8 },
    reward:{ xp:2300, gold:850, item:{ rarity:2 } },
    intro:["Les élémentaires reviennent chaque nuit. Éteins-en huit, que mes forgerons puissent réparer les murs."],
    outro:["Huit élémentaires éteints ! Tiens, une pièce forgée dans nos ateliers. Elle ne te décevra pas."] },
  { id:'q33', main:true, title:'Le cœur qui gronde', npc:'durgan', goal:{ type:'clear', zone:'tunnels' },
    reward:{ xp:6200, gold:2900, item:{ slot:'coiffe', rarity:2 } },
    intro:["Le volcan ne s'est pas réveillé tout seul. Mes mineurs ont vu des gens en robe sombre dans les <b>tunnels de lave</b>.",
      "Va voir ce qu'ils trafiquent. Et méfie-toi : il fait chaud là-dessous, même pour un nain."],
    outro:["Des <b>totems du soleil noir</b>, plantés au cœur de la montagne ! Ce sont eux qui réveillent le volcan.",
      "Et ils aspirent toute la chaleur vers la forge la plus profonde… là où repose notre braise sacrée. Qu'est-ce que ces fous lui veulent ?"] },
  { id:'s25', title:'Démons des profondeurs', npc:'durgan', startsWith:'q33', goal:{ type:'kill', monster:'chort', n:3 },
    reward:{ xp:2400, gold:880 },
    intro:["Des chorts sont remontés des profondeurs avec la chaleur. Renvoies-en trois d'où ils viennent."],
    outro:["Trois chorts de moins ! Mes mineurs osent de nouveau descendre."] },
  { id:'q34', main:true, title:'La marque du soleil noir', npc:'durgan', goal:{ type:'clear', zone:'grandeforge' },
    reward:{ xp:6500, gold:3000, item:{ slot:'amulette', rarity:2 } },
    intro:["Rendez-vous à la <b>grande forge</b>, au centre de la cité. Je veux te présenter <b>Brenna</b>, ma meilleure apprentie. Elle connaît la montagne mieux que personne."],
    outro:["Une embuscade, en plein cœur de Forgefeu ! Quelqu'un leur a dit par où tu passerais…",
      "(Dans la mêlée, la manche de Brenna s'est déchirée. Sur son bras, un tatouage : <b>un soleil noir</b>.)",
      "Brenna… pas toi ! (La jeune forgeronne recule vers le cratère.) « Le <b>Maître</b> nous promet un monde sans dieux, Durgan ! Un monde où personne n'est abandonné ! »",
      "(Elle s'enfuit vers le cratère. Durgan reste longtemps silencieux.)"] },
  { id:'q35', main:true, title:'La forge des anciens', npc:'durgan', goal:{ type:'clear', zone:'forgeoubliee' },
    reward:{ xp:6800, gold:3150, item:{ slot:'anneau', rarity:2 } },
    intro:["Sous la cité, il existe une forge bien plus ancienne que Forgefeu. Mes ancêtres l'ont trouvée, mais personne n'y descend plus.",
      "Des <b>golems de lave</b> la gardent. Si quelqu'un peut y entrer, c'est toi."],
    outro:["Regarde ces inscriptions, {héros}. Ce symbole… c'est le même que dans le temple d'Auréon !",
      "(Forest se frotte contre une gravure en ronronnant.) Alors notre braise sacrée… est une <b>Relique de l'Aube</b>. Depuis des siècles, on se chauffait avec un trésor des dieux sans le savoir.",
      "Et Brenna le sait aussi. Le grondement du cratère… ils ont réveillé <b>Ignarok</b>, le dragon de lave, pour la garder."] },
  { id:'s26', title:'Cœurs de lave', npc:'durgan', startsWith:'q35', goal:{ type:'kill', monster:'golem', n:5 },
    reward:{ xp:2500, gold:920, item:{ rarity:2 } },
    intro:["Le cœur d'un golem de lave est le meilleur combustible qui soit. Rapporte-m'en cinq, je te forgerai quelque chose de solide."],
    outro:["Cinq cœurs encore chauds ! Voilà, comme promis. Une merveille, si je puis dire."] },
  // Longue quête (Acte VI) : le carnet de Brenna, après sa trahison
  { id:'l4', title:'Le carnet de Brenna', npc:'durgan', startsWith:'q35',
    reward:{ xp:6000, gold:2200, item:{ slot:'anneau', rarity:2, name:"Anneau de l'apprentie" } },
    intro:["Après sa fuite, j'ai fouillé l'atelier de Brenna. Elle a laissé son carnet de forge… mais des pages entières ont été arrachées.",
      "Je n'arrive pas à y croire, {héros}. C'était la plus douée de mes apprentis. Je veux comprendre pourquoi elle nous a trahis.",
      "Elle passait ses nuits à la Grande forge, dans les Tunnels de lave et à la Forge oubliée. Cherche ce qu'elle a pu y laisser."],
    steps:[
      { goal:{ type:'clue', label:'Retrouver les pages arrachées du carnet', clues:[
          { zone:'grandeforge', name:"Une page sous l'enclume", text:"« Le Maître dit que les dieux nous ont abandonnés. Que Valdor ne regarde jamais en bas. Il promet un monde où plus personne n'aura besoin de prier. »" },
          { zone:'tunnels', name:"Une page près d'un totem", text:"« J'ai planté le totem cette nuit. Les nains n'ont rien vu. Alors pourquoi mes mains tremblent-elles encore ? »" },
          { zone:'forgeoubliee', name:'Une page roussie', text:"« Le héros d'Aubépine… Je l'ai vu au camp de Garrick, il y a longtemps. Il souriait à tout le monde. Le Maître dit que c'est lui, l'ennemi. Je ne sais plus. »" }] },
        end:"Garrick connaît Brenna depuis bien plus longtemps que les nains. Il attend à la Halte des caravanes." },
      { goal:{ type:'talk', npc:'garrick', zone:'haltecendres', lines:[
          "Brenna ? Je l'ai trouvée à moitié gelée dans le Nord, il y a des années. Toute sa famille avait péri pendant un hiver terrible. Elle avait prié chaque nuit, et personne n'avait répondu.",
          "Depuis, elle répète que les dieux se moquent de nous. Je crois que l'Ordre a su trouver les mots qu'elle voulait entendre.",
          "Mais si elle doute, comme le disent ces pages, il reste peut-être une chance. Avant de fuir, elle a lâché des élémentaires sur les Portes de Forgefeu pour couvrir sa fuite. Arrête-les, {héros}."] } },
      { goal:{ type:'kill', monster:'elemfeu', n:4, label:'élémentaires de feu lâchés par Brenna' },
        say:{ npc:'durgan', pages:["(Un messager nain te rejoint en courant, un mot de Durgan à la main.)",
          "« Les Portes tiennent, grâce à toi. Viens me voir à la Halte des caravanes, avec les pages du carnet. »"] } },
      { goal:{ type:'talk', npc:'durgan', zone:'haltecendres', item:'les pages du carnet', lines:[
          "(Durgan lit les pages une à une, en silence. Sa grosse main tremble un peu.)",
          "Donc elle doutait… Par ma barbe, ça ne la rend pas innocente. Mais ça me donne un peu d'espoir.",
          "Si un jour tu la recroises, {héros}, dis-lui que l'enclume de Forgefeu l'attend toujours. Les nains ne ferment jamais la porte à ceux qui reviennent."] } }],
    outroNpc:'durgan',
    outro:["Tiens. Brenna a forgé cet anneau ici, à ses débuts. Il te revient.",
      "Il est un peu de travers, comme elle. Mais il tient bon."],
    lore:"Brenna a perdu toute sa famille pendant un hiver du Nord, après avoir prié des dieux qui n'ont jamais répondu. L'Ordre lui a promis un monde sans dieux. Mais les pages de son carnet montrent qu'elle doute, et Durgan garde l'enclume de Forgefeu ouverte pour elle." },
  { id:'q36', main:true, title:"La Braise d'Aube", npc:'durgan', goal:{ type:'clear', zone:'cratere' },
    reward:{ xp:7500, gold:3600, item:{ rarity:3 } },
    intro:["Le dragon <b>Ignarok</b> dort depuis mille ans au fond du cratère. L'Ordre l'a réveillé et enchaîné à sa volonté.",
      "La Braise d'Aube est là-haut, au milieu des flammes. Les nains ne peuvent pas t'accompagner dans le cratère, mais nos cœurs seront avec toi.",
      "Bonne chance, {héros}. Et toi aussi, le chat."],
    outro:["La Braise d'Aube est à toi, {héros}. Les nains l'ont gardée sans le savoir pendant des siècles. Il est temps qu'elle serve à ce pour quoi elle a été forgée.",
      "(Au bord du cratère, la silhouette masquée de l'Ordre a disparu avec Brenna, emportant un fragment d'inscription arraché à la forge des anciens. L'Ordre a désormais une piste vers la troisième relique.)"] },
  // ----- Acte VII : la Perle d'Aube -----
  { id:'q37', main:true, title:'Le port des naufrages', npc:'garrick', goal:{ type:'clear', zone:'quais' },
    reward:{ xp:7800, gold:3700, item:{ slot:'bottes', rarity:2 } },
    intro:["{héros}, j'ai suivi la piste de l'Ordre depuis le volcan. Le fragment d'inscription qu'ils ont volé les mène vers l'ouest, jusqu'à la mer.",
      "Il y a un port là-bas, <b>Port-Écume</b>. On dit que des navires marqués d'un <b>soleil noir</b> y recrutent tous les marins qu'ils trouvent.",
      "Prends la route de la côte. Je te rejoins sur les quais."],
    outro:["Ces marins se battaient comme des forcenés ! L'Ordre les paie bien, on dirait.",
      "Un vieux pêcheur m'a raconté que leurs navires partent tous vers un <b>tourbillon</b>, au large. Une cité serait engloutie dessous, depuis des siècles.",
      "Une cité sous la mer… et sans doute une Relique de l'Aube au fond. Il faut trouver un moyen d'y descendre."] },
  { id:'s27', title:'Les quais de Port-Écume', npc:'garrick', startsWith:'q37', goal:{ type:'kill', monster:'marin', n:8 },
    reward:{ xp:2700, gold:950 },
    intro:["Les marins de l'Ordre font la loi sur les quais. Chasses-en huit, que les pêcheurs puissent reprendre la mer."],
    outro:["Huit marins de moins ! Les pêcheurs de Port-Écume t'offrent le meilleur poisson du port. Forest approuve."] },
  { id:'q38', main:true, title:'Le peuple des vagues', npc:'coralie', goal:{ type:'clear', zone:'recifs' },
    reward:{ xp:8100, gold:3850, item:{ slot:'cape', rarity:2 } },
    intro:["(En longeant la plage, des silhouettes surgissent des vagues. Des lances t'encerclent. Forest gonfle sa queue et crache.)",
      "Encore un homme de la surface. Ceux de ton espèce empoisonnent nos récifs avec leur magie noire. Pourquoi te ferais-je confiance ?",
      "Je suis <b>Coralie</b>, la reine des tritons. Prouve ta bonne foi : libère nos <b>récifs</b> des créatures que l'Ordre a corrompues."],
    outro:["Tu t'es battu pour notre peuple sans rien demander en retour. Je me suis trompée sur toi, {héros}.",
      "Prends ceci : la <b>perle des profondeurs</b>. Tant que tu la porteras, tu respireras sous l'eau comme l'un des nôtres.",
      "(Forest renifle la perle d'un air méfiant.) Ne t'inquiète pas, petit chat. Elle marche aussi pour toi."] },
  { id:'s28', title:'Pinces et carapaces', npc:'coralie', startsWith:'q38', goal:{ type:'kill', monster:'crabe', n:8 },
    reward:{ xp:2800, gold:980, item:{ rarity:2 } },
    intro:["Les crabes géants ravagent nos bancs de corail. Chasses-en huit, et je te ferai forger quelque chose dans leur carapace."],
    outro:["Huit crabes ! Voici une pièce taillée dans la plus dure de leurs carapaces."] },
  { id:'q39', main:true, title:'La cité engloutie', npc:'coralie', goal:{ type:'clear', zone:'thalassar' },
    reward:{ xp:8400, gold:4000, item:{ slot:'coiffe', rarity:2 } },
    intro:["Sous le tourbillon dort <b>Thalassar</b>, la cité de nos ancêtres. Une bulle de lumière la garde au sec depuis des siècles.",
      "L'Ordre y fouille déjà. Mes éclaireurs ont vu une jeune femme aux bras tatoués donner les ordres.",
      "Plonge avec nous, {héros}. La perle te protégera."],
    outro:["(Au cœur de la cité, la bulle de lumière vibre doucement. Elle vient d'un autel tout au fond, gardé par l'Ordre.)",
      "Cette lumière… c'est la Relique de l'Aube. C'est elle qui retient la mer au-dessus de Thalassar.",
      "Si quelqu'un la prend, la cité s'effondrera. Et si l'Ordre la prend, il ne s'en souciera pas une seconde."] },
  { id:'s29', title:'Courants électriques', npc:'coralie', startsWith:'q39', goal:{ type:'kill', monster:'anguille', n:6 },
    reward:{ xp:2900, gold:1010 },
    intro:["Des anguilles électriques rôdent dans les rues de Thalassar. Leurs décharges blessent nos enfants. Éloignes-en six."],
    outro:["Six anguilles ! Les rues de la cité sont de nouveau sûres."] },
  { id:'q40', main:true, title:'Le doute de Brenna', npc:'coralie', goal:{ type:'clear', zone:'jardins' },
    reward:{ xp:8700, gold:4150, item:{ slot:'anneau', rarity:2 } },
    intro:["Il y a quelques jours, mes guérisseurs ont soigné une naufragée dans nos <b>jardins de corail</b>. Elle avait de vilaines brûlures.",
      "Elle a disparu cette nuit. Et depuis, les jardins grouillent de créatures. Va voir, {héros}."],
    outro:["(Au fond des jardins, tu retrouves <b>Brenna</b>, un bras encore bandé. Elle lève son marteau… puis le baisse.)",
      "« Les tritons m'ont soignée sans savoir qui j'étais. Personne n'avait jamais fait ça pour moi. »",
      "« Écoute-moi, {héros}. Le <b>Maître</b> veut toutes les reliques. Avec elles, il veut briser la <b>prison du Nécromancien</b>. »",
      "(Elle s'éloigne vers la sortie des jardins, sans se retourner. Forest la regarde partir.)",
      "Elle a hésité, {héros}. Je l'ai vu dans ses yeux. Et maintenant, j'ai une idée : si la relique tient la cité, peut-être que <b>notre chant</b> peut prendre sa place."] },
  // Longue quête (Acte VII) : le premier couplet du chant des tritons, puis escorter Coralie jusqu'au chœur
  { id:'l5', title:'Le chant de Thalassa', npc:'coralie', startsWith:'q40',
    reward:{ xp:7000, gold:2500, item:{ slot:'amulette', rarity:2, name:'Conque de Thalassa' } },
    intro:["Notre chant peut remplacer la lumière de la relique… mais il nous manque son <b>premier couplet</b>, {héros}. Il s'est perdu quand la cité a sombré.",
      "Nos anciens l'avaient confié à des <b>coquillages chantants</b>, cachés dans les Récifs, à Thalassar et dans les Jardins de corail. Retrouve-les, je t'en prie."],
    steps:[
      { goal:{ type:'clue', label:'Retrouver les coquillages chantants', clues:[
          { zone:'recifs', name:'Un coquillage nacré', text:"Tu le portes à ton oreille. Une voix très ancienne chante : « Thalassa, mère des eaux, tu as tendu la main aux rois de la terre… »" },
          { zone:'thalassar', name:'Un coquillage fêlé', text:"La voix chante, un peu cassée : « … et tu as promis : tant qu'un roi de l'Aube régnera, la cité ne sombrera pas… »" },
          { zone:'jardins', name:'Un coquillage rose', text:"« … Quand le dernier roi tomba, l'eau se referma sur nous. Mais l'Aube se lèvera encore. »" }] },
        end:"Le couplet est complet. Coralie l'attend à Port-Écume." },
      { goal:{ type:'talk', npc:'coralie', zone:'portecume', item:'les coquillages chantants', lines:[
          "Le premier couplet… Il parle de <b>Thalassa</b>, la déesse des eaux, qui veillait autrefois sur les rois de l'Aube.",
          "Je dois l'apprendre à notre chœur, mais l'Ordre surveille chaque passage. Accompagne-moi jusqu'aux Jardins de corail : le chœur s'y rassemble en secret."] } },
      { goal:{ type:'escort', npc:'coralie', zone:'jardins', foes:['triton','marin','meduse'], lines:[
          "(Entre les coraux, des tritons aux yeux noirs vous barrent la route.)",

const MAIN = QUESTS.filter(q => q.main);
const questById = id => QUESTS.find(q => q.id===id);
// quêtes en plusieurs étapes : q.goal est l'objectif de l'étape en cours (qs(q).step)
for (const q of QUESTS) if (q.steps) Object.defineProperty(q, 'goal', { get() { const st = G.profile && G.profile.quests[q.id]; return q.steps[Math.min(st && st.step || 0, q.steps.length-1)].goal; } });
const XP_MAX_LEVEL = 70;
const xpNeed = lv => 70 + 70*lv; // x1,4 (06/10 : x2 bloquait le robot à l'acte II)
const heroName = () => G.profile.name || CLASSES[G.profile.cls].name;
const fillHero = t => t.replaceAll('{héros}', heroName());
const qs = q => G.profile.quests[q.id];
const activeQuests = () => QUESTS.filter(q => qs(q) && qs(q).state==='active');
const forClass = q => !q.cls || q.cls===G.profile.cls; // quêtes de classe : seulement pour cette classe

function levelBonusText(lv) {
  const b = [`+${LV_HP} PV max`, `+${Math.round(LV_DMG*100)} % de dégâts`, `+${CARAC_PER_LV} points de caractéristique`];
  if (PM_LEVELS.includes(lv)) b.push('+1 PM');
  if (PA_LEVELS.includes(lv)) b.push('+1 PA');
  for (const sp of CLASSES[G.profile.cls].spells) if (sp.lvl===lv) b.push(`nouveau sort : ${sp.name}`);
  for (const sp of CLASSES[G.profile.cls].spells) if (rankLevels(sp).includes(lv)) b.push(`${sp.name} passe au rang ${rankAt(sp, lv)}`);
  return b.join(', ');
}
// barre d'XP : « from » = niveau et XP avant le gain (fin de combat), la part gagnée se remplit en doré
function xpBarHtml(from) {
  const p = G.profile, max = p.level >= XP_MAX_LEVEL, need = xpNeed(p.level), pct = max ? 100 : Math.min(100, 100*p.xp/need);
  const start = !from ? pct : from.lv === p.level ? 100*from.xp/need : 0, gain = Math.max(0, pct - start);
  const lbl = from && from.lv < p.level ? `Niveau ${from.lv} → <b>${p.level}</b> !` : `Niveau ${p.level}`;
  return `<div class="xpbar"><div class="xplbl"><b>${lbl}</b><span>${max ? 'Niveau maximum' : `${p.xp} / ${need} XP · encore ${need - p.xp} XP`}</span></div><div class="xpb"><div class="old" style="width:${start}%"></div>${gain ? `<div class="new" style="left:${start}%;width:${gain}%"></div>` : ''}</div></div>`;
}
const xpFrom = () => ({ lv:G.profile.level, xp:G.profile.xp });
function addXp(n) {
  const p = G.profile, ups = [];
  p.xp += n;
  while (p.level < XP_MAX_LEVEL && p.xp >= xpNeed(p.level)) { p.xp -= xpNeed(p.level); p.level++; ups.push(p.level); }
  if (p.level >= XP_MAX_LEVEL) p.xp = 0;
  return ups;
}
function levelUpHtml(ups) { if (!ups.length) return ''; setTimeout(updateCharBtn);
  const n = ups.length, cnt = l => ups.filter(lv => l.includes(lv)).length, pm = cnt(PM_LEVELS), pa = cnt(PA_LEVELS), s = (k, w) => k > 1 ? w + 's' : w;
  const chips = [`+${LV_HP*n} PV max`, `+${Math.round(LV_DMG*100)*n} % de dégâts`, `+${CARAC_PER_LV*n} ${s(CARAC_PER_LV*n, 'point')} de caractéristique`];
  if (pa) chips.push(`+${pa} PA`); if (pm) chips.push(`+${pm} PM`);
  for (const sp of CLASSES[G.profile.cls].spells) if (ups.includes(sp.lvl)) chips.push(`✨ Nouveau sort : ${sp.name}`);
  for (const sp of CLASSES[G.profile.cls].spells) { const l = rankLevels(sp).filter(x => ups.includes(x)).pop(); if (l) chips.push(`⬆ ${sp.name} passe au rang ${rankAt(sp, l)}`); }
  return `<div class="lvcard"><h4>⭐ ${n > 1 ? `Niveaux ${ups[0]} à ${ups[n-1]}` : `Niveau ${ups[0]}`} atteint !</h4><div class="chips">${chips.map(c => `<span>${c}</span>`).join('')}</div>
    <p class="help">Répartis tes points dans <b>Personnage (C)</b>.</p></div>`; }

const equippedCount = g => Object.values(G.profile.equip).filter(Boolean).length + (g.pet ? 1 : 0);
function goalText(q) {
  const g = q.goal, st = qs(q), pre = q.steps ? `Étape ${Math.min(st && st.step || 0, q.steps.length-1) + 1}/${q.steps.length} · ` : '';
  if (g.type==='talk') return pre + `${g.item ? `Apporter ${g.item} à` : 'Parler à'} ${NPCS[g.npc].name.split(',')[0]} (${zoneById(g.zone).name})`;
  if (g.type==='escort') return pre + `Escorter ${NPCS[g.npc].name.split(',')[0]} jusqu'à : ${zoneById(g.zone).name}`;
  if (g.type==='clue') { const f = st && st.found || [], left = g.clues.filter((c,i) => !f.includes(i));
    return pre + `${g.label}${g.clues.length > 1 ? ` (${f.length}/${g.clues.length})` : ''} : ${[...new Set(left.map(c => zoneById(c.zone).name))].join(', ')}`; }
  return pre + goalLine(q);
}
function goalLine(q) {
  const g = q.goal, st = qs(q), n = st ? Math.min(st.n||0, g.n||0) : 0;
  if (g.type==='clear') return `Libérer : ${zoneById(g.zone).name}`;
  if (g.type==='kill') return `Vaincre ${g.n} ${g.label || PLURAL[g.monster]} (${n}/${g.n})`;
  if (g.type==='craft') { const r = RECIPES.find(r => r.id===g.recipe), j = jobs();
    return `Fabriquer : ${recipeName(r, G.profile.cls)} à l'atelier d'Aubépine (${n}/${g.n}). Il faut ${Object.entries(r.need).map(([id,k]) => `${ingName(id)} ${Math.min(k, j.res[id]||0)}/${k}`).join(', ')}`; }
  return g.pet ? `Équiper les ${g.n} emplacements, Forest compris (${equippedCount(g)}/${g.n})` : `Équiper ${g.n} objets (${equippedCount(g)}/${g.n})`;
}
function rewardText(r) {
  return [`${r.xp} XP`, `${r.gold} or`, r.item ? `un objet ${RARITIES[r.item.rarity].name.toLowerCase()}${r.item.slot ? ` (${SLOTS[r.item.slot].toLowerCase()})` : ''}` : null, r.cons ? Object.entries(r.cons).map(([k,n]) => `${n} × ${CONS[k].name}`).join(', ') : null].filter(Boolean).join(' · ');
}
function startQuest(q) {
  const p = G.profile;
  if (p.quests[q.id]) return;
  p.quests[q.id] = { state:'active', n:0 };
  if (q.main) p.story = MAIN.indexOf(q);
  save(); refreshMapTitle(); dirty = true;
  if (q.goal.type==='equip') checkEquipQuests(); // déjà assez équipé : la quête se valide tout de suite
}
// quêtes « équiper N objets » déjà remplies (équipement porté avant d'accepter la quête, ou anciennes sauvegardes)
function checkEquipQuests() { if (activeQuests().some(q => q.goal.type==='equip' && equippedCount(q.goal) >= q.goal.n)) progressQuests(); }
function introScene(q) {
  return { npc:q.npc, title: (q.main ? 'Quête principale : ' : 'Quête secondaire : ') + q.title, pages:q.intro,
    last:`<p class="goal">🎯 ${goalText({ ...q, goal:q.goal })}<br><small>Récompense : ${rewardText(q.reward)}</small></p>`, btn:'Accepter la quête', onDone:() => startQuest(q), talk:true, quest:q.id };
}
// Fait progresser les quêtes ; event = { kills:{gobelin:2,…}, cleared:'zoneId' }
function progressQuests(event={}) {
  const p = G.profile, done = [];
  for (const q of activeQuests()) {
    const g = q.goal, st = qs(q);
    if (g.type==='craft' && event.crafted===g.recipe) st.n = (st.n||0) + 1;
    if (g.type==='kill' && event.kills) st.n = (st.n||0) + [].concat(g.monster).reduce((a,m) => a + (event.kills[m]||0), 0);
    const ok = g.type==='talk' ? event.talked===g.npc && event.at===g.zone
      : g.type==='clue' ? g.clues.every((c,i) => (st.found||[]).includes(i))
      : g.type==='escort' ? event.escorted===g.zone
      : g.type==='clear' ? event.cleared===g.zone
      : g.type==='kill' ? st.n >= g.n
      : g.type==='craft' ? (st.n||0) >= g.n
      : equippedCount(g) >= g.n;
    if (ok && q.steps && (st.step||0) < q.steps.length-1) nextStep(q);
    else if (ok) done.push(q);
  }
  for (const q of done) { if (q.steps) stepScene(q, q.steps[q.steps.length-1]); completeQuest(q); }
  save();
  return done;
}
// fin d'une étape : ce que dit le PNJ à qui l'on vient de parler (ou step.say), puis l'objectif suivant
function stepScene(q, s, next) {
  const say = s.say || (s.goal.type==='talk' ? { npc:s.goal.npc, pages:s.goal.lines } : null);
  if (say) G.scenes.push({ npc:say.npc, title:q.title, pages:say.pages, last: next ? `<p class="goal">🎯 ${goalText(q)}</p>` : '', btn:'Continuer' });
}
function nextStep(q) {
  const st = qs(q), s = q.steps[st.step||0];

function completeQuest(q) {

  if (r.item) { const tier = Math.min(9, MAIN.indexOf(q)>=0 ? MAIN.indexOf(q) : p.story); item = genItem(tier, p.cls, r.item.slot, r.item.rarity); if (r.item.name) item.name = r.item.name; if (r.item.names && r.item.names[p.cls]) item.name = r.item.names[p.cls]; if (!addToBag(item)) item.sold = true; }

    const fb = FOREST_STEPS[MAIN.indexOf(q)+1];
    if (fb) G.scenes[G.scenes.length-1].last += `<div class="lvcard forest"><h4>🐈‍⬛ Forest grandit avec toi${fb.pa||fb.pm||fb.act ? ' (bonus de fin d\'acte)' : ''}</h4><div class="chips">${statText(fb).split(' · ').map(c => `<span>${c}</span>`).join('')}</div></div>`;
    const look = fb && (fb.pa||fb.pm||fb.act) && FOREST_LOOKS.find(([n]) => n === forestActs(MAIN.indexOf(q)+1));

    const rel = RELICS.find(r => r.chapter === MAIN.indexOf(q)+1);
    if (rel) G.scenes[G.scenes.length-1].last += `<p class="goal">✨ Tu as obtenu une Relique de l'Aube (${RELICS.indexOf(rel)+1}/${RELIC_SLOTS}) : <b>${rel.name}</b> (${statText(rel.stats)}). Elle occupe son emplacement dans ton équipement.</p>`;
    if (q.vision) G.scenes.push({ npc:'vision', title:q.vision.title, pages:q.vision.pages, btn:'Continuer' });
    const ae = actEnds().indexOf(MAIN.indexOf(q)); if (ae >= 0) { G.scenes.push({ cine:ae, npc:'vision', title:'Fin de l\'acte', pages:[''], btn:'Continuer' }); G.scenes.push({ backup:true, npc:'vision', title:'Sauvegarde', pages:[''] }); } // scène animée de fin d'acte, puis proposition de sauvegarde
    const next = MAIN[MAIN.indexOf(q)+1];
    p.story = next ? MAIN.indexOf(next) : MAIN.length;
    if (next) queueIntros(next);
  }
}
function queueIntros(q) {
  G.scenes.push(introScene(q));
  for (const s of QUESTS.filter(s => s.startsWith===q.id && forClass(s) && !G.profile.quests[s.id])) G.scenes.push(introScene(s));
}
// Relance la quête principale si le joueur a quitté le jeu avant de l'accepter
function ensureStory() {
  const p = G.profile, q = MAIN[p.story];
  if (q && !p.quests[q.id] && !G.scenes.some(s => s.title.endsWith(q.title))) queueIntros(q);
  for (const s of QUESTS.filter(s => s.startsWith && forClass(s) && p.quests[s.startsWith] && !p.quests[s.id] && !G.scenes.some(x => x.title.endsWith(s.title)))) G.scenes.push(introScene(s));
}
function showNextScene() {

  const sc = G.scenes.splice(G.scenes.findIndex(s => !s.talk), 1)[0], npc = NPCS[sc.npc];

  for (let x=0; x<=CINE_W; x+=8) c.lineTo(x, y + Math.sin(x/170 + seed)*amp + Math.sin(x/61 + seed*3)*amp*0.35); c.lineTo(CINE_W, CINE_H); c.fill(); }

function playCine(shots, done) {

  const box = document.createElement('div'); box.id = 'cine';
  box.innerHTML = `<canvas width="${CINE_W}" height="${CINE_H}"></canvas><div class="cine-txt"></div><button class="btn alt" id="cineSkip">Passer ▸▸ <small>(Échap)</small></button><small class="cine-help">Clic ou Espace pour continuer</small>`;

    if (st.shot >= shots.length-1) return end();

function playActEnd(n, done) { if (ACT_SHOTS[n]) playCine(ACT_SHOTS[n], done); else if (done) done(); }
function showGuides(back) {
  const k = t => `<kbd>${t}</kbd>`;
  overlay(`<h2>Guides · Héritiers de l'Aube</h2>
    <h3>Le but</h3><p>Le Cristal d'Aubépine, ton village, a été volé. Suis les <b>quêtes principales (★)</b> du journal : elles font avancer l'histoire et ouvrent de nouvelles régions. Les quêtes secondaires rapportent de l'expérience, de l'or et des objets. Forest, ton chat noir, devient plus fort à chaque chapitre.</p>
    <h3>Le combat</h3><ul class="guide">
      <li>Chaque tour, tu as des <b style="color:var(--pa)">PA</b> pour lancer des sorts et des <b style="color:var(--pm)">PM</b> pour te déplacer d'une case par PM. Ils reviennent à chaque tour.</li>
      <li>Les cases <b style="color:#5ad16a">vertes</b> montrent où tu peux aller. Les cases <b style="color:#4aa3ff">bleues</b> montrent la portée du sort choisi (plus claires : pas de ligne de vue).</li>
      <li>Les rochers et les arbres bloquent le passage et la ligne de vue. L'eau bloque seulement le passage.</li>
      <li>Survole un ennemi pour voir sa vie et ses déplacements possibles (en orange). Avec un sort choisi, tu vois les PV qu'il lui restera, ses dégâts en coup critique et une tête de mort si l'attaque le tue à coup sûr.</li>
      <li>Chaque niveau donne 5 points de caractéristique (Vitalité, Force, Agilité, Sagesse) à répartir dans <b>Personnage (C)</b>. Tes sorts montent de rang tout seuls avec ton niveau, jusqu'au rang 5.</li>
      <li>Chaque attaque a ${Math.round(CRIT_CHANCE*100)} % de chance (plus avec l'Agilité) d'être un <b style="color:#ffd04a">coup critique</b> (+50 % de dégâts), pour toi comme pour les monstres.</li>
      <li>Avant d'agir, un ennemi montre son chemin (orange) ou la zone qu'il vise (rouge).</li></ul>
    <h3>Les commandes</h3><table class="keys">
      <tr><td>${k('&amp;')} ${k('é')} ${k('"')} ${k("'")} ${k('(')} ${k('§')}</td><td>Choisir un sort (les chiffres 1 à 6 marchent aussi)</td></tr>
      <tr><td>Clic</td><td>Hors combat : marcher, ou parler à un personnage. En combat : se déplacer ou lancer le sort choisi</td></tr>
      <tr><td>Clic droit / ${k('Échap')}</td><td>Annuler le sort choisi, fermer une fenêtre</td></tr>
      <tr><td>${k('Espace')} / ${k('Entrée')}</td><td>Finir ton tour</td></tr>
      <tr><td>${k('M')}</td><td>Carte du monde</td></tr>
      <tr><td>${k('Q')}</td><td>Journal de quêtes</td></tr>
      <tr><td>${k('E')} / ${k('I')}</td><td>Équipement et sac</td></tr>
      <tr><td>${k('Ctrl')} + ${k('Z')}</td><td>Annuler la dernière vente (jusqu'au prochain combat)</td></tr>
      <tr><td>${k('G')}</td><td>Ces guides</td></tr>
      <tr><td>${k('H')}</td><td>Résumé de l'histoire</td></tr>
      <tr><td>${k('F')}</td><td>Hauts faits : tes exploits, leurs points et les titres à afficher</td></tr>
      <tr><td>${k('J')}</td><td>Métiers : niveaux, ressources, consommables et recettes</td></tr>
      <tr><td>${k('F2')}</td><td>Mode test (vitesse, saut de chapitre…)</td></tr></table>
    <p class="help">La touche qui ouvre une fenêtre la referme aussi.</p>
    <h3>Conseils</h3><ul class="guide">
      <li>Équipe tout de suite les objets trouvés : le sac indique s'ils sont meilleurs que ce que tu portes. Revends le reste au marchand.</li>
      <li>Le marchand change de stock après chaque combat.</li>
      <li>Métiers : Paysan, Bûcheron et Mineur. Clique sur les blés, arbres et filons entourés d'or pour les récolter, garde les ressources que laissent les monstres, puis fabrique potions, repas et équipement à l'atelier des villages (touche J).</li>
      <li>Chaque région a sa panoplie (nom en vert) : porter 2, 3 ou 4 de ses pièces donne des bonus en plus. Certains objets donnent aussi de la Portée, qui allonge les sorts « portée modifiable » (pas le corps à corps).</li>
      <li>Si un combat est trop dur, refais des zones déjà libérées pour gagner des niveaux et de l'équipement.</li>
      <li>Garde tes PM pour te mettre hors de portée après avoir attaqué, surtout avec le Mage.</li>
      <li>Les sorts de zone touchent plusieurs ennemis : attends qu'ils se regroupent.</li></ul>
    <h3>Sauvegarde</h3><p>Le jeu sauvegarde tout seul. Sur l'écran d'accueil, tu peux avoir plusieurs personnages et lier un fichier de sauvegarde sur ton PC (Chrome ou Edge) pour ne rien perdre si tu effaces tes données de navigation. Le bouton 💾 exporte un personnage.</p>
